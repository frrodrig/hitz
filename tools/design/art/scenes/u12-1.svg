<!-- Unai juega en el frontón. Source of truth for tools/design/cast_to_vector.py: the star challenge's scene for u12-1, in a
     200 x 200 viewBox shown in a circle. Shapes before data-host are behind the host, the rest in front;
     data-host="x y height" places the host. data-motion names a Motion in CastMotion.kt, data-pivot its pivot. -->
