# Se aplica sobre la configuración por defecto de detekt (buildUponDefaultConfig).
config:
  validation: true

naming:
  # Los ficheros *Navigation.kt agrupan la ruta y sus extensiones de navegación.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.gradle.kts', '**/designsystem/**', '**/preview/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark', 'PreviewFontScale']
  WildcardImport:
    excludeImports: []

formatting:
  active: true
  android: true
  autoCorrect: true
  MaximumLineLength:
    maxLineLength: 120
  ParameterListWrapping:
    maxLineLength: 120
