# Applied on top of detekt's default configuration (buildUponDefaultConfig).
config:
  validation: true

naming:
  # *Navigation.kt files group a route with its navigation extensions.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  # Exhaustive `when`s over sealed exercise types are one branch per type, not complex logic.
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    ignoreAnnotated: ['Preview', 'PreviewLightDark', 'HitzPreviews']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.gradle.kts', '**/designsystem/**', '**/preview/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark', 'PreviewFontScale', 'HitzPreviews']
  WildcardImport:
    excludeImports: []

formatting:
  active: true
  android: true
  autoCorrect: true
  MaximumLineLength:
    maxLineLength: 120
  ParameterListWrapping:
    maxLineLength: 120
