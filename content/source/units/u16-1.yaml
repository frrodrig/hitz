# Unit 16.1 · Nor bezalakoa? — A2.1 book unit 4 (Atarian + A): who one looks like; comparing
# people's looks, ways and habits; objections and contrasts. NOREN ANTZA EDUKI / IZAN; BEZALA
# against BEZALAKO(A)(K); concessive NAHIZ ETA + verb and -ARREN; contrast with ORDEA and BERRIZ.
# Recall: baina (1.2), NOREN (3.1).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u16-1
section: s6
bookUnit: 16
title:
  es: ¿A quién te pareces?
  eu: Nor bezalakoa?
goals:
  - es: Decir a quién te pareces y comparar el aspecto de las personas.
    eu: Esan zeinen antza duzun eta pertsonen itxura alderatu.
  - es: Comparar maneras de ser y costumbres.
    eu: Izaerak eta ohiturak alderatu.
  - es: Expresar contrastes y objeciones con «aunque».
    eu: Kontrasteak eta eragozpenak adierazi «nahiz eta» erabiliz.
guidebook:
  sections:
    - title:
        es: "Parecerse a alguien: amaren antza daukat"
        eu: "Norbaiten antza izan: amaren antza daukat"
      body:
        es: "Para decir a quién te pareces, la persona va con -(r)en y después «antza» con «daukat» o «dut»: «amaren antza daukat» (me parezco a mi madre). En negativo, «antzik»: «ez daukat aitaren antzik»."
        eu: "Norbaiten antza duzula esateko, pertsonak -(r)en hartzen du, eta gero «antza» dator, «daukat» edo «dut» aditzarekin: «amaren antza daukat». Ezezkoan, «antzik»: «ez daukat aitaren antzik»."
      examples:
        - eu: Amaren antza daukat.
          es: Me parezco a mi madre.
        - eu: Ez dut aitaren antzik.
          es: No me parezco a mi padre.
        - eu: Zure ahizpak zure antz handia du.
          es: Tu hermana se parece mucho a ti.
    - title:
        es: "«Como»: bezala o bezalakoa"
        eu: "Bezala ala bezalakoa"
      body:
        es: "Las dos son «como» en castellano. «Bezala» dice cómo se hace algo (pregunta «nola?»): «aitona bezala ibiltzen da». «Bezalakoa» dice cómo es algo o alguien (pregunta «nolakoa?»): «aita bezalakoa da». Delante de un nombre, «bezalako»: «zu bezalako lagunak»."
        eu: "Biak «como» dira gaztelaniaz. «Bezala»k zerbait nola egiten den esaten du («nola?»): «aitona bezala ibiltzen da». «Bezalakoa»k zerbait edo norbait nolakoa den («nolakoa?»): «aita bezalakoa da». Izen baten aurrean, «bezalako»: «zu bezalako lagunak»."
      examples:
        - eu: Aitona bezala ibiltzen da.
          es: Anda como su abuelo.
        - eu: Ama bezalakoa da.
          es: Es como su madre.
        - eu: Zu bezalako lagunak behar ditut.
          es: Necesito amigos como tú.
    - title:
        es: "Aunque: nahiz eta… / …-(e)n arren"
        eu: "Nahiz eta… / …arren"
      body:
        es: "«Nahiz eta» va delante y el verbo pierde el auxiliar: «nahiz eta baxua izan» (aunque es bajo). Con «arren» el verbo puede conservar el auxiliar: «euria egin arren» o «euria egiten duen arren» (aunque llueve)."
        eu: "«Nahiz eta» aurrean doa, eta aditzak ez du laguntzailerik: «nahiz eta baxua izan». «Arren»ekin aditzak laguntzailea izan dezake: «euria egin arren» edo «euria egiten duen arren»."
      examples:
        - eu: Nahiz eta baxua izan, saskibaloian ondo jokatzen du.
          es: Aunque es bajo, juega bien al baloncesto.
        - eu: Euria egin arren, mendira joan ginen.
          es: Aunque llovía, fuimos al monte.
    - title:
        es: "En cambio: ordea, berriz"
        eu: "Ordea, berriz"
      body:
        es: "Como «baina», contraponen dos ideas, pero van detrás de la primera palabra de la segunda frase: «Nik kafea hartzen dut; nire anaiak, berriz, tea»."
        eu: "«Baina» bezala, bi ideia kontrajartzen dituzte, baina bigarren esaldiaren lehen hitzaren ondoren doaz: «Nik kafea hartzen dut; nire anaiak, berriz, tea»."
      examples:
        - eu: Nire anaia kirolaria da; ni, berriz, ez.
          es: Mi hermano es deportista; yo, en cambio, no.
        - eu: Jonek asko hitz egiten du; bere bikiak, ordea, oso gutxi.
          es: Jon habla mucho; su gemelo, en cambio, muy poco.
