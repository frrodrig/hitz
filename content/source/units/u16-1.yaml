  - type: story
    title:
      es: "Historia: los gemelos"
      eu: "Istorioa: bikiak"
    story:
      title: Bikiak
      lines:
        - Leire | Begira argazki hau! Nor da mutil hau, zu ala zure bikia? = ¡Mira esta foto! ¿Quién es este chico, tú o tu gemelo?
        - Jon | Hori Iker da, nire bikia. Ile kizkurra du; nik, berriz, ile luzea. = Ese es Iker, mi gemelo. Él tiene el pelo rizado; yo, en cambio, el pelo largo.
        - Leire | Bai antza duzuen! Aurpegi berdina duzue. = ¡Cómo os parecéis! Tenéis la misma cara.
        - Jon | Aurpegia bai, baina oso desberdinak gara. Iker kirolaria da; ni, ordea, ez. = La cara sí, pero somos muy diferentes. Iker es deportista; yo, en cambio, no.
        - Leire | Eta noren antza duzue, amarena ala aitarena? = ¿Y a quién os parecéis, a vuestra madre o a vuestro padre?
        - Jon | Ikerrek aitaren antza du; aita bezala ibiltzen da eta aita bezala egiten du barre. = Iker se parece a nuestro padre; anda como él y se ríe como él.
        - Leire | Eta zuk? = ¿Y tú?
        - Jon | Ni amona bezalakoa naiz. Amonak eta nik liburuak maite ditugu, eta lotsa ematen digu jende askoren aurrean hitz egiteak. = Yo soy como mi abuela. Mi abuela y yo adoramos los libros, y nos da vergüenza hablar delante de mucha gente.
        - Leire | Lotsa izan arren, oso lagun ona zara! = Aunque tengas vergüenza, ¡eres muy buen amigo!
      questions:
        - afterLine: 2
          prompt: ¿En qué se diferencian Jon e Iker a primera vista?
          options:
            - En el pelo
            - En la cara
            - En la voz
        - afterLine: 6
          prompt: ¿A quién se parece Iker?
          options:
            - A su padre
            - A su madre
            - A su abuela
        - afterLine: 8
          prompt: ¿Qué le da vergüenza a Jon?
          options:
            - Hablar delante de mucha gente
            - Leer libros
            - Hacer deporte
  - type: review
  - type: challenge
    host: ane
