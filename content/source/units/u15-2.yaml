            options:
              - Ea bidaia zaila izan den.
              - Bidaia zaila izan da.
              - Bidaia zaila izango da.
        images:
          - sea, trip, plane
      - structures: [zehar-galdera, kontatu]
        sentences:
          - Non bizi den galdetu diot. = Le he preguntado dónde vive.
          - Zer egiten duen galdetu dit. = Me ha preguntado qué hace.
          - Ea etorriko den galdetu dute. = Han preguntado si vendrá.
          - Noiz itzuliko den ez dakigu. = No sabemos cuándo volverá.
          - Ea dena ondo dagoen galdetu dit amak. = Mi madre me ha preguntado si todo está bien.
          - Gidariari ea logura duen galdetu diot. = Le he preguntado al conductor si tiene sueño.
        pairs:
          - - galdetu = preguntar
            - ea = si (pregunta)
            - logura = sueño
            - gidari = conductor
            - mugikor = móvil
        blanks:
          - text: Ea etorriko ___ galdetu dute. = Han preguntado si vendrá.
            options:
              - den
              - da
              - dela
        chats:
          - messages:
              - Ama | Zer galdetu dizu Itziarrek?
