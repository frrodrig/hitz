          - Familiarekin egunero hitz egin dut. = He hablado con la familia todos los días.
          - Abentura hau zoragarria izan da. = Esta aventura ha sido maravillosa.
          - Itsasoa arriskutsua da neguan. = El mar es peligroso en invierno.
