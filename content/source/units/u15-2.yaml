  - type: story
    title:
      es: "Historia: la comida familiar"
      eu: "Istorioa: familia-bazkaria"
    story:
      title: Familia-bazkaria
      lines:
        - Miren | Ama, begira! Nor da gizon hori? = ¡Mamá, mira! ¿Quién es ese hombre?
        - Ama | Zure osaba Josu da! Ez duzu ezagutzen? = ¡Es tu tío Josu! ¿No lo conoces?
        - Miren | Josu? Benetan? Zein aldatuta dagoen! = ¿Josu? ¿De verdad? ¡Qué cambiado está!
        - Ama | Bai, duela hamar urte ikusi zenuen. = Sí, lo viste hace diez años.
        - Miren | Bai zahartu dela! Eta ez du batere ilerik! = ¡Sí que ha envejecido! ¡Y no tiene nada de pelo!
        - Josu | Kaixo, Miren! A zer-nolako neska handia! = ¡Hola, Miren! ¡Vaya chica tan mayor!
        - Miren | Kaixo, osaba! Zer moduz? = ¡Hola, tío! ¿Qué tal?
        - Josu | Oso ondo. Galdetu dut ea Londresen bizi zaren. Egia da? = Muy bien. He preguntado si vives en Londres. ¿Es verdad?
        - Miren | Bai, bi urte daramatzat han, lanagatik. = Sí, llevo dos años allí, por el trabajo.
        - Josu | Zoragarria! = ¡Maravilloso!
      questions:
        - afterLine: 3
          prompt: ¿Por qué se sorprende Miren?
          options:
            - Porque su tío ha cambiado mucho
            - Porque su tío vive en Londres
            - Porque no conoce a su madre
        - afterLine: 5
          prompt: ¿Cómo está ahora el tío Josu?
          options:
            - Más mayor y sin pelo
            - Más joven y con barba
            - Igual que antes
        - afterLine: 9
          prompt: ¿Por qué vive Miren en Londres?
          options:
            - Por el trabajo
            - Por sus estudios
            - Por su familia
