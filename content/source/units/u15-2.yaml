    lessons:
      - structures: [zehar-galdera]
        sentences:
          - Olatzi elkarrizketa bat egin diogu. = Le hemos hecho una entrevista a Olatz.
          - Urte bat pasatu du belaontzian. = Ha pasado un año en velero.
          - Zenbat denbora pasatu duzu itsasoan? = ¿Cuánto tiempo has pasado en el mar?
          - Itsasoan zenbat denbora pasatu duen galdetu diogu. = Le hemos preguntado cuánto tiempo ha pasado en el mar.
          - Ea bidaia zaila izan den galdetu dut. = He preguntado si el viaje ha sido difícil.
          - Ea arazorik izan duen galdetu diogu. = Le hemos preguntado si ha tenido problemas.
          - Bi arazo izan dituela esan digu. = Nos ha dicho que ha tenido dos problemas.
          - Abentura berri bat egin nahi duela esan du. = Ha dicho que quiere hacer una aventura nueva.
        pairs:
          - - elkarrizketa = entrevista
            - belaontzi = velero
            - abentura = aventura
            - arazo = problema
            - itsaso = mar
        blanks:
          - text: Itsasoan zenbat denbora pasatu ___ galdetu diogu. = Le hemos preguntado cuánto tiempo ha pasado en el mar.
            options:
              - duen
              - du
              - duela
        meanings:
          - text: Ea arazorik izan duen galdetu diogu.
            options:
              - Le hemos preguntado si ha tenido problemas.
              - Nos ha dicho que ha tenido problemas.
              - No ha tenido ningún problema.
        chats:
