# Unit 15.2 · Benetan? — A2.1 book unit 3 (B + C): asking about activities and events and
# reporting the answers; explaining causes; reacting with surprise. Indirect questions (EA) …-(E)N
# in reported speech; causal -T(Z)EAGATIK and NORENGATIK; exclamatives (Hau da …!, A zer-nolako …!,
# Zein … den!, Zenbat … duen!, Bai … -(e)la!); degree words. BAIT- for recognition only.
# Recall: EA …-(E)N (11.2), -(E)LAKO and causal eta.
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u15-2
section: s5
bookUnit: 15
title:
  es: ¿De verdad?
  eu: Benetan?
goals:
  - es: Preguntar por actividades y sucesos, y contar las respuestas.
    eu: Ekintzei eta gertaerei buruz galdetu, eta erantzunak kontatu.
  - es: Explicar las causas de algo.
    eu: Zerbaiten arrazoiak azaldu.
  - es: Expresar sorpresa de varias maneras.
    eu: Harridura hainbat modutan adierazi.
guidebook:
  sections:
    - title:
        es: "Le hemos preguntado…: galdetu diogu ea …-(e)n"
        eu: "Galdetu diogu ea …-(e)n"
      body:
        es: "Repaso y ampliación. Una pregunta contada lleva -(e)n en el verbo (duen, den, dagoen). Al contarla cambia la persona: «Zenbat denbora pasatu duzu?» se convierte en «zenbat denbora pasatu duen galdetu diogu»."
        eu: "Errepasoa eta gehiago. Kontatutako galdera batean, aditzak -(e)n hartzen du (duen, den, dagoen). Kontatzean pertsona aldatzen da: «Zenbat denbora pasatu duzu?» → «zenbat denbora pasatu duen galdetu diogu»."
      examples:
        - eu: Itsasoan zenbat denbora pasatu duen galdetu diogu.
          es: Le hemos preguntado cuánto tiempo ha pasado en el mar.
        - eu: Ea pozik dagoen galdetu dit.
          es: Me ha preguntado si está contento.
    - title:
        es: "Por qué: -t(z)eagatik, elurragatik"
        eu: "Zergatik: -t(z)eagatik, elurragatik"
      body:
        es: "Además de -(e)lako, la causa puede ir con -t(z)eagatik detrás del verbo (hitz egiteagatik, por hablar) o con -(a)gatik detrás de un nombre (elurragatik, por la nieve; lainoagatik, por la niebla). En textos formales verás también «bait-» (ez baitu ikasi, ya que no ha estudiado); basta con entenderlo."
        eu: "-(e)lako formaz gain, arrazoia -t(z)eagatik formarekin adieraz daiteke aditzaren ondoren (hitz egiteagatik), edo -(a)gatik izenaren ondoren (elurragatik, lainoagatik). Testu jasoetan «bait-» ere ikusiko duzu (ez baitu ikasi); ulertzea nahikoa da."
      examples:
        - eu: Istripu asko telefonoz hitz egiteagatik gertatzen dira.
          es: Muchos accidentes pasan por hablar por teléfono.
        - eu: Elurragatik berandu iritsi naiz.
          es: He llegado tarde por la nieve.
    - title:
        es: "¡Qué…!: exclamaciones"
        eu: "Harridura-esaldiak"
      body:
        es: "Para expresar sorpresa: «Hau da etxea!» (¡vaya casa!); «A zer-nolako etxea!»; «Zein handia den!» (¡qué grande es!), «Zenbat diru duen!» (¡cuánto dinero tiene!), con el verbo en -(e)n; y «Bai harroa dela!» (¡sí que es orgulloso!), con -(e)la."
        eu: "Harridura adierazteko: «Hau da etxea!»; «A zer-nolako etxea!»; «Zein handia den!», «Zenbat diru duen!», aditza -(e)n forman; eta «Bai harroa dela!», -(e)la formarekin."
      examples:
        - eu: A zer-nolako kontzertua!
          es: ¡Vaya concierto!
        - eu: Zein garestia den!
          es: ¡Qué caro es!
        - eu: Bai pozik zaudela!
          es: ¡Sí que estás contento!
levels:
  - type: lesson
    title:
