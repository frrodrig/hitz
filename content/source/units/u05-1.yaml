# Unit 5.1 · Gustuko janaria — food and drink, likes (gustatu, NOR-NORI), NORI case, nahiago izan.
id: u05-1
section: s2
bookUnit: 5
title:
  es: Comida favorita
  eu: Gustuko janaria
goals:
  - es: Hablar de comida y bebida.
    eu: Janariaz eta edariaz hitz egin.
  - es: Expresar gustos y preferencias.
    eu: Gustuak eta lehentasunak adierazi.
guidebook:
  sections:
    - title:
        es: "Me gusta: gustatzen zait"
        eu: "Gustatzen zait"
      body:
        es: Lo que gusta va con artículo (kafea, sagarrak) y el verbo cambia si es plural, como en castellano «gusta / gustan», «gustatzen zait» y «gustatzen zaizkit». Para negar, «ez» va delante del auxiliar.
        eu: "Gustatzen zaigun gauzak artikulua darama (kafea, sagarrak), eta aditza aldatu egiten da pluralean: «gustatzen zait» eta «gustatzen zaizkit». Ezeztatzeko, «ez» laguntzailearen aurrean doa."
      examples:
        - eu: Kafea gustatzen zait.
          es: Me gusta el café.
        - eu: Sagarrak gustatzen zaizkit.
          es: Me gustan las manzanas.
        - eu: Ez zait esnea gustatzen.
          es: No me gusta la leche.
    - title:
        es: "¿A quién? El caso NORI"
        eu: "NORI kasua"
      body:
        es: "La persona a la que le gusta algo lleva -(r)i (Aneri, umeari, mutil honi), y el verbo cambia con ella. Pronombres: niri (zait), zuri (zaizu), hari (zaio), guri (zaigu), zuei (zaizue), haiei (zaie)."
        eu: "Zerbait gustatzen zaion pertsonak -(r)i darama (Aneri, umeari, mutil honi), eta aditza harekin aldatzen da. Izenordainak: niri (zait), zuri (zaizu), hari (zaio), guri (zaigu), zuei (zaizue), haiei (zaie)."
      examples:
        - eu: Aneri ardoa gustatzen zaio.
          es: A Ane le gusta el vino.
        - eu: Umeari zukua gustatzen zaio.
          es: Al niño le gusta el zumo.
        - eu: Guri arraina gustatzen zaigu.
          es: Nos gusta el pescado.
    - title:
        es: "Preferir: nahiago izan"
        eu: "Nahiago izan"
      body:
        es: "«Nahiago» funciona como «nahi»: nahiago dut, nahiago duzu, nahiago du. Quien prefiere lleva -k (nik, zuk, Anek). Con dos opciones se pregunta con «ala»."
        eu: "«Nahiago» «nahi» bezala erabiltzen da: nahiago dut, nahiago duzu, nahiago du. Nahiago duenak -k darama (nik, zuk, Anek). Bi aukera badaude, «ala» erabiltzen da galderan."
      examples:
        - eu: Kafea ala tea nahiago duzu?
          es: ¿Prefieres café o té?
        - eu: Nik tea nahiago dut.
          es: Yo prefiero té.
    - title:
        es: Comer, beber y las comidas del día
        eu: Jan, edan eta eguneko otorduak
      body:
        es: "«Jan» es comer y «edan» beber. Para lo que haces normalmente se usa jaten / edaten + dut, duzu, du…: arraina jaten dut (como pescado). Con «nahi»: zer jan nahi duzu? Gosaria es el desayuno, bazkaria la comida y afaria la cena; «gosarian» es «en el desayuno». «A mí también» es «niri ere bai»; «a mí tampoco», «niri ere ez»."
        eu: "Jan eta edan: jaten dut, edaten dut. Nahi-rekin: zer jan nahi duzu? Goizean gosaria, eguerdian bazkaria eta gauean afaria; «gosarian» esaten dugu. Ados gaudenean, «niri ere bai» edo «niri ere ez»."
      examples:
        - eu: Gosarian ogia jaten dut.
          es: En el desayuno como pan.
        - eu: Zer edan nahi duzu?
          es: ¿Qué quieres beber?
        - eu: Niri ere bai.
          es: A mí también.
