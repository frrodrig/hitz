        - Nerea | Ondo! Nire lehengusua, Julen, gaur Bilbon dago. = ¡Bien! Mi primo, Julen, hoy está en Bilbao.
        - Irati | Nolakoa da Julen? = ¿Cómo es Julen?
        - Nerea | Altua eta argala da. Ile luzea du. = Es alto y delgado. Tiene el pelo largo.
        - Irati | Zenbat urte ditu? = ¿Cuántos años tiene?
        - Nerea | Ez dakit. Hogeita zazpi edo hogeita zortzi. = No sé. Veintisiete o veintiocho. | No lo sé. Veintisiete o veintiocho.
        - Irati | Ezkonduta dago? = ¿Está casado?
        - Nerea | Ez, ezkongabea da. Oso alaia da, eta lagun asko ditu! = No, está soltero. ¡Es muy alegre y tiene muchos amigos!

        - Irati | Hura da? Hor, geltokiaren aurrean? = ¿Es aquel? ¿Ahí, delante de la estación?
        - Nerea | Ez, hark ile motza du. Julen han dago! = No, aquel tiene el pelo corto. ¡Julen está allí!
        - Julen | Kaixo, Nerea! Kaixo! Ni Julen naiz. = ¡Hola, Nerea! ¡Hola! Soy Julen.
        - Irati | Kaixo, Julen! Ni Irati naiz, Nerearen laguna. = ¡Hola, Julen! Soy Irati, la amiga de Nerea.
      questions:
        - afterLine: 3
          prompt: ¿Cómo es Julen?
          options:
            - Alto y delgado
            - Bajo y delgado
            - Alto y gordo
        - afterLine: 7
          prompt: ¿Está casado Julen?
          options:
            - No, está soltero
            - Sí, está casado
            - No lo dice
        - afterLine: 11
          prompt: ¿Por qué el chico de delante de la estación no es Julen?
          options:
            - Porque tiene el pelo corto
            - Porque es bajo
            - Porque es mayor
