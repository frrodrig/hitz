# Unit 3.2 · Nolakoa da? — describing people, personal information: NOLAKOA?, NORK + UKAN,
# numbers 10–100, ZENBAT. Source format: see docs/content-guide.md and u01-1.yaml.
id: u03-2
section: s1
bookUnit: 3
title:
  es: ¿Cómo es?
  eu: Nolakoa da?
goals:
  - es: Describir el físico y el carácter de una persona.
    eu: Pertsona baten itxura eta izaera deskribatu.
  - es: Pedir y dar datos personales (edad, estado civil, hijos o hermanos).
    eu: Datu pertsonalak eskatu eta eman (adina, egoera zibila, seme-alabak edo anai-arrebak).
guidebook:
  sections:
    - title:
        es: "¿Cómo es? Nolakoa da?"
        eu: "Nolakoa da?"
      body:
        es: El adjetivo va detrás del nombre y lleva el artículo -a (plural -ak). Para preguntar cómo es alguien, «Nolakoa da?»; si son varios, «Nolakoak dira?».
        eu: Adjektiboa izenaren ondoren doa eta -a artikulua hartzen du (pluralean -ak). Galdetzeko, «Nolakoa da?» edo «Nolakoak dira?».
      examples:
        - eu: Nolakoa da Ane? Altua eta argala da.
          es: ¿Cómo es Ane? Es alta y delgada.
        - eu: Nire lehengusuak gazteak dira.
          es: Mis primos son jóvenes.
    - title:
        es: "Tener: dut, duzu, du"
        eu: "Ukan: dut, duzu, du"
      body:
        es: "Con el verbo «ukan» (tener) el sujeto lleva -k: nik, zuk, hark; Mikelek, amak. Formas: dut, duzu, du, dugu, duzue, dute. Si lo que se tiene es plural, ditut, dituzu, ditu."
        eu: "Ukan aditzarekin subjektuak -k hartzen du: nik, zuk, hark; Mikelek, amak. Objektua plurala bada, ditut, dituzu, ditu."
      examples:
        - eu: Nik anaia bat dut.
          es: Tengo un hermano.
        - eu: Mikelek ile motza du.
          es: Mikel tiene el pelo corto.
        - eu: Zuk begi handiak dituzu.
          es: Tienes los ojos grandes.
    - title:
        es: Números del 10 al 100
        eu: Zenbakiak 10etik 100era
      body:
        es: El euskera cuenta de veinte en veinte. 30 es «hogeita hamar» (veinte y diez), 45 es «berrogeita bost» (cuarenta y cinco) y 72 es «hirurogeita hamabi» (sesenta y doce). La edad se dice con «urte» y el verbo «ukan».
        eu: Euskaraz hogeika zenbatzen da. 30 «hogeita hamar» da, 45 «berrogeita bost» eta 72 «hirurogeita hamabi». Adina «urte» eta ukan aditzarekin esaten da.
      examples:
        - eu: Hogeita hamar urte ditut.
          es: Tengo treinta años.
        - eu: Nire aitonak laurogeita bost urte ditu.
          es: Mi abuelo tiene ochenta y cinco años.
    - title:
        es: Datos personales
        eu: Datu pertsonalak
      body:
        es: Para preguntar la edad, «Zenbat urte dituzu?». Para el estado civil, «Ezkonduta zaude?» (con el verbo «egon») o «Ezkongabea zara?». Para decir que no tienes algo, se añade -(r)ik al nombre, como en «Ez dut umerik».
        eu: Adina galdetzeko, «Zenbat urte dituzu?». Egoera zibilerako, «Ezkonduta zaude?» edo «Ezkongabea zara?». Ezezkoan -(r)ik erabiltzen da, «Ez dut umerik».
      examples:
        - eu: Zenbat urte dituzu?
          es: ¿Cuántos años tienes?
        - eu: Ezkonduta nago, eta bi seme ditut.
          es: Estoy casada y tengo dos hijos.
        - eu: Ni ezkongabea naiz. Ez dut umerik.
          es: Soy soltero. No tengo hijos.
