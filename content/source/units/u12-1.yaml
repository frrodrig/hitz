# Unit 12.1 · Denbora librea — leisure activities and courses: when, where, at what time;
# NOIZ = NON, ZER ORDUTATIK ZER ORDUTARA, NOLA with -Z, the indefinite, NORAINO (-raino).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u12-1
section: s4
bookUnit: 12
title:
  es: Tiempo libre
  eu: Denbora librea
goals:
  - es: Pedir y dar información sobre actividades de tiempo libre y cursos.
    eu: Aisialdiko jarduerei eta ikastaroei buruzko informazioa eskatu eta eman.
  - es: Decir cuándo, dónde y de qué hora a qué hora es una actividad.
    eu: Jarduera bat noiz, non eta zer ordutatik zer ordutara den esan.
  - es: Decir cómo vas a un sitio y hasta dónde.
    eu: Leku batera nola eta noraino zoazen esan.
guidebook:
  sections:
    - title:
        es: "Cuándo: astelehenean, urrian"
        eu: "Noiz: astelehenean, urrian"
      body:
        es: Para decir cuándo, los días, meses y partes del día llevan la misma terminación que «dónde» (-n, -ean). En plural indica costumbre, como «los lunes».
        eu: Noiz adierazteko, egunek, hilabeteek eta eguneko uneek «non» kasuaren atzizki bera hartzen dute (-n, -ean). Pluralean ohitura adierazten du.
      examples:
        - eu: Kontzertua larunbatean da.
          es: El concierto es el sábado.
        - eu: Astelehenetan igerilekura joaten naiz.
          es: Los lunes voy a la piscina.
        - eu: Urrian ikastaro berri bat dago.
          es: En octubre hay un curso nuevo.
    - title:
        es: "De qué hora a qué hora"
        eu: "Zer ordutatik zer ordutara"
      body:
        es: "La hora de inicio lleva «-(e)tatik» y la de final «-(e)tara»: seietatik zortzietara (de seis a ocho). Para preguntar, «Zer ordutatik zer ordutara?»."
        eu: "Hasierako orduak «-(e)tatik» hartzen du eta amaierakoak «-(e)tara»: seietatik zortzietara."
      examples:
        - eu: Zer ordutatik zer ordutara da ikastaroa?
          es: ¿De qué hora a qué hora es el curso?
        - eu: Seietatik zortzietara.
          es: De seis a ocho.
    - title:
        es: "Cómo y hasta dónde: trenez, Bilboraino"
        eu: "Nola eta noraino: trenez, Bilboraino"
      body:
        es: El medio de transporte lleva «-z» sin artículo (trenez, metroz, autobusez). «Hasta dónde» se dice con «-raino» (Bilboraino, hondartzaraino).
        eu: Garraiobideak «-z» hartzen du, artikulurik gabe (trenez, metroz, autobusez). Muga adierazteko «-raino» erabiltzen da (Bilboraino).
      examples:
        - eu: Trenez joaten naiz.
          es: Voy en tren.
        - eu: Autobusa Bilboraino doa.
          es: El autobús va hasta Bilbao.
    - title:
        es: Sin artículo (mugagabea)
        eu: Mugagabea
      body:
        es: "Detrás de «zenbat», «zer» o «zein» en preguntas, y con números, el nombre va sin artículo: «Zenbat ikastarotan?», «hiru ikastarotan»."
        eu: "«Zenbat», «zer» eta «zein» galdetzaileekin eta zenbakiekin, izenak mugagabean doaz: «Zenbat ikastarotan?», «hiru ikastarotan»."
      examples:
        - eu: Zer kirol egiten duzu?
          es: ¿Qué deporte haces?
        - eu: Hiru ikastarotan eman dut izena.
          es: Me he apuntado a tres cursos.
