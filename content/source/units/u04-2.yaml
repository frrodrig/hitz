# Unit 4.2 · Etxe bila — renting, buying and swapping a home, comparing homes, furnishing:
# BALIO IZAN, NAHI IZAN, BEHAR IZAN + verb, -AGO, GEHIAGO / GUTXIAGO, numbers to 1000+.
# Source format: see docs/content-guide.md and u01-1.yaml.
id: u04-2
section: s2
bookUnit: 4
title:
  es: Buscando casa
  eu: Etxe bila
goals:
  - es: Pedir y dar información para alquilar, comprar o intercambiar una vivienda.
    eu: Etxebizitza bat alokatzeko, erosteko edo trukatzeko informazioa eskatu eta eman.
  - es: Comparar dos viviendas.
    eu: Bi etxebizitza alderatu.
  - es: Decir qué hay que comprar para amueblar una casa.
    eu: Etxe bat altzariz hornitzeko zer erosi behar den esan.
guidebook:
  sections:
    - title:
        es: "¿Cuánto cuesta? Zenbat balio du?"
        eu: "Zenbat balio du?"
      body:
        es: "Para preguntar el precio, «Zenbat balio du?». La cosa que cuesta lleva -k (sofa honek, pisuak) y el verbo queda en «du». Los cientos se forman con «-ehun»: berrehun (200), hirurehun (300), bostehun (500); mil es «mila»."
        eu: Prezioa galdetzeko, «Zenbat balio du?». Subjektuak -k hartzen du (sofa honek, pisuak). Ehunekoak «-ehun» atzizkiarekin osatzen dira, eta 1000 «mila» da.
      examples:
        # TODO(revisión-nativa): confirmar «… euro balio du» (verbo en singular) con cantidades plurales.
        - eu: Zenbat balio du sofa honek?
          es: ¿Cuánto cuesta este sofá?
        - eu: Berrehun euro balio du.
          es: Cuesta doscientos euros.
        - eu: Etxe horrek hirurehun mila euro balio du.
          es: Esa casa cuesta trescientos mil euros.
    - title:
        es: "Querer: nahi dut"
        eu: "Nahi izan: nahi dut"
      body:
        es: "«Nahi» + el verbo «ukan» significa «querer». Puede ir con un nombre (sofa bat nahi dut) o con otro verbo, que va delante: pisu bat alokatu nahi dut (quiero alquilar un piso). En negativa, «ez dut … nahi»."
        eu: "«Nahi» + ukan aditza. Izen batekin (sofa bat nahi dut) edo beste aditz batekin: pisu bat alokatu nahi dut. Ezezkoan, «ez dut … nahi»."
      examples:
        - eu: Pisu bat alokatu nahi dut.
          es: Quiero alquilar un piso.
        - eu: Zer erosi nahi duzu?
          es: ¿Qué quieres comprar?
        - eu: Ez dut etxea saldu nahi.
          es: No quiero vender la casa.
    - title:
        es: "Tener que: behar dut"
        eu: "Behar izan aditz batekin"
      body:
        es: "«Behar» también va con otro verbo y significa «tener que» o «necesitar»: ohe bat erosi behar dut. Si se necesitan varias cosas, el verbo va en plural: behar ditugu."
        eu: "«Behar» beste aditz batekin ere erabiltzen da: ohe bat erosi behar dut. Objektua plurala bada, behar ditugu."
      examples:
        - eu: Ohe bat erosi behar dut.
          es: Tengo que comprar una cama.
        - eu: Mahai bat eta sei aulki behar ditugu.
          es: Necesitamos una mesa y seis sillas.
    - title:
        es: "Más y menos: -ago, gehiago, gutxiago"
        eu: "-ago, gehiago, gutxiago"
      body:
        es: Para decir «más barato» o «más grande», se añade -ago al adjetivo, y luego el artículo -a. Con nombres y verbos se usa «gehiago» (más) y «gutxiago» (menos), siempre detrás.
        eu: Adjektiboari -ago gehitzen zaio, eta gero -a artikulua. Izenekin eta aditzekin «gehiago» eta «gutxiago» erabiltzen dira, atzean.
      examples:
        - eu: Pisu hau merkeagoa da.
          es: Este piso es más barato.
        - eu: Etxe honek logela gehiago ditu.
          es: Esta casa tiene más dormitorios.
        - eu: Sofa honek gutxiago balio du.
          es: Este sofá cuesta menos.
