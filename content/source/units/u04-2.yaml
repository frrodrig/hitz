  - type: story
    title:
      es: "Historia: cambio de piso"
      eu: "Istorioa: pisua trukatu"
    story:
      title: Pisua trukatu nahi dut
      lines:
        - Eneko | Kaixo, June! Pisua trukatu nahi duzu? = ¡Hola, June! ¿Quieres intercambiar el piso?
        - June | Bai! Nire pisua Donostian dago. Eta zure pisua? = ¡Sí! Mi piso está en San Sebastián. ¿Y tu piso?
        - Eneko | Nire pisua Bilbon dago. Bi logela ditu. = Mi piso está en Bilbao. Tiene dos dormitorios.
        - June | Nire pisua handiagoa da. Hiru logela ditu, eta bi bainugela ere bai. = Mi piso es más grande. Tiene tres dormitorios, y también dos cuartos de baño.
        - Eneko | Argitsua da? = ¿Es luminoso?
        - June | Bai, oso argitsua eta eguzkitsua. Terraza bat dauka. = Sí, muy luminoso y soleado. Tiene una terraza.
        - Eneko | Nire pisua txikiagoa da, baina berriagoa. = Mi piso es más pequeño, pero más nuevo.
        - June | Zer dauka zure sukaldeak? = ¿Qué tiene tu cocina?
        - Eneko | Hozkailu berri bat, labe bat eta garbigailu bat. = Un frigorífico nuevo, un horno y una lavadora.
        - June | Oso ondo! Nire sukaldeak ez du garbigailurik. = ¡Muy bien! Mi cocina no tiene lavadora.
        - Eneko | Trukatu nahi duzu, bai ala ez? = ¿Quieres intercambiarlo, sí o no?
        - June | Bai! Eskerrik asko, Eneko! = ¡Sí! ¡Muchas gracias, Eneko!
      questions:
        - afterLine: 3
          prompt: ¿Qué piso es más grande?
          options:
            - El de June
            - El de Eneko
            - Son iguales
        - afterLine: 6
          prompt: ¿Cómo es el piso de Eneko?
          options:
            - Más pequeño, pero más nuevo
            - Más grande y más luminoso
            - Más viejo y más oscuro
        - afterLine: 11
          prompt: ¿Qué no tiene la cocina de June?
          options:
            - Lavadora
            - Horno
            - Frigorífico
