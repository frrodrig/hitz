# Unit 9.2 · Ingurumena zaindu — -T(Z)EA, EZIN DA, DEBEKATUTA DAGO, opinions, -(E)NEAN.
id: u09-2
section: s3
bookUnit: 9
title:
  es: Cuidar el medio ambiente
  eu: Ingurumena zaindu
goals:
  - es: Conocer medidas para proteger el medio ambiente y dar tu opinión sobre ellas.
    eu: Ingurumena babesteko neurriak ezagutu eta haiei buruzko iritzia eman.
  - es: Decir qué hacemos para cuidar el medio ambiente.
    eu: Ingurumena zaintzeko zer egiten dugun esan.
  - es: Entender prohibiciones y normas sencillas.
    eu: Debekuak eta arau errazak ulertu.
guidebook:
  sections:
    - title:
        es: "Es importante ahorrar: -tzea"
        eu: "Garrantzitsua da aurreztea: -tzea"
      body:
        es: El verbo con -tzea o -tea funciona como un nombre, igual que el infinitivo español en «ahorrar es bueno». Se usa con «garrantzitsua da» (es importante), «komeni da» (conviene), «ondo dago» (está bien) o «gustatzen zait».
        eu: -tzea edo -tea duen aditza izen bat bezala erabiltzen da. «Garrantzitsua da», «komeni da», «ondo dago» edo «gustatzen zait» esapideekin erabiltzen da.
      examples:
        - eu: Garrantzitsua da natura zaintzea.
          es: Es importante cuidar la naturaleza.
        - eu: Komeni da energia aurreztea.
          es: Conviene ahorrar energía.
        - eu: Ondo dago papera birziklatzea.
          es: Está bien reciclar el papel.
    - title:
        es: "No se puede, está prohibido"
        eu: "Ezin da, debekatuta dago"
      body:
        es: «Ezin da» + participio significa «no se puede» (Ezin da hemen sartu). «Debekatuta dago» + verbo con -tzea significa «está prohibido». Para una persona concreta, «ezin dut», «ezin naiz»…
        eu: «Ezin da» partizipioarekin erabiltzen da (Ezin da hemen sartu). «Debekatuta dago» -tzea duen aditzarekin doa. Pertsona batekin, «ezin dut», «ezin naiz»…
      examples:
        - eu: Ezin da hemen plastikoa bota.
          es: Aquí no se puede tirar plástico.
        - eu: Debekatuta dago ibaian igeri egitea.
          es: Está prohibido nadar en el río.
        - eu: Gaur ezin naiz etorri.
          es: Hoy no puedo venir.
    - title:
        es: Dar tu opinión
        eu: Iritzia eman
      body:
        es: «Nire ustez» significa «en mi opinión». Para preguntar, «Zer uste duzu?» o «Zein da zure iritzia?». Para responder, «ados nago» (estoy de acuerdo) o «ez nago ados».
        eu: «Nire ustez» esaten dugu gure iritzia emateko. Galdetzeko, «Zer uste duzu?» edo «Zein da zure iritzia?». Erantzuteko, «ados nago» edo «ez nago ados».
      examples:
        - eu: Nire ustez, ondo dago.
          es: En mi opinión, está bien.
        - eu: Zer uste duzu?
          es: ¿Qué opinas?
        - eu: Ez nago ados.
          es: No estoy de acuerdo.
    - title:
        es: "Cuando…: -(e)nean"
        eu: "-(e)nean"
      body:
        es: Para decir «cuando», se añade -(e)nean al verbo auxiliar, que va al final de esa parte de la frase (naiz → naizenean, da → denean, dago → dagoenean).
        eu: «Noiz» adierazteko, -(e)nean gehitzen zaio laguntzaileari (naiz → naizenean, da → denean, dago → dagoenean).
      examples:
        - eu: Gelatik joaten naizenean, argia itzaltzen dut.
          es: Cuando salgo de la habitación, apago la luz.
        - eu: Dutxatzen naizenean, ura aurrezten dut.
          es: Cuando me ducho, ahorro agua.
