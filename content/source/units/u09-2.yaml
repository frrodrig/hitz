  - type: story
    title:
      es: "Historia: ¡apaga la luz!"
      eu: "Istorioa: itzal ezazu argia!"
    story:
      title: Itzal ezazu argia!
      lines:
        - Nerea | Aitor, gelatik joaten zarenean, argia itzali behar duzu! = Aitor, cuando te vas de la habitación, ¡tienes que apagar la luz!
        - Aitor | Barkatu, Nerea. Zergatik? = Perdona, Nerea. ¿Por qué?
        - Nerea | Energia aurreztea garrantzitsua delako. = Porque es importante ahorrar energía.
        - Aitor | Ados nago. Eta zer gehiago egiten duzu zuk? = Estoy de acuerdo. ¿Y qué más haces tú?
        - Nerea | Dutxatzen naizenean, ura aurrezten dut. = Cuando me ducho, ahorro agua.
        - Nerea | Eta ez dut plastikozko poltsarik erabiltzen. = Y no uso bolsas de plástico.
        - Aitor | Nire ustez, plastikozko poltsak debekatuta egon behar dute. = En mi opinión, las bolsas de plástico deberían estar prohibidas.
        - Nerea | Ados nago! Ibaian eta itsasoan plastiko asko dago. = ¡Estoy de acuerdo! En el río y en el mar hay mucho plástico.
        - Aitor | Bihar ibaira joango gara eta hondakinak hartuko ditugu. = Mañana iremos al río y recogeremos los residuos.
        - Nerea | Oso ondo! Natura zaindu behar dugu. = ¡Muy bien! Tenemos que cuidar la naturaleza.
      questions:
        - afterLine: 2
          prompt: ¿Por qué tiene que apagar la luz Aitor?
          options:
            - Para ahorrar energía
            - Porque es de noche
            - Porque Nerea quiere dormir
        - afterLine: 6
          prompt: ¿Qué opina Aitor de las bolsas de plástico?
          options:
            - Que deberían estar prohibidas
            - Que son muy útiles
            - Que no se pueden reciclar
        - afterLine: 9
          prompt: ¿Qué van a hacer mañana?
          options:
            - Recoger residuos en el río
            - Nadar en el mar
            - Comprar bolsas de papel
  - type: review
  - type: legendary
