# Unit 1.2 · Nor zara? — introducing oneself and others, origin (NONGO), jobs with the article,
# full present of IZAN, ALA questions, "neska hau", numbers 0–10 for phone numbers.
id: u01-2
section: s1
bookUnit: 1
title:
  es: ¿Quién eres?
  eu: Nor zara?
goals:
  - es: Presentarte y presentar a otras personas.
    eu: Zure burua eta besteak aurkeztu.
  - es: Decir de dónde es alguien y a qué se dedica.
    eu: Norbait nongoa den eta zer den esan.
  - es: Dar datos personales sencillos, como el número de teléfono.
    eu: Datu pertsonal errazak eman, telefono zenbakia, adibidez.
guidebook:
  sections:
    - title:
        es: "Los pronombres y el verbo izan"
        eu: "Izenordainak eta izan aditza"
      body:
        es: "Cada pronombre tiene su forma de «izan» (ser): ni naiz, zu zara, hura da, gu gara, zuek zarete, haiek dira. El verbo va al final y el pronombre se puede omitir."
        eu: "Izenordain bakoitzak bere «izan» forma du: ni naiz, zu zara, hura da, gu gara, zuek zarete, haiek dira. Aditza amaieran doa, eta izenordaina ken daiteke."
      examples:
        - eu: Hura Mikel da.
          es: Él es Mikel.
        - eu: Gu ikasleak gara.
          es: Somos estudiantes.
        - eu: Haiek Bilbokoak dira.
          es: Ellos son de Bilbao.
    - title:
        es: "Profesiones: el artículo -a / -ak"
        eu: "Lanbideak: -a / -ak artikulua"
      body:
        es: "En el diccionario las palabras aparecen sin artículo (irakasle). En la frase llevan -a en singular y -ak en plural: «Ni irakaslea naiz», «Gu irakasleak gara». Para elegir entre dos opciones se usa «ala» (o)."
        eu: "Hiztegian hitzak artikulurik gabe agertzen dira (irakasle). Esaldian -a dute singularrean eta -ak pluralean: «Ni irakaslea naiz», «Gu irakasleak gara». Bi aukeraren artean galdetzeko «ala» erabiltzen da."
      examples:
        - eu: Ni irakaslea naiz.
          es: Soy profesor.
        - eu: Zuek medikuak zarete?
          es: ¿Sois médicos?
        - eu: Zu ikaslea zara ala irakaslea?
          es: ¿Eres estudiante o profesor?
    - title:
        es: "¿De dónde? Nongo"
        eu: "Nongo?"
      body:
        es: "Para el origen se añade -ko al lugar y luego el artículo: Bilbo → Bilbokoa (de Bilbao). Se pregunta con «Nongoa zara?». Para presentar a alguien: «Hau Ane da» o «Neska hau Ane da» (el demostrativo va detrás del nombre)."
        eu: "Jatorria esateko, lekuari -ko eta artikulua gehitzen zaizkio: Bilbo → Bilbokoa. «Nongoa zara?» galdetzen da. Norbait aurkezteko: «Hau Ane da» edo «Neska hau Ane da» (erakuslea izenaren atzean doa)."
      examples:
        - eu: Nongoa zara? Ni Donostiakoa naiz.
          es: ¿De dónde eres? Soy de San Sebastián.
        - eu: Neska hau Amaia da. Gasteizkoa da.
          es: Esta chica es Amaia. Es de Vitoria.
    - title:
        es: "Números y pronunciación"
        eu: "Zenbakiak eta ahoskera"
      body:
        es: "Los números del 0 al 10 sirven para dictar un teléfono cifra a cifra. Ojo a la pronunciación: «tx» suena como «ch» (Etxeberria), «tz» y «ts» son sonidos parecidos a «ts», y la «z» se pronuncia como una «s» suave, no como la «z» castellana (zazpi, zortzi)."
        eu: "0tik 10era bitarteko zenbakiekin telefono bat zenbakiz zenbaki eman daiteke. Kontuz ahoskerarekin: «tx» (Etxeberria), «tz» eta «ts», eta «z» (zazpi, zortzi) ez da gaztelaniazko «z» bezala ahoskatzen."
      examples:
        - eu: Zortzi, bederatzi, hamar.
          es: Ocho, nueve, diez.
        - eu: "Telefono zenbakia: sei, bost, zero, bi."
          es: "Número de teléfono: seis, cinco, cero, dos."
    - title:
        es: "Ere, baina, edo y frases de supervivencia"
        eu: "Ere, baina, edo eta biziraupen-esaldiak"
      body:
        es: "«Ere» (también) va detrás de la palabra: «ni ere» (yo también). «Baina» es «pero» y «edo» es «o» en frases afirmativas (para elegir en una pregunta, «ala»). Frases útiles: «Barkatu, ez dakit» (perdona, no lo sé), «Berriro, mesedez» (otra vez, por favor), «Poliki, mesedez» (despacio, por favor) y «Euskaraz pixka bat hitz egiten dut» (hablo un poco de euskera), que de momento se aprende como frase hecha."
        eu: "«Ere» hitzaren atzean doa: «ni ere». «Baina» kontrastea adierazteko da, eta «edo» esaldi baiezkoetan (galderetan aukeratzeko, «ala»). Esaldi erabilgarriak: «Barkatu, ez dakit», «Berriro, mesedez», «Poliki, mesedez» eta «Euskaraz pixka bat hitz egiten dut», oraingoz esapide finko gisa."
      examples:
        - eu: Ni ere ikaslea naiz, baina Ane irakaslea da.
          es: Yo también soy estudiante, pero Ane es profesora.
        - eu: Mikel medikua edo erizaina da.
          es: Mikel es médico o enfermero.
        - eu: Barkatu, ez dakit. Berriro, mesedez.
          es: Perdona, no lo sé. Otra vez, por favor.
        - eu: Poliki, mesedez. Euskaraz pixka bat hitz egiten dut.
          es: Despacio, por favor. Hablo un poco de euskera.
