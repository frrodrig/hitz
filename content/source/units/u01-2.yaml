  - type: story
    title:
      es: "Historia: ¿profesora o estudiante?"
      eu: "Istorioa: irakaslea ala ikaslea?"
    story:
      title: Irakaslea ala ikaslea?
      lines:
        - Amaia | Egun on! Ni Amaia naiz, eta irakaslea naiz. = ¡Buenos días! Soy Amaia y soy profesora.
        - Unai | Egun on! Ni Unai naiz. Hau Leire da. = ¡Buenos días! Soy Unai. Esta es Leire.
        - Amaia | Kaixo, Leire! Zu ikaslea zara? = ¡Hola, Leire! ¿Eres estudiante?
        - Leire | Bai, ni ikaslea naiz, baina Unai ez. = Sí, soy estudiante, pero Unai no.
        - Amaia | Ez? Zer zara, Unai? = ¿No? ¿A qué te dedicas, Unai?
        - Unai | Sukaldaria naiz, eta euskaraz pixka bat hitz egiten dut. = Soy cocinero y hablo un poco de euskera.
