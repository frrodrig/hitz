            options:
              - Eztula daukat.
              - Eztula nago.
              - Eseri naiz.
        true_false:
          - passage: Gaur osasun-etxera joan naiz. Gero farmazian pilulak erosi ditut.
            statement: Ha comprado pastillas.
            answer: true
