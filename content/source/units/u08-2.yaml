            options:
              - Tengo cita en el centro de salud.
              - Tengo una receta del centro de salud.
              - Trabajo en el centro de salud.
        blanks:
          - text: Osasun-etxean hitzordua ___ dut. = He pedido cita en el centro de salud.
            options:
              - eskatu
              - eseri
        chats:
          - messages:
