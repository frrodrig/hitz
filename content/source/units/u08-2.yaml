  - type: story
    title:
      es: "Historia: en el centro de salud"
      eu: "Istorioa: osasun-etxean"
    story:
      title: Osasun-etxean
      lines:
        - Erizaina | Egun on! Hitzordua daukazu? = ¡Buenos días! ¿Tiene cita?
        - Kepa | Bai, hamarretan, medikuarekin. Kepa Arana naiz. = Sí, a las diez, con el médico. Soy Kepa Arana.
        - Erizaina | Ondo. Eseri, mesedez. = Bien. Siéntese, por favor.
        - Medikua | Kaixo, Kepa. Zer daukazu? = Hola, Kepa. ¿Qué le pasa?
        - Kepa | Bizkarreko mina daukat. Gauean ez dut lo egiten. = Me duele la espalda. Por la noche no duermo.
        - Medikua | Zer egiten duzu egunero? = ¿Qué hace usted todos los días?
        - Kepa | Zortzi orduz lan egiten dut, eserita. = Trabajo ocho horas, sentado.
        - Medikua | Igeri egiten duzu? = ¿Nada usted?
        - Kepa | Ez, inoiz ez. Baina egunero ibiltzen naiz. = No, nunca. Pero camino todos los días.
        - Medikua | Mina baduzu, pilula bat hartu. Eta astean behin igeri egin, mesedez. = Si le duele, tómese una pastilla. Y nade una vez a la semana, por favor.
        - Kepa | Ondo. Errezeta behar dut? = Bien. ¿Necesito receta?
        - Medikua | Bai, hemen duzu. Datorren hilabetean hitzordua eskatu. = Sí, aquí la tiene. Pida cita para el mes que viene.
      questions:
        - afterLine: 2
          prompt: ¿A qué hora tiene Kepa la cita?
          options:
            - A las diez
            - A las dos
            - A las doce
        - afterLine: 6
          prompt: ¿Cómo trabaja Kepa?
          options:
            - Sentado
            - De pie
            - Caminando
        - afterLine: 11
          prompt: ¿Qué le recomienda el médico, además de la pastilla?
          options:
            - Nadar una vez a la semana
            - Dormir más horas
            - Dejar de trabajar
