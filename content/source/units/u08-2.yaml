# Unit 8.2 · Medikuarengana — NORENGANA (medikuarengana), -TA/-DA (hautsita dauka),
# BA- conditionals (sukarra baduzu…), habitual aspect (egunero jaikitzen naiz) and frequency.
id: u08-2
section: s3
bookUnit: 8
title:
  es: Al médico
  eu: Medikuarengana
goals:
  - es: Entender y dar recomendaciones para problemas de salud comunes.
    eu: Ohiko osasun-arazoetarako gomendioak ulertu eta eman.
  - es: Describir hábitos diarios saludables y decir con qué frecuencia haces algo.
    eu: Eguneroko ohitura osasuntsuak azaldu eta zerbait zenbatetan egiten duzun esan.
guidebook:
  sections:
    - title:
        es: "Ir a una persona: medikuarengana"
        eu: "Norbaitengana joan: medikuarengana"
      body:
        es: Para ir hacia una persona no se usa -ra sino -(r)engana (medikuarengana, amarengana, zuregana). Para un lugar se sigue usando -ra (osasun-etxera, farmaziara).
        eu: Pertsona batengana joateko ez da -ra erabiltzen, -(r)engana baizik (medikuarengana, amarengana, zuregana). Leku baterako -ra erabiltzen da (osasun-etxera, farmaziara).
      examples:
        - eu: Medikuarengana joan behar duzu.
          es: Tienes que ir al médico.
        - eu: Bihar zuregana etorriko naiz.
          es: Mañana vendré a verte.
        - eu: Osasun-etxera noa.
          es: Voy al centro de salud.
    - title:
        es: "Cómo está: hautsita, eserita"
        eu: "Nola dago? Hautsita, eserita"
      body:
        es: Para decir cómo está algo después de una acción, el participio lleva -ta (-da tras -n o -l), como el participio español «roto» o «sentado». Va con dauka o dago.
        eu: Ekintza baten ondoren zerbait nola dagoen esateko, partizipioak -ta hartzen du (-da -n edo -l ondoren). Dauka edo dago aditzarekin doa.
      examples:
        - eu: Mikelek hanka hautsi du.
          es: Mikel se ha roto la pierna.
        - eu: Hanka hautsita dauka.
          es: Tiene la pierna rota.
        - eu: Amona eserita dago.
          es: La abuela está sentada.
    - title:
        es: "Si…: baduzu, bazaude"
        eu: "Baldintza: baduzu, bazaude"
      body:
        es: Para decir «si…», se pone ba- delante del verbo conjugado (baduzu, badaukazu, bazaude). El consejo va después, a menudo con el participio solo, que funciona como imperativo (hartu, joan, geratu).
        eu: Baldintza adierazteko, ba- jartzen da aditz jokatuaren aurrean (baduzu, badaukazu, bazaude). Gomendioa ondoren doa, askotan partizipioa bakarrik, agintera gisa (hartu, joan, geratu).
      examples:
        - eu: Sukarra baduzu, etxean geratu.
          es: Si tienes fiebre, quédate en casa.
        - eu: Buruko mina badaukazu, pilula bat hartu.
          es: Si te duele la cabeza, tómate una pastilla.
        - eu: Nekatuta bazaude, goiz oheratu.
          es: Si estás cansado, acuéstate pronto.
    - title:
        es: Lo que haces normalmente
        eu: Ohiko ekintzak
      body:
        es: Para los hábitos, el verbo lleva -tzen o -ten y después naiz o dut (jaikitzen naiz, gosaltzen dut), como el presente español. La frecuencia se dice con egunero, askotan, astean behin, noizean behin, gutxitan o «ez… inoiz».
        eu: Ohiturak adierazteko, aditzak -tzen edo -ten hartzen du eta ondoren naiz edo dut (jaikitzen naiz, gosaltzen dut). Maiztasuna egunero, askotan, astean behin, noizean behin, gutxitan edo «ez… inoiz» esapideekin adierazten da.
      examples:
        - eu: Egunero zazpietan jaikitzen naiz.
          es: Todos los días me levanto a las siete.
        - eu: Astean behin igeri egiten dut.
          es: Nado una vez a la semana.
        - eu: Ez dut inoiz kafea hartzen.
          es: Nunca tomo café.
levels:
  - type: lesson
    title:
      es: Mi día
      eu: Nire eguna
    lessons:
      - structures: [habitual]
        sentences:
          - Egunero zazpietan jaikitzen naiz. = Todos los días me levanto a las siete. | Me levanto todos los días a las siete. | Me levanto a las siete todos los días.
          - Gero dutxatzen naiz. = Después me ducho. | Luego me ducho.
          - Beti etxean gosaltzen dut. = Siempre desayuno en casa.
          - Goizean kafea edo tea hartzen dut. = Por la mañana tomo café o té. | Por las mañanas tomo café o té.
          - Ordu batean bazkaltzen dut. = Como a la una.
          - Gauean bederatzietan afaltzen dugu. = Por la noche cenamos a las nueve. | Cenamos a las nueve de la noche.
          - Hamaiketan oheratzen naiz. = Me acuesto a las once.
          - Zer ordutan jaikitzen zara? = ¿A qué hora te levantas? | ¿A qué hora se levanta usted?
        pairs:
          - - jaiki = levantarse
            - gosaldu = desayunar
            - dutxatu = ducharse
            - oheratu = acostarse
            - bazkaldu = comer
            - afaldu = cenar
        meanings:
          - text: Ane seietan jaikitzen da.
            options:
              - Ane se levanta a las seis.
              - Ane se acuesta a las seis.
              - Ane se levantó a las seis.
        blanks:
          - text: Egunero hamarretan oheratzen ___. = Me acuesto a las diez todos los días.
            options:
              - naiz
              - dut
        chats:
          - messages:
              - Ibai | Zer ordutan oheratzen zara?
            options:
              - Hamaiketan oheratzen naiz.
              - Hamaiketan oheratzen dut.
              - Hamaika urte ditut.
        true_false:
          - passage: Egunero sei eta erdietan jaikitzen naiz, baina ez dut gosaltzen.
            statement: Desayuna todos los días.
            answer: false
      - structures: [frequency, habitual]
        sentences:
          - Astean behin igeri egiten dut. = Nado una vez a la semana. | Una vez a la semana nado.
          - Noizean behin mendira joaten naiz. = De vez en cuando voy al monte. | Voy al monte de vez en cuando.
          - Ez dut inoiz ardoa edaten. | Inoiz ez dut ardoa edaten. = Nunca bebo vino. | No bebo vino nunca.
          - Haragia gutxitan jaten dut, baina arraina askotan. = Como carne pocas veces, pero pescado a menudo. | Pocas veces como carne, pero pescado a menudo.
          - Mikelek asko lan egiten du. = Mikel trabaja mucho.
          - Amonak bakarrik bazkaltzen du, baina gaur gurekin jango du. = La abuela come sola, pero hoy comerá con nosotros. | Mi abuela come sola, pero hoy comerá con nosotros.
          - Askotan igeri egiten duzu? = ¿Nadas a menudo? | ¿Nada usted a menudo?
          - Astero amarekin bazkaltzen dut. = Cada semana como con mi madre. | Como con mi madre todas las semanas. | Todas las semanas como con mi madre.
        pairs:
          - - ez… inoiz = nunca
            - noizean behin = de vez en cuando
            - gutxitan = pocas veces
            - askotan = a menudo
            - astero = cada semana
            - astean behin = una vez a la semana
        meanings:
          - text: Noizean behin kafea hartzen dut.
            options:
              - De vez en cuando tomo café.
              - Nunca tomo café.
              - Tomo café todos los días.
        blanks:
          - text: Ez dut ___ kafea hartzen. = Nunca tomo café.
            options:
              - inoiz
              - asko
        chats:
          - messages:
              - Alaitz | Askotan igeri egiten duzu?
            options:
              - Bai, astean behin.
              - Bai, atzo.
              - Ez, bihar.
        true_false:
          - passage: Nerea egunero hondartzara joaten da. Asko igeri egiten du.
            statement: Nerea nada poco.
            answer: false
      - structures: [health-centre]
        sentences:
          - Osasun-etxera noa. = Voy al centro de salud.
          - Hitzordua eskatu dut. = He pedido cita. | Pedí cita.
          - Medikuak errezeta bat idatzi du. = El médico ha escrito una receta. | La médica ha escrito una receta.
          - Farmazian botika erosiko dut. = Compraré la medicina en la farmacia. | Voy a comprar la medicina en la farmacia. | Compraré el medicamento en la farmacia.
          - Pilula bat hartu, mesedez. = Tómate una pastilla, por favor. | Tome una pastilla, por favor.
          - Eseri, mesedez. = Siéntate, por favor. | Siéntese, por favor.
          - Amonak sendabelarrak hartzen ditu. = La abuela toma plantas medicinales. | Mi abuela toma plantas medicinales.
          - Jonek besoa hautsi du. = Jon se ha roto el brazo. | Jon se rompió el brazo.
        pairs:
          - - osasun-etxea = el centro de salud
            - botika = la medicina
            - pilula = la pastilla
            - hitzordua = la cita
            - errezeta = la receta
            - sendabelarra = la planta medicinal
        meanings:
