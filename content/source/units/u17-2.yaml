      - structures: [nahi-izaten, ahal-izaten]
        sentences:
          - Asteburuetan lasai egon nahi izaten dut. = Los fines de semana suelo querer estar tranquilo. | Los fines de semana suelo querer estar tranquila.
          - Liburutegian ezin izaten da hitz egin. = En la biblioteca no se puede hablar.
          - Hemen erre ahal izaten da? = ¿Aquí se puede fumar?
