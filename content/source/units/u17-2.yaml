          - Gauean lan egin behar izaten dut. = Suelo tener que trabajar de noche.
          - Gaur gaueko txanda daukat. = Hoy tengo el turno de noche.
          - Batzuetan ezin izaten dut atseden hartu. = A veces no puedo descansar.
          - Zeregin asko izaten ditugu. = Solemos tener muchas tareas.
