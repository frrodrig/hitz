# Unit 17.2 · Alde ala kontra? — A2.1 book unit 5 (B + C): how a job is done and what one usually
# has to, wants to, can or cannot do; advice; what others let us do; being for or against something.
# Habitual modal verbs (behar / nahi / ahal / ezin izaten); -T(Z)EN LAGUNDU and -T(Z)EN UTZI with
# NOR-NORI-NORK; ZEREN / NOREN ALDE, AURKA, KONTRA EGON; ALDEKO / KONTRAKO + noun.
# Recall: imperative of NOR and NOR-NORK (9.1), now with plural objects, zuek and the negative;
# frequency with -TIK BEHIN.
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u17-2
section: s6
bookUnit: 17
title:
  es: ¿A favor o en contra?
  eu: Alde ala kontra?
goals:
  - es: Explicar qué sueles tener que hacer, querer o poder hacer en tu trabajo.
    eu: Lanean zer egin behar, nahi edo ahal izaten duzun azaldu.
  - es: Dar y pedir consejos, y decir qué te dejan hacer.
    eu: Aholkuak eman eta eskatu, eta zer egiten uzten dizuten esan.
  - es: Decir si estás a favor o en contra de algo.
    eu: Zerbaiten alde edo kontra zauden esan.
guidebook:
  sections:
    - title:
        es: "Suelo tener que…: behar izaten dut"
        eu: "Behar izaten dut"
      body:
        es: "Con «behar», «nahi», «ahal» y «ezin» la costumbre se dice con «izaten»: «gauean lan egin behar izaten dut» (suelo tener que trabajar de noche), «ezin izaten da erre» (no se suele poder fumar)."
        eu: "«Behar», «nahi», «ahal» eta «ezin» aditzekin, ohitura «izaten» erabiliz esaten da: «gauean lan egin behar izaten dut», «ezin izaten da erre»."
      examples:
        - eu: Gauean lan egin behar izaten dut.
          es: Suelo tener que trabajar de noche.
        - eu: Liburutegian ezin izaten da hitz egin.
          es: En la biblioteca no se puede hablar.
    - title:
        es: "Ayudar y dejar: …-t(z)en lagundu, …-t(z)en utzi"
        eu: "…-t(z)en lagundu, …-t(z)en utzi"
      body:
        es: "El verbo de lo que se ayuda o se deja hacer va en -t(z)en, y la persona va con -(r)i: «amari etxeko lanak egiten laguntzen diot», «ez didate sartzen utzi» (no me han dejado entrar)."
        eu: "Laguntzen edo uzten den aditza -t(z)en forman doa, eta pertsonak -(r)i hartzen du: «amari etxeko lanak egiten laguntzen diot», «ez didate sartzen utzi»."
      examples:
        - eu: Ez didate sartzen utzi.
          es: No me han dejado entrar.
        - eu: Haurrei telebista ikusten uzten diet.
          es: Dejo a los niños ver la tele.
    - title:
        es: "Imperativo: ekar itzazu, ez zaitez etorri"
        eu: "Agintera: ekar itzazu, ez zaitez etorri"
      body:
        es: "Con objeto plural, «ezazu» pasa a «itzazu»: «ekar itzazu edalontziak». Para «zuek», «ezazue / itzazue». En negativo, «ez» va delante del auxiliar: «ez itzazu ureztatu», «ez zaitez berandu etorri»."
        eu: "Objektua plurala bada, «ezazu» «itzazu» bihurtzen da: «ekar itzazu edalontziak». «Zuek» denean, «ezazue / itzazue». Ezezkoan, «ez» laguntzailearen aurrean doa: «ez itzazu ureztatu», «ez zaitez berandu etorri»."
      examples:
        - eu: Ekar itzazu edalontziak, mesedez.
          es: Trae los vasos, por favor.
        - eu: Ez itzazue gozoki guztiak jan!
          es: ¡No os comáis todos los caramelos!
    - title:
        es: "A favor, en contra: zerbaiten alde, kontra, aurka"
        eu: "Zerbaiten alde, kontra, aurka"
      body:
        es: "«Alde», «kontra» y «aurka» van detrás de la cosa o persona con -(r)en: «proiektuaren alde nago», «zure kontra». Delante de un nombre: «proiektuaren aldeko jendea», «bidegorriaren kontrako hiritarrak»."
        eu: "«Alde», «kontra» eta «aurka» gauzaren edo pertsonaren atzean doaz, hark -(r)en hartuta: «proiektuaren alde nago», «zure kontra». Izen baten aurrean: «proiektuaren aldeko jendea», «bidegorriaren kontrako hiritarrak»."
      examples:
        - eu: Proiektu berriaren alde nago.
          es: Estoy a favor del proyecto nuevo.
        - eu: Hiritar asko proiektuaren aurka daude.
          es: Muchos ciudadanos están en contra del proyecto.
