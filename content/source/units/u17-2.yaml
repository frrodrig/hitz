  - type: story
    title:
      es: "Historia: el carril bici"
      eu: "Istorioa: bidegorria"
    story:
      title: Bidegorria
      lines:
        - Kazetaria | Egun on! Bidegorri berriari buruz galdetzen ari gara. Proiektuaren alde zaude? = ¡Buenos días! Estamos preguntando sobre el nuevo carril bici. ¿Está a favor del proyecto?
        - Asier | Bai, alde nago. Egunero bizikletaz joan behar izaten dut lanera. = Sí, estoy a favor. Suelo tener que ir en bici al trabajo todos los días.
        - Kazetaria | Eta zuk? = ¿Y usted?
        - Amona | Ni kontra nago. Bidegorriarekin ez dugu aparkalekurik izango gure kalean! = Yo estoy en contra. ¡Con el carril bici no tendremos aparcamiento en nuestra calle!
        - Asier | Baina aukera ona da hiritar guztientzat. Haurrek ere bizikletaz ibiltzeko eskubidea dute. = Pero es una buena opción para todos los ciudadanos. Los niños también tienen derecho a ir en bici.
        - Amona | Haurrei ez diet errepidean bizikletaz ibiltzen uzten. = A los niños no les dejo ir en bici por la carretera.
        - Asier | Horregatik behar dugu bidegorria! = ¡Por eso necesitamos el carril bici!
        - Amona | Kontuan hartuko dut. Baina ez nago ziur. = Lo tendré en cuenta. Pero no estoy segura.
      questions:
        - afterLine: 2
          prompt: ¿Por qué está Asier a favor del carril bici?
          options:
            - Porque suele ir en bici al trabajo
            - Porque es periodista
            - Porque no tiene coche
        - afterLine: 4
          prompt: ¿Por qué está la abuela en contra?
          options:
            - Porque no tendrán aparcamiento en su calle
            - Porque no le gustan las bicis
            - Porque los niños no tienen bici
        - afterLine: 7
          prompt: ¿Qué argumento usa Asier al final?
          options:
            - Que el carril bici es más seguro para los niños
            - Que la abuela debería comprar una bici
            - Que habrá más aparcamiento
  - type: review
  - type: challenge
    host: unai
