# Unit 11.1 · Lanbideak — jobs and working conditions, JAKIN, -T(Z)EN + jakin, NORAKO,
# NOR-NORI-NORK (diot, didazu…). Source format: see u01-1.yaml and docs/content-guide.md.
id: u11-1
section: s4
bookUnit: 11
title:
  es: Profesiones
  eu: Lanbideak
goals:
  - es: Pedir y dar información sobre un trabajo (horario, sueldo y contrato).
    eu: Lan bati buruzko informazioa eskatu eta eman (ordutegia, soldata eta kontratua).
  - es: Decir qué sabe hacer una persona.
    eu: Norbaitek zer egiten dakien esan.
  - es: Decir a quién hacemos algo con «diot», «didazu»…
    eu: Norbaiti zerbait egiten diogula esan «diot», «didazu»… erabiliz.
guidebook:
  sections:
    - title:
        es: "Saber: dakit, dakizu"
        eu: "Jakin: dakit, dakizu"
      body:
        es: "«Jakin» (saber) tiene formas propias en presente: dakit, dakizu, daki, dakigu, dakizue, dakite. En respuestas afirmativas sin más palabras se usa «ba-»: «Badakit»."
        eu: "«Jakin» aditzak orainaldiko forma trinkoak ditu: dakit, dakizu, daki, dakigu, dakizue, dakite. Baiezko erantzun laburretan «ba-» erabiltzen da: «Badakit»."
      examples:
        - eu: Ez dakit.
          es: No lo sé.
        - eu: Badakizu Mikelen helbidea?
          es: ¿Sabes la dirección de Mikel?
        - eu: Bai, badakit.
          es: Sí, la sé.
    - title:
        es: "Saber hacer algo: gidatzen dakit"
        eu: "Zerbait egiten jakin: gidatzen dakit"
      body:
        es: Para decir lo que alguien sabe hacer, el verbo va en la forma -t(z)en (gidatzen, idazten, egiten) delante de «jakin». En español usamos el infinitivo.
        eu: Norbaitek zer egiten dakien esateko, aditza -t(z)en forman doa (gidatzen, idazten, egiten) «jakin» aditzaren aurretik.
      examples:
        - eu: Badakizu gidatzen?
          es: ¿Sabes conducir?
        - eu: Ez dakit igeri egiten.
          es: No sé nadar.
    - title:
        es: "Para qué, para cuándo: -rako"
        eu: "Norako: -rako"
      body:
        es: "El sufijo «-rako» indica destino o finalidad, como «para»: «lanerako» (para el trabajo), «Bilborako» (para Bilbao), «bi urterako» (para dos años)."
        eu: "«-rako» atzizkiak helburua edo norakoa adierazten du: «lanerako», «Bilborako», «bi urterako»."
      examples:
        - eu: Kontratua bi urterako da.
          es: El contrato es para dos años.
        - eu: Hau Bilborako autobusa da.
          es: Este es el autobús para Bilbao.
    - title:
        es: "Hacer algo a alguien: diot, didazu"
        eu: "Norbaiti zerbait egin: diot, didazu"
      body:
        es: "Cuando hay alguien que recibe la acción (a quién, con -ri), el auxiliar cambia: diot (yo a él), diozu (tú a él), dio (él a él), dit (él a mí), didazu (tú a mí), dizut (yo a ti), diet (yo a ellos)."
        eu: "Norbaitek zerbait jasotzen duenean (nori, -ri), laguntzailea aldatzen da: diot, diozu, dio, dit, didazu, dizut, diet."
      examples:
        - eu: Nagusiari deitu diot.
          es: He llamado al jefe.
        - eu: Zuk idatzi didazu?
          es: ¿Me has escrito?
        - eu: Enpresak soldata ordaindu dit.
          es: La empresa me ha pagado el sueldo.
