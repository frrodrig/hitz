        - Nerea | Eta soldata ona da? = ¿Y el sueldo es bueno?
        - Gorka | Bai, eta kontratua bi urterako da. = Sí, y el contrato es para dos años.
        - Gorka | Nagusia oso jatorra da. Gaur kafe bat erosi dit! = El jefe es muy majo. ¡Hoy me ha comprado un café!
        - Nerea | Zorionak! Zure enpresak gidariak behar ditu? = ¡Enhorabuena! ¿Tu empresa necesita conductores?
        - Gorka | Bai! Badakizu autobusa gidatzen? = ¡Sí! ¿Sabes conducir un autobús?
        - Nerea | Ez, ez dakit. Ni idazkaria naiz. = No, no sé. Yo soy secretaria.
        - Gorka | Lasai! Gure enpresak idazkari bat behar du. = ¡Tranquila! Nuestra empresa necesita una secretaria.
        - Nerea | Primeran! Bihar deituko dizut. = ¡Genial! Mañana te llamo.
      questions:
        - afterLine: 3
          prompt: ¿Cuál es el horario de Gorka?
          options:
            - De seis a tres
            - De ocho a tres
            - Por la tarde
        - afterLine: 6
          prompt: ¿Qué ha hecho hoy el jefe de Gorka?
          options:
            - Le ha comprado un café
            - Le ha pagado el sueldo
            - Le ha dado un contrato nuevo
        - afterLine: 11
          prompt: ¿Qué hará Nerea mañana?
          options:
            - Llamar a Gorka
            - Conducir un autobús
            - Ir a la oficina de Gorka
