# Unit 14.2 · Garai bateko herria — A2.1 book unit 2 (B + C): where one lived as a child, what
# there was in the town and at home, old schools and appliances; childhood games, holidays and
# tastes. Past of EGON (zegoen, bazegoen …-rik?) and EDUKI (neukan, zeuzkan), NOR-NORI in the past
# (gustatzen zitzaidan / zitzaizkidan), time markers; recall of BIZI IZAN in the past, gustatu +
# -T(Z)EA in the past (10.2) and the habitual past (12.2).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u14-2
section: s5
bookUnit: 14
title:
  es: El pueblo de antes
  eu: Garai bateko herria
goals:
  - es: Decir dónde vivías de pequeño y preguntar a los demás.
    eu: Txikitan non bizi zinen esan, eta besteei galdetu.
  - es: Contar qué había en tu pueblo y qué teníais en casa.
    eu: Zure herrian zer zegoen eta etxean zer zeneukaten kontatu.
  - es: Hablar de los juegos, las vacaciones y los gustos de tu infancia.
    eu: Haurtzaroko jolasez, oporrez eta gustuez hitz egin.
guidebook:
  sections:
    - title:
        es: "Dónde estaba, qué había: zegoen, zeuden"
        eu: "Non zegoen, zer zegoen: zegoen, zeuden"
      body:
        es: "Pasado de «egon»: nengoen, zeunden, zegoen, geunden, zeundeten, zeuden. Sirve para «estaba» y para «había»: «Herrian zinema bat zegoen» (había un cine). Para preguntar si había algo: «Bazegoen …-rik?»."
        eu: "«Egon» aditzaren lehenaldia: nengoen, zeunden, zegoen, geunden, zeundeten, zeuden. «Non zegoen?» edo «zer zegoen?» galdetzeko balio du. Zerbait zegoen galdetzeko: «Bazegoen …-rik?»."
      examples:
        - eu: Herrian zinema txiki bat zegoen.
          es: En el pueblo había un cine pequeño.
        - eu: Bazegoen liburutegirik zure auzoan?
          es: ¿Había biblioteca en tu barrio?
        - eu: Atzo etxean nengoen.
          es: Ayer estaba en casa.
    - title:
        es: "Qué tenía: neukan, zeuzkan"
        eu: "Zer neukan: neukan, zeuzkan"
      body:
        es: "Pasado de «eduki»: neukan, zeneukan, zeukan, geneukan… Con algo plural lleva -z-: neuzkan, zeuzkan. Significa lo mismo que «nuen / nituen»."
        eu: "«Eduki» aditzaren lehenaldia: neukan, zeneukan, zeukan, geneukan… Plurala bada, -z- hartzen du: neuzkan, zeuzkan. «Nuen / nituen» bezalakoa da."
      examples:
        - eu: Etxean labe zahar bat geneukan.
          es: En casa teníamos un horno viejo.
        - eu: Amonak bi irrati zeuzkan.
          es: La abuela tenía dos radios.
    - title:
        es: "Me gustaba: gustatzen zitzaidan"
        eu: "Gustatzen zitzaidan"
      body:
        es: "Pasado de «gustatu»: gustatzen zitzaidan (me gustaba), zitzaizun, zitzaion, zitzaigun… Si lo que gustaba es plural, -zki-: zitzaizkidan. Con un verbo, en -t(z)ea y en singular: «Irakurtzea gustatzen zitzaidan»."
        eu: "«Gustatu» aditzaren lehenaldia: gustatzen zitzaidan, zitzaizun, zitzaion, zitzaigun… Gustatzen zitzaiguna plurala bada, -zki-: zitzaizkidan. Aditz batekin, -t(z)ea eta singularra: «Irakurtzea gustatzen zitzaidan»."
      examples:
        - eu: Txikitan ipuinak asko gustatzen zitzaizkidan.
          es: De pequeño me gustaban mucho los cuentos.
        - eu: Pilotan jokatzea gustatzen zitzaigun.
          es: Nos gustaba jugar a pelota.
    - title:
        es: "Cuándo: txikitan, gaztetan, iaz"
        eu: "Noiz: txikitan, gaztetan, iaz"
      body:
        es: "Algunas palabras piden pasado (atzo, iaz, txikitan, gaztetan, umetan), otras presente (orain, aurten) y otras futuro (bihar, datorren urtean). Con -t(z)en + nintzen / nuen se cuenta lo que se hacía a menudo."
        eu: "Hitz batzuek lehenaldia eskatzen dute (atzo, iaz, txikitan, gaztetan, umetan), beste batzuek orainaldia (orain, aurten) eta beste batzuek geroaldia (bihar, datorren urtean). -T(z)en + nintzen / nuen formarekin ohiturak kontatzen dira."
      examples:
        - eu: Umetan udan hondartzara joaten ginen.
          es: De niños, en verano íbamos a la playa.
        - eu: Datorren urtean jaioterrira itzuliko naiz.
          es: El año que viene volveré a mi pueblo natal.
