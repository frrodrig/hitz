  - type: story
    title:
      es: "Historia: el pueblo de la abuela"
      eu: "Istorioa: amonaren herria"
    story:
      title: Amonaren herria
      lines:
        - Amona | Begira, Uxue, hau da nire jaioterria. = Mira, Uxue, este es mi pueblo natal.
        - Uxue | Herri txiki honetan bizi zinen? = ¿Vivías en este pueblo tan pequeño?
        - Amona | Bai, hemen bizi nintzen gurasoekin eta bi ahizpekin. = Sí, vivía aquí con mis padres y dos hermanas.
        - Uxue | Zer zegoen herrian? = ¿Qué había en el pueblo?
        - Amona | Eskola txiki bat, eliza eta taberna bat. Ez zegoen zinemarik. = Una escuela pequeña, la iglesia y un bar. No había cine.
        - Uxue | Eta etxean telebista zeneukaten? = ¿Y teníais tele en casa?
        - Amona | Ez! Irrati bat geneukan sukaldean. = ¡No! Teníamos una radio en la cocina.
        - Uxue | Zer gustatzen zitzaizun egitea txikitan? = ¿Qué te gustaba hacer de pequeña?
        - Amona | Plazan korrika egitea eta ipuinak irakurtzea. = Correr en la plaza y leer cuentos.
        - Uxue | Niri ere ipuinak asko gustatzen zaizkit! = ¡A mí también me gustan mucho los cuentos!
      questions:
        - afterLine: 3
          prompt: ¿Con quién vivía la abuela?
          options:
            - Con sus padres y dos hermanas
            - Con sus abuelos
            - Sola
        - afterLine: 5
          prompt: ¿Qué no había en el pueblo?
          options:
            - Cine
            - Escuela
            - Iglesia
        - afterLine: 9
          prompt: ¿Qué le gustaba hacer a la abuela?
          options:
            - Correr en la plaza y leer cuentos
            - Ver la televisión
            - Ir a la playa
