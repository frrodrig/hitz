          - Udaletxea elizaren aurrean dago. = El ayuntamiento está delante de la iglesia.
          - Liburutegia plazaren eta parkearen artean dago. = La biblioteca está entre la plaza y el parque.
          - Orain Ane Jonen ondoan dago. = Ahora Ane está al lado de Jon.
          - Hotelaren aurrean taberna asko daude. = Delante del hotel hay muchos bares. | Hay muchos bares delante del hotel.
