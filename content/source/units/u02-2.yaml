        - Aitor | Eguzkia dago, eta oso bero egiten du! Eta Gasteizen? = ¡Hace sol y mucho calor! ¿Y en Vitoria?
        - Nerea | Hemen euria ari du, eta hotz egiten du. = Aquí llueve y hace frío.
        - Aitor | Zer ordu da? = ¿Qué hora es?
        - Nerea | Hirurak eta erdiak dira. = Son las tres y media.
        - Nerea | Zarautzen jatetxe polit bat dago, plazan. Elizaren ondoan dago. = En Zarautz hay un restaurante bonito, en la plaza. Está al lado de la iglesia.
        - Aitor | Plaza urrun dago? = ¿La plaza está lejos?
        - Nerea | Ez, oso gertu. Segi zuzen eta ezkerrera. = No, muy cerca. Sigue recto y a la izquierda.
        - Aitor | Eskerrik asko! Agur! = ¡Muchas gracias! ¡Adiós!
      questions:
