          - text: Parkea eskolaren atzean dago.
            options:
              - El parque está detrás de la escuela.
              - El parque está delante de la escuela.
              - El parque está al lado de la escuela.
        chats:
          - messages:
              - Mikel | Barkatu, non dago bankua?
            options:
              - Bankua farmaziaren ondoan dago.
              - Bankua farmaziaren ondoan da.
              - Bai, badago.
        true_false:
          - passage: Hotela plazan dago. Taberna hotelaren azpian dago, eta jatetxea ere bai.
            statement: El bar está encima del hotel.
            answer: false
      - structures: [directions, compass]
        sentences:
          - Segi zuzen. = Sigue recto. | Siga recto. | Todo recto.
          - Segi zuzen eta eskuinera. = Sigue recto y a la derecha. | Siga recto y a la derecha. | Todo recto y a la derecha.
          - Farmazia ezkerrean dago. = La farmacia está a la izquierda.
          - Hotela eskuinean dago. = El hotel está a la derecha.
          - Hondartza gertu dago, baina mendia urrun. = La playa está cerca, pero el monte está lejos. | La playa está cerca, pero el monte, lejos.
          - Geltokia pixka bat urrun dago. = La estación está un poco lejos.
          - Baiona iparraldean dago. = Bayona está en el norte. | Bayona está al norte.
          - Tutera hegoaldean dago. = Tudela está en el sur. | Tudela está al sur.
        pairs:
          - - eskuin = derecha
            - ezker = izquierda
            - zuzen = recto
            - gertu = cerca
            - urrun = lejos
            - ipar = norte
        blanks:
          - text: Mendia ___ dago. = El monte está lejos.
            options:
              - urrun
              - gertu
              - zuzen
        meanings:
          - text: Segi zuzen eta ezkerrera.
            options:
              - Sigue recto y a la izquierda.
              - Sigue recto y a la derecha.
              - Está a la izquierda.
        chats:
          - messages:
              - Irati | Barkatu, geltokia gertu dago?
            options:
              - Bai, segi zuzen eta eskuinera.
              - Bai, ni geltokian naiz.
              - Ez horregatik.
        true_false:
          - passage: Zuberoa ekialdean dago, eta Bizkaia mendebaldean.
            statement: Bizkaia está en el oeste.
            answer: true
      - structures: [noun-adjective, weather]
        sentences:
          - Tolosa herri polita da. = Tolosa es un pueblo bonito.
          - Bilbo hiri handia da. = Bilbao es una ciudad grande.
          - Plaza hau txikia da. = Esta plaza es pequeña.
          - Euria ari du. = Llueve. | Está lloviendo.
          - Elurra ari du. = Nieva. | Está nevando.
          - Orain eguzkia dago. = Ahora hace sol. | Ahora hay sol.
          - Haize egiten du. = Hace viento.  # TODO(revisión-nativa): «haize egiten du» frente a «haizea dabil»; ¿cuál enseñar en A1?
          - Mendian beti hotz egiten du. = En el monte siempre hace frío. | Siempre hace frío en el monte.
        pairs:
          - - handi = grande
            - txiki = pequeño
            - polit = bonito
            - euri = lluvia
            - elur = nieve
            - eguzki = sol
        blanks:
          - text: Bilbo hiri ___ da. = Bilbao es una ciudad grande.
            options:
