    lessons:
      - structures: [directions, postpositions-noren]
        sentences:
          - Barkatu, ospitalea urrun dago? = Perdona, ¿el hospital está lejos? | Perdone, ¿el hospital está lejos?
          - Ez, gertu dago. = No, está cerca.
          - Segi zuzen eta ezkerrera. = Sigue recto y a la izquierda. | Siga recto y a la izquierda. | Todo recto y a la izquierda.
          - Ospitalea parkearen ondoan dago. = El hospital está al lado del parque.
          - Geltokia eskuinean dago, hotelaren atzean. = La estación está a la derecha, detrás del hotel.
          - Barkatu, berriro eta poliki, mesedez. = Perdona, otra vez y despacio, por favor. | Perdone, otra vez y despacio, por favor.
