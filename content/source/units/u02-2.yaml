          prompt: ¿Qué tiempo hace en Vitoria?
          options:
            - Llueve y hace frío
            - Hace sol y calor
            - Nieva
        - afterLine: 6
          prompt: ¿Qué hora es?
          options:
            - Las tres y media
            - Las tres y cuarto
            - Las cuatro menos cuarto
        - afterLine: 10
          prompt: ¿Dónde está el restaurante?
