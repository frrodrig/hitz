# Unit 2.2 · Non dago? — locating with postpositions (bankuaren ondoan), directions, compass
# points, noun + adjective, telling the time and talking about the weather.
id: u02-2
section: s1
bookUnit: 2
title:
  es: ¿Dónde está?
  eu: Non dago?
goals:
  - es: Situar algo o a alguien y dar indicaciones sencillas.
    eu: Zerbait edo norbait kokatu eta argibide errazak eman.
  - es: Describir lugares y decir la hora.
    eu: Lekuak deskribatu eta ordua esan.
  - es: Hablar del tiempo que hace.
    eu: Eguraldiaz hitz egin.
guidebook:
  sections:
    - title:
        es: "Delante, detrás, al lado…"
        eu: "Aurrean, atzean, ondoan…"
      body:
        es: "El lugar de referencia lleva -aren (o -ren con nombres propios) y después la posposición: bankuaren ondoan (al lado del banco), Aneren atzean (detrás de Ane). «Artean» (entre) une dos lugares con «eta»."
        eu: "Erreferentziako lekuak -aren (edo -ren izen berekiekin) hartzen du, eta gero postposizioa dator: bankuaren ondoan, Aneren atzean. «Artean» bi leku lotzen ditu «eta»-rekin."
      examples:
        - eu: Farmazia bankuaren ondoan dago.
          es: La farmacia está al lado del banco.
        - eu: Taberna hotelaren azpian dago.
          es: El bar está debajo del hotel.
        - eu: Liburutegia plazaren eta parkearen artean dago.
          es: La biblioteca está entre la plaza y el parque.
    - title:
        es: "Indicar el camino"
        eu: "Bidea adierazi"
      body:
        es: "«Segi zuzen» es «sigue recto»; «eskuinera» y «ezkerrera», «hacia la derecha / izquierda»; «eskuinean» y «ezkerrean», «a la derecha / izquierda» (dónde está). Los puntos cardinales llevan -aldean: iparraldean (en el norte), hegoaldean, ekialdean, mendebaldean."
        eu: "«Segi zuzen», «eskuinera» eta «ezkerrera» bidea adierazteko; «eskuinean» eta «ezkerrean» zerbait non dagoen esateko. Puntu kardinalek -aldean hartzen dute: iparraldean, hegoaldean, ekialdean, mendebaldean."
      examples:
        - eu: Segi zuzen eta eskuinera.
          es: Sigue recto y a la derecha.
        - eu: Baiona iparraldean dago.
          es: Bayona está en el norte.
    - title:
        es: "Nombre + adjetivo"
        eu: "Izena + adjektiboa"
      body:
        es: "El adjetivo va detrás del nombre y el artículo, al final del grupo: herri polita (el pueblo bonito), hiri handia (la ciudad grande). Con «bat», sin artículo: hotel handi bat (un hotel grande)."
        eu: "Adjektiboa izenaren atzean doa, eta artikulua taldearen amaieran: herri polita, hiri handia. «Bat»-ekin, artikulurik gabe: hotel handi bat."
      examples:
        - eu: Tolosa herri polita da.
          es: Tolosa es un pueblo bonito.
        - eu: Plazan hotel handi bat dago.
          es: En la plaza hay un hotel grande.
    - title:
        es: "La hora y el tiempo"
        eu: "Ordua eta eguraldia"
      body:
        es: "«Zer ordu da?»: «Ordu bata da», y desde las dos, en plural: «Hirurak dira», «Hirurak eta erdiak», «Laurak eta laurden», «Bostak laurden gutxi». Para el tiempo: «Euria ari du» (llueve), «Bero egiten du» (hace calor), «Eguzkia dago» (hace sol)."
        eu: "«Zer ordu da?»: «Ordu bata da», eta bietatik aurrera pluralean: «Hirurak dira», «Hirurak eta erdiak», «Laurak eta laurden», «Bostak laurden gutxi». Eguraldirako: «Euria ari du», «Bero egiten du», «Eguzkia dago»."
      examples:
        - eu: Zer ordu da? Hirurak eta erdiak dira.
          es: ¿Qué hora es? Son las tres y media.
        - eu: Euria ari du, eta hotz egiten du.
          es: Llueve y hace frío.
    - title:
        es: "Ahora, siempre, ¿cuándo?"
        eu: "Orain, beti, noiz?"
      body:
        es: "«Orain» (ahora) y «beti» (siempre) suelen ir al principio de la frase o delante del verbo: «Orain euria ari du», «Bilbon beti euria ari du». «Noiz?» (¿cuándo?) va al principio de la pregunta y justo delante del verbo, como «non?»."
        eu: "«Orain» eta «beti» esaldiaren hasieran edo aditzaren aurrean joan ohi dira: «Orain euria ari du», «Bilbon beti euria ari du». «Noiz?» galderaren hasieran doa, aditzaren aurrean, «non?» galdera bezala."
      examples:
        - eu: Zer ordu da orain?
          es: ¿Qué hora es ahora?
        - eu: Bilbon beti euria ari du!
          es: ¡En Bilbao siempre llueve!
        - eu: Noiz egiten du bero hemen?
          es: ¿Cuándo hace calor aquí?
