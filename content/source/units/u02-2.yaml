  - type: story
    title:
      es: "Historia: ¿sol o lluvia?"
      eu: "Istorioa: eguzkia ala euria?"
    story:
      title: Eguzkia ala euria?
      lines:
        - Nerea | Kaixo, Aitor! Non zaude orain? = ¡Hola, Aitor! ¿Dónde estás ahora?
        - Aitor | Zarautzen nago, hondartzaren ondoan. = Estoy en Zarautz, al lado de la playa.
        - Nerea | Zer eguraldi egiten du Zarautzen? = ¿Qué tiempo hace en Zarautz?
        - Aitor | Eguzkia dago, eta oso bero egiten du! Eta Gasteizen? = ¡Hace sol y mucho calor! ¿Y en Vitoria?
        - Nerea | Hemen euria ari du, eta hotz egiten du. = Aquí llueve y hace frío.
        - Aitor | Gasteizen beti hotz egiten du! Noiz egiten du bero? = ¡En Vitoria siempre hace frío! ¿Cuándo hace calor?
        - Nerea | Ez dakit! Gaur ez. = ¡No lo sé! Hoy no.
        - Aitor | Zer ordu da orain? = ¿Qué hora es ahora?
        - Nerea | Hirurak eta erdiak. Zarautzen jatetxe polit bat dago, elizaren ondoan. = Las tres y media. En Zarautz hay un restaurante bonito, al lado de la iglesia.
        - Aitor | Barkatu? Berriro, mesedez. = ¿Perdona? Otra vez, por favor.
        - Nerea | Elizaren ondoan. Ez dago urrun. Segi zuzen eta ezkerrera. = Al lado de la iglesia. No está lejos. Sigue recto y a la izquierda.
        - Aitor | Eskerrik asko! Agur! = ¡Muchas gracias! ¡Adiós!
      questions:
        - afterLine: 4
          prompt: ¿Qué tiempo hace en Vitoria?
          options:
            - Llueve y hace frío
            - Hace sol y calor
            - Nieva
        - afterLine: 8
          prompt: ¿Qué hora es?
          options:
            - Las tres y media
            - Las tres y cuarto
            - Las cuatro menos cuarto
        - afterLine: 11
          prompt: ¿Dónde está el restaurante?
          options:
            - Al lado de la iglesia
            - Detrás de la playa
            - Lejos de la plaza
