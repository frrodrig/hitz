        sentences:
          - Gaur Mikelen ondoan nago. = Hoy estoy al lado de Mikel. | Hoy yo estoy al lado de Mikel.
          - Zu Aneren atzean zaude. = Estás detrás de Ane. | Tú estás detrás de Ane. | Usted está detrás de Ane.
          - Gu udaletxearen aurrean gaude. = Estamos delante del ayuntamiento. | Nosotros estamos delante del ayuntamiento.
          - Hotela geltokiaren eta bankuaren artean dago. = El hotel está entre la estación y el banco.
          - Jatetxea tabernaren gainean dago. = El restaurante está encima del bar.
          - Beste farmazia bat ospitalearen ondoan dago. = Hay otra farmacia al lado del hospital. | Otra farmacia está al lado del hospital.
          - Non dago liburutegia? Eskolaren atzean. = ¿Dónde está la biblioteca? Detrás de la escuela.
          - Ikasleak irakaslearen aurrean daude. = Los estudiantes están delante del profesor. | Los estudiantes están delante de la profesora. | Las estudiantes están delante de la profesora.
        blanks:
          - text: Gu udaletxearen aurrean ___. = Estamos delante del ayuntamiento.
            options:
              - gaude
              - gara
              - daude
          - text: Hotela geltokiaren eta bankuaren ___ dago. = El hotel está entre la estación y el banco.
            options:
              - artean
              - gainean
              - azpian
        meanings:
          - text: Zu Aneren atzean zaude.
            options:
              - Estás detrás de Ane.
              - Ane está detrás de ti.
              - Estás delante de Ane.
        chats:
          - messages:
              - Unai | Kaixo! Non zaude orain?
            options:
              - Geltokiaren aurrean nago.
              - Geltokiaren aurrean naiz.
              - Geltokiaren aurrean zaude.
        true_false:
          - passage: Plazan taberna asko daude. Taberna bat elizaren ondoan dago, eta eliza udaletxearen aurrean.
            statement: Hay un bar al lado de la iglesia.
            answer: true
      - structures: [time]
        sentences:
          - Barkatu, zer ordu da orain? = Perdona, ¿qué hora es ahora? | Perdone, ¿qué hora es ahora?
          - Ordu bata da. = Es la una.
          - Ordu biak dira. = Son las dos.
          - Hirurak eta erdiak dira. = Son las tres y media.
          - Laurak eta laurden dira. = Son las cuatro y cuarto.
          - Bostak laurden gutxi dira. = Son las cinco menos cuarto.
          - Ez dakit. Zazpiak edo zortziak dira. = No lo sé. Son las siete o las ocho. | No sé. Son las siete o las ocho.
          - Hamarrak eta erdiak dira. = Son las diez y media.
        pairs:
          - - ordu bata = la una
            - ordu biak = las dos
            - seiak = las seis
            - zortziak = las ocho
            - bederatziak = las nueve
            - eta erdiak = y media
        blanks:
          - text: Hirurak eta ___ dira. = Son las tres y media.
            options:
              - erdiak
              - laurden
              - gutxi
        meanings:
          - text: Bostak laurden gutxi dira.
            options:
              - Son las cinco menos cuarto.
              - Son las cinco y cuarto.
              - Son las cuatro y media.
        chats:
          - messages:
              - Nahia | Barkatu, zer ordu da?
            options:
              - Seiak eta laurden dira.
              - Seiak eta laurden dago.
              - Sei naiz.
        true_false:
          - passage: Zer ordu da? Zortziak eta erdiak dira.
            statement: Son las ocho y media.
            answer: true
      - structures: [weather, noun-adjective]
        sentences:
          - Zer eguraldi egiten du? = ¿Qué tiempo hace?
          - Bero egiten du. = Hace calor.
          - Oso hotz egiten du. = Hace mucho frío.
          - Bilbon beti euria ari du! = ¡En Bilbao siempre llueve! | ¡Siempre llueve en Bilbao!
          - Mendian elurra ari du. = En el monte nieva. | Nieva en el monte. | Está nevando en el monte.
          - Gaur hondartzan eguzkia dago. = Hoy hace sol en la playa. | Hoy en la playa hace sol. | Hoy hay sol en la playa.
          - Noiz egiten du bero Gasteizen? = ¿Cuándo hace calor en Vitoria?
          - Egun hotza da, baina eguzkia dago. = Es un día frío, pero hace sol. | Es un día frío, pero hay sol.
        blanks:
          - text: Oso hotz egiten ___. = Hace mucho frío.
            options:
              - du
              - da
              - dago
          - text: ___ egiten du hotz Gasteizen? Beti! = ¿Cuándo hace frío en Vitoria? ¡Siempre!
            options:
              - Noiz
              - Non
              - Nor
        meanings:
          - text: Bero egiten du.
            options:
              - Hace calor.
              - Hace frío.
              - Hace viento.
        chats:
          - messages:
              - Gorka | Kaixo! Zer eguraldi egiten du Gasteizen?
            options:
              - Hotz egiten du.
              - Hotz da.
              - Gasteizen nago.
        true_false:
          - passage: Lekeition orain eguzkia dago, eta bero egiten du.
            statement: En Lekeitio hace frío.
            answer: false
        images:
          - wind, rain, sun
          - cold, hot, rain
