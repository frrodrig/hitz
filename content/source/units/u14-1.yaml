# Unit 14.1 · Txikitan — A2.1 book unit 2 (Atarian + A): describing what people looked like and
# what they had in the past; describing objects in the past by colour, size, pattern and material.
# Past of UKAN with a plural object (nituen, zituen) and ba- in the past; compound adjectives
# (ilehori, begiurdin); -DUN; recall of the past of IZAN / UKAN (12.2) and ZEREZKOA (9.1).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u14-1
section: s5
bookUnit: 14
title:
  es: De pequeño
  eu: Txikitan
goals:
  - es: Describir cómo eran las personas antes y qué tenían.
    eu: Pertsonak lehen nolakoak ziren eta zer zuten deskribatu.
  - es: Contar qué juguetes y cosas tenías de pequeño.
    eu: Txikitan zer jostailu eta gauza zenituen kontatu.
  - es: "Describir objetos en pasado: color, tamaño, dibujo y material."
    eu: "Objektuak lehenaldian deskribatu: kolorea, tamaina, marrazkia eta materiala."
guidebook:
  sections:
    - title:
        es: "Cómo era, qué tenía: zen, zuen, zituen"
        eu: "Nolakoa zen, zer zuen: zen, zuen, zituen"
      body:
        es: Repaso del pasado de «izan» (nintzen, zen, ginen…) y de «ukan» (nuen, zuen, genuen…). Si lo que se tenía es plural, «ukan» lleva -it-, como en presente (ditut → nituen, ditu → zituen). «Ba-» delante afirma o pregunta, como en presente (banuen, bazenuen?).
        eu: «Izan» (nintzen, zen, ginen…) eta «ukan» (nuen, zuen, genuen…) aditzen lehenaldia errepasatzen dugu. Zuena plurala bada, «ukan» aditzak -it- hartzen du, orainaldian bezala (ditut → nituen, ditu → zituen). «Ba-» aurrean baieztatzeko edo galdetzeko erabiltzen da (banuen, bazenuen?).
      examples:
        - eu: Txikitan ilehoria nintzen.
          es: De pequeño era rubio.
        - eu: Amonak begi urdinak zituen.
          es: La abuela tenía los ojos azules.
        - eu: Bazenuen bizikletarik txikitan?
          es: ¿Tenías bicicleta de pequeño?
    - title:
        es: "Rubio, calvo, de ojos azules: ilehori, burusoil, begiurdin"
        eu: "Ilehori, burusoil, begiurdin"
      body:
        es: "Muchos rasgos físicos son un nombre seguido de un adjetivo, escritos juntos en una palabra (ile + hori = ilehori, buru + soil = burusoil). También se puede decir con «-k … ditu»: «begi urdinak ditu»."
        eu: Ezaugarri fisiko asko izen bat eta adjektibo bat dira, hitz bakarrean idatzita (ile + hori = ilehori, buru + soil = burusoil). «Begi urdinak ditu» esan daiteke ere.
      examples:
        - eu: Aitona burusoila zen, eta bizarra zuen.
          es: El abuelo era calvo y tenía barba.
        - eu: Neska begiurdina da.
          es: La chica tiene los ojos azules.
    - title:
        es: "De rayas, de flores: -dun"
        eu: "Marraduna, loreduna: -dun"
      body:
        es: "«-dun» significa «que tiene»: marradun (de rayas), loredun (de flores), koadrodun (de cuadros), poltsikodun (con bolsillos). Se dice qué tiene una cosa; «zerezkoa» dice de qué está hecha."
        eu: "«-dun» atzizkiak «duena» esan nahi du: marradun, loredun, koadrodun. Gauza batek zer duen adierazten du; «zerezkoa» galderak, berriz, zerez egina dagoen."
      examples:
        - eu: Jaka marraduna zen.
          es: La chaqueta era de rayas.
        - eu: Eraztuna zilarrezkoa zen.
          es: El anillo era de plata.
        - eu: Zapatak larruzkoak ziren.
          es: Los zapatos eran de cuero.
