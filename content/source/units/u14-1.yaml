  - type: story
    title:
      es: "Historia: objetos perdidos"
      eu: "Istorioa: galdutako objektuak"
    story:
      title: Galdutako objektuak
      lines:
        - Langilea | Egun on. Zer galdu duzu? = Buenos días. ¿Qué ha perdido?
        - Itziar | Egun on. Atzo poltsa bat galdu nuen, autobusean. = Buenos días. Ayer perdí un bolso, en el autobús.
        - Langilea | Nolakoa zen poltsa? = ¿Cómo era el bolso?
        - Itziar | Handia zen, larruzkoa eta marroia. = Era grande, de cuero y marrón.
        - Langilea | Poltsikorik bazuen? = ¿Tenía bolsillos?
        - Itziar | Bai, bi poltsiko zituen. Poltsan nire amonaren eraztuna nuen. = Sí, tenía dos bolsillos. En el bolso llevaba el anillo de mi abuela.
        - Langilea | Zerezkoa zen eraztuna? = ¿De qué era el anillo?
        - Itziar | Urrezkoa. Oso zaharra da. = De oro. Es muy antiguo.
        - Langilea | Begira! Poltsa hau zurea da? = ¡Mire! ¿Este bolso es suyo?
        - Itziar | Bai! Eskerrik asko! = ¡Sí! ¡Muchas gracias!
      questions:
        - afterLine: 2
          prompt: ¿Dónde perdió Itziar el bolso?
          options:
            - En el autobús
            - En el banco
            - En la calle
        - afterLine: 4
          prompt: ¿Cómo era el bolso?
          options:
            - Grande, de cuero y marrón
            - Pequeño, de tela y rojo
            - Grande, de plástico y negro
        - afterLine: 8
          prompt: ¿De qué era el anillo?
          options:
            - De oro
            - De plata
            - De madera
