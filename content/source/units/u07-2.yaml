  - type: story
    title:
      es: "Historia: en diciembre, a París"
      eu: "Istorioa: abenduan, Parisera"
    story:
      title: Abenduan, Parisera
      lines:
        - Maialen | Kaixo, Aitor! Nora zoaz? = ¡Hola, Aitor! ¿Adónde vas?
        - Aitor | Bidaia-agentziara noa. Abenduan Parisera joango naiz! = Voy a la agencia de viajes. ¡En diciembre iré a París!
        - Maialen | Bai? Norekin joango zara? = ¿Sí? ¿Con quién irás?
        - Aitor | Nire arrebarekin. Hura Parisen bizi da. = Con mi hermana. Ella vive en París.
        - Maialen | Eta zenbat aste geratuko zara? = ¿Y cuántas semanas te quedarás?
        - Aitor | Bi aste. Urtarrilean itzuliko naiz. = Dos semanas. Volveré en enero.
        - Aitor | Eta zu? Zer egingo duzu abenduan? = ¿Y tú? ¿Qué harás en diciembre?
