        sentences:
          - Bihar Bilbora joango naiz. = Mañana iré a Bilbao. | Mañana voy a ir a Bilbao. | Mañana voy a Bilbao.
          - Etzi amarekin bazkalduko dut. = Pasado mañana comeré con mi madre. | Pasado mañana voy a comer con mi madre.
          - Datorren astean Ane etorriko da. = La semana que viene vendrá Ane. | La próxima semana vendrá Ane. | Ane vendrá la semana que viene.
          - Aurten Frantziara bidaiatuko dugu. = Este año viajaremos a Francia. | Este año vamos a viajar a Francia.
          - Gaur gauean etxean afalduko dugu edo jatetxera joango gara. = Esta noche cenaremos en casa o iremos a un restaurante. | Esta noche vamos a cenar en casa o vamos a ir a un restaurante.
          - Bihar goizean ogia erosiko dut. = Mañana por la mañana compraré pan. | Mañana por la mañana voy a comprar pan.
          - Zer egingo duzu bihar? | Bihar zer egingo duzu? = ¿Qué harás mañana? | ¿Qué vas a hacer mañana? | ¿Qué hará usted mañana? | ¿Qué va a hacer usted mañana?
          - Datorren urtean euskara ikasiko dut. = El año que viene aprenderé euskera. | El año que viene estudiaré euskera. | El próximo año aprenderé euskera. | El año que viene voy a aprender euskera.
