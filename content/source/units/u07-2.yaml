          - Zer edango duzu? = ¿Qué vas a beber? | ¿Qué beberás? | ¿Qué va a beber usted? | ¿Qué vas a tomar?
          - Nik afaria prestatuko dut. = Yo prepararé la cena. | Prepararé la cena. | Yo voy a preparar la cena.
          - Jonek ardoa eramango du. = Jon llevará el vino. | Jon va a llevar el vino.
          - Gaur ez dut asko jango. Zortzietan bukatuko dut. = Hoy no comeré mucho. Terminaré a las ocho. | Hoy no voy a comer mucho. Voy a terminar a las ocho.

          - Bihar etxean geratuko naiz. = Mañana me quedaré en casa. | Mañana voy a quedarme en casa. | Mañana me voy a quedar en casa.
          - Bederatzietan itzuliko gara. = Volveremos a las nueve. | Vamos a volver a las nueve.
          - Gaur hamar orduz lo egingo dut. = Hoy dormiré diez horas. | Hoy voy a dormir diez horas.
        pairs:
