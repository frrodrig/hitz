# Unit 7.2 · Zer egingo duzu? — future aspect -KO/-GO, -T(Z)EN ARI IZAN, present of the synthetic
# verbs JOAN, ETORRI, IBILI (and EGON, EDUKI), word order in questions and answers, months.
id: u07-2
section: s3
bookUnit: 7
title:
  es: ¿Qué harás?
  eu: Zer egingo duzu?
goals:
  - es: Contar tus planes y preguntar por los de otra persona.
    eu: Zure asmoak kontatu eta besteenak galdetu.
  - es: Decir qué está haciendo alguien en este momento.
    eu: Norbait une honetan zer egiten ari den esan.
  - es: Decir adónde vas y de dónde vienes, y situar los planes en los meses del año.
    eu: Nora zoazen eta nondik zatozen esan, eta asmoak urteko hilabeteetan kokatu.
guidebook:
  sections:
    - title:
        es: "El futuro: joango naiz, egingo dut"
        eu: "Geroa: joango naiz, egingo dut"
      body:
        es: Para el futuro, el participio lleva -go si acaba en -n (joan → joango, egin → egingo, jan → jango) y -ko en los demás casos (etorri → etorriko, erosi → erosiko). El auxiliar es el mismo que en el pasado (naiz, dut…).
        eu: Geroa adierazteko, partizipioak -go hartzen du -n letraz bukatzen bada (joan → joango, egin → egingo, jan → jango) eta -ko gainerakoetan (etorri → etorriko, erosi → erosiko). Laguntzailea lehen bezalakoa da (naiz, dut…).
      examples:
        - eu: Bihar Bilbora joango naiz.
          es: Mañana iré a Bilbao.
        - eu: Datorren astean Ane etorriko da.
          es: La semana que viene vendrá Ane.
        - eu: Etzi zer egingo duzu?
          es: ¿Qué harás pasado mañana?
    - title:
        es: Preguntar y responder
        eu: Galdetu eta erantzun
      body:
        es: La palabra interrogativa va justo delante del verbo (Nora joango zara?). En la respuesta, lo nuevo va delante del verbo (Gasteizera joango naiz). En negativa, «ez» y el auxiliar pasan delante y el participio va al final.
        eu: Galdetzailea aditzaren aurretik doa (Nora joango zara?). Erantzunean, informazio berria aditzaren aurretik doa (Gasteizera joango naiz). Ezezkoan, «ez» eta laguntzailea aurretik doaz, eta partizipioa amaieran.
      examples:
        - eu: Bihar etorriko zara? Bai, etorriko naiz.
          es: ¿Vendrás mañana? Sí, vendré.
        - eu: Ez, ez naiz etorriko.
          es: No, no vendré.
        - eu: Ez dut kafea hartuko.
          es: No tomaré café.
    - title:
        es: "Ahora mismo: -tzen ari naiz"
        eu: "Orain bertan: -tzen ari naiz"
      body:
        es: Para decir lo que estás haciendo ahora, el verbo lleva -tzen o -ten y le sigue «ari» + naiz, zara, da… Se usa siempre naiz/zara/da, aunque el verbo tenga objeto. Ya conoces un ejemplo, «Euskara ikasten ari naiz».
        eu: Orain egiten ari zarena esateko, aditzak -tzen edo -ten hartzen du, eta ondoren «ari» + naiz, zara, da… Beti naiz/zara/da erabiltzen da, aditzak objektua izan arren. Adibide bat ezagutzen duzu, «Euskara ikasten ari naiz».
      examples:
        - eu: Zer egiten ari zara?
          es: ¿Qué estás haciendo?
        - eu: Afaria prestatzen ari naiz.
          es: Estoy preparando la cena.
        - eu: Euskara ikasten ari naiz.
          es: Estoy aprendiendo euskera.
    - title:
        es: "Voy, vengo, ando: noa, nator, nabil"
        eu: "Noa, nator, nabil"
      body:
        es: Algunos verbos tienen presente propio, como egon (nago) y eduki (daukat). Joan → noa, zoaz, doa; etorri → nator, zatoz, dator; ibili → nabil, zabiltza, dabil. Los meses llevan -(e)an como los días (abuztuan).
        eu: Aditz batzuek orainaldi propioa dute, egon (nago) eta eduki (daukat) bezala. Joan → noa, zoaz, doa; etorri → nator, zatoz, dator; ibili → nabil, zabiltza, dabil. Hilabeteek -(e)an hartzen dute, egunek bezala (abuztuan).
      examples:
        - eu: Nora zoaz? Apaindegira noa.
          es: ¿Adónde vas? Voy a la peluquería.
        - eu: Nondik zatoz? Etxetik nator.
          es: ¿De dónde vienes? Vengo de casa.
        - eu: Abuztuan Parisera joango gara.
          es: En agosto iremos a París.
levels:
