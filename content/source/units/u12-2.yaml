  - type: story
    title:
      es: "Historia: la excursión"
      eu: "Istorioa: txangoa"
    story:
      title: Txangoa
      lines:
        - Alaitz | Oier, baduzu larunbatean txango bat egiteko gogorik? = Oier, ¿te apetece hacer una excursión el sábado?
        - Oier | Bai! Nora joateko asmoa duzu? = ¡Sí! ¿Adónde piensas ir?
        - Alaitz | Durangoko mendietara. = A los montes de Durango.
        - Oier | Primeran! Txikitan aitarekin Durangora joaten nintzen. = ¡Genial! De pequeño iba a Durango con mi padre.
        - Alaitz | Nola joango gara? Autoz? = ¿Cómo iremos? ¿En coche?
        - Oier | Ez daukat autorik. Trenez joango gara? = No tengo coche. ¿Vamos en tren?
        - Alaitz | Ados. Eta geltokitik mendiraino oinez. = Vale. Y desde la estación hasta el monte, a pie.
        - Oier | Eta euria egiten badu? = ¿Y si llueve?
        - Alaitz | Euria egiten badu, museora joango gara. = Si llueve, iremos al museo.
        - Oier | Ondo. Zortzietan geltokian? = Bien. ¿A las ocho en la estación?
        - Alaitz | Bai, zortzietan. Gero arte! = Sí, a las ocho. ¡Hasta luego!
      questions:
        - afterLine: 1
          prompt: ¿Qué propone Alaitz?
          options:
            - Hacer una excursión el sábado
            - Ir al cine el sábado
            - Ir a casa del padre de Oier
        - afterLine: 5
          prompt: ¿Por qué no irán en coche?
