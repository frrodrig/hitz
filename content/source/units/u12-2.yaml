# Unit 12.2 · Asmoak — leisure plans, wishes, intentions and conditions, past leisure habits;
# -T(Z)EKO GOGOA / ASMOA, BA… -T(Z)EKO GOGORIK?, percentages, -(T)ZEN BA…, nintzen / nuen,
# habitual past (joaten nintzen). Source format: see u01-1.yaml and docs/content-guide.md.
id: u12-2
section: s4
bookUnit: 12
title:
  es: Planes
  eu: Asmoak
goals:
  - es: Proponer planes de tiempo libre y expresar ganas e intenciones.
    eu: Aisialdiko planak proposatu eta gogoak eta asmoak adierazi.
  - es: Expresar condiciones (si…).
    eu: Baldintzak adierazi.
  - es: Contar lo que solías hacer en tu tiempo libre.
    eu: Aisialdian lehen zer egiten zenuen kontatu.
guidebook:
  sections:
    - title:
        es: "Ganas e intención: -t(z)eko gogoa, -t(z)eko asmoa"
        eu: "Gogoa eta asmoa: -t(z)eko gogoa, -t(z)eko asmoa"
      body:
        es: «Gogoa» son las ganas y «asmoa» la intención; el verbo va en -t(z)eko delante (joateko, egiteko) y detrás «dut» o «daukat». Para proponer un plan se pregunta «Baduzu … gogorik?».
        eu: «Gogoa» eta «asmoa» hitzen aurretik aditza -t(z)eko forman doa (joateko, egiteko), eta ondoren «dut» edo «daukat». Plan bat proposatzeko «Baduzu … gogorik?» galdetzen da.
      examples:
        - eu: Mendira joateko gogoa daukat.
          es: Tengo ganas de ir al monte.
        - eu: Bihar txango bat egiteko asmoa dut.
          es: Mañana pienso hacer una excursión.
        - eu: Baduzu zinemara joateko gogorik?
          es: ¿Te apetece ir al cine?
    - title:
        es: "Condiciones: ba-"
        eu: "Baldintzak: ba-"
      body:
        es: «Si» se expresa pegando «ba-» al verbo conjugado (badu, bazaude, bada). La consecuencia suele ir en futuro (joango gara).
        eu: Baldintza adierazteko «ba-» jartzen zaio aditz jokatuari (badu, bazaude, bada). Ondorioa geroaldian joan ohi da.
      examples:
        - eu: Eguraldi ona egiten badu, mendira joango gara.
          es: Si hace buen tiempo, iremos al monte.
        - eu: Libre bazaude, zinemara joango gara.
          es: Si estás libre, iremos al cine.
    - title:
        es: "El pasado: nintzen, nuen"
        eu: "Iragana: nintzen, nuen"
      body:
        es: Pasado de «izan» (nintzen, zinen, zen, ginen…) y de «ukan» (nuen, zenuen, zuen, genuen…). Con el verbo en -t(z)en indica costumbre, como el imperfecto español (iba, jugaba).
        eu: «Izan» (nintzen, zinen, zen, ginen…) eta «ukan» (nuen, zenuen, zuen, genuen…) aditzen iragana. Aditza -t(z)en forman badago, ohitura adierazten du.
      examples:
        - eu: Atzo zinemara joan nintzen.
          es: Ayer fui al cine.
        - eu: Txikitan bizikletaz joaten nintzen eskolara.
          es: De pequeño iba a la escuela en bicicleta.
        - eu: Gaztetan dantza asko egiten nuen.
          es: De joven bailaba mucho.
    - title:
        es: "Porcentajes: ehuneko"
        eu: "Ehunekoak"
      body:
        es: "Los porcentajes se dicen con «ehuneko» delante del número (ehuneko hogei = 20 %). Si el verbo lleva «-k», el número también: «ehuneko berrogeik»."
        eu: Ehunekoak «ehuneko» hitzarekin esaten dira zenbakiaren aurretik. Aditza nork motakoa bada, zenbakiak «-k» hartzen du.
      examples:
        - eu: Gazteen ehuneko berrogeik kirola egiten du.  # TODO(revisión-nativa): verb agreement with ehuneko (du / dute)
          es: El cuarenta por ciento de los jóvenes hace deporte.
        - eu: Ehuneko hamar autoz joaten da lanera.
          es: El diez por ciento va a trabajar en coche.
