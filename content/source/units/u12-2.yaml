          - Hegazkinez joango gara Londresera. = Iremos a Londres en avión. | Vamos a ir a Londres en avión.
          - Etxetik eskolara oinez noa. = Voy andando de casa a la escuela. | Voy a pie de casa a la escuela. | Voy de casa a la escuela a pie.
