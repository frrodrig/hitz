  - type: story
    title:
      es: "Historia: el rumor"
      eu: "Istorioa: zurrumurrua"
    story:
      title: Zurrumurrua
      lines:
        - Itziar | Josu, badakizu zurrumurrua? Maialen haurdun dagoela dirudi! = Josu, ¿sabes el rumor? ¡Parece que Maialen está embarazada!
        - Josu | Benetan? Ez dut sinesten! = ¿De verdad? ¡No me lo creo!
        - Itziar | Bai, bai. Gaur ez du kaferik hartu, eta oso nekatuta dagoela ematen du. = Sí, sí. Hoy no ha tomado café, y parece que está muy cansada.
        - Josu | Ez dut uste haurdun dagoenik. Agian gaixo dago. = No creo que esté embarazada. Quizá está enferma.
        - Itziar | Eta atzo haurtzaindegi bati buruz hitz egiten ari zen! = ¡Y ayer estaba hablando de una guardería!
        - Maialen | Kaixo! Zertaz ari zarete? = ¡Hola! ¿De qué estáis hablando?
        - Josu | Itziarrek uste du haurdun zaudela. = Itziar cree que estás embarazada.
        - Maialen | Ez da egia izango! Ez nago haurdun. Nire ahizpa dago haurdun! = ¡No puede ser! No estoy embarazada. ¡Mi hermana está embarazada!
        - Itziar | A zer ezustea! Eta kafea? = ¡Qué sorpresa! ¿Y el café?
        - Maialen | Kafea hartzeari utzi diot. Osasuna zaintzen saiatzen ari naiz! = He dejado de tomar café. ¡Estoy intentando cuidar mi salud!
        - Josu | Ikusten? Zurrumurruak ez dira beti egia. = ¿Ves? Los rumores no siempre son verdad.
      questions:
        - afterLine: 3
          prompt: ¿Por qué cree Itziar que Maialen está embarazada?
          options:
            - Porque no ha tomado café y parece cansada
            - Porque se lo ha dicho Maialen
            - Porque Josu se lo ha contado
        - afterLine: 8
          prompt: ¿Quién está embarazada de verdad?
          options:
            - La hermana de Maialen
            - Maialen
            - Itziar
        - afterLine: 10
          prompt: ¿Por qué ya no toma café Maialen?
          options:
            - Porque intenta cuidar su salud
            - Porque está embarazada
            - Porque no le gusta
  - type: review
  - type: challenge
    host: mikel
