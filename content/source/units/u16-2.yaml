# Unit 16.2 · Aldaketak — A2.1 book unit 4 (B + C): opinions and guesses about situations; rumours;
# reacting to surprising news; life changes and getting used to them; starting, keeping on and
# trying. DIRUDI / EMATEN DU + -(E)LA / -(E)NIK; fixed exclamations of surprise; GERO ETA …-AGO /
# GEHIAGO / GUTXIAGO; HASI / JARRAITU / SAIATU + -T(Z)EN; stages of life.
# Recall: -(E)LA (10.2) and -(E)NIK (15.1) after uste izan and iruditu; dirudi, ematen du (13.2).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u16-2
section: s6
bookUnit: 16
title:
  es: Cambios
  eu: Aldaketak
goals:
  - es: Dar tu opinión y hacer suposiciones sobre lo que pasa.
    eu: Iritzia eman eta gertatzen denari buruz susmoak adierazi.
  - es: Reaccionar ante noticias sorprendentes.
    eu: Albiste harrigarriei erantzun.
  - es: Contar cambios en tu vida y cómo te acostumbras a ellos.
    eu: Zure bizitzako aldaketak kontatu eta haietara nola ohitzen zaren azaldu.
guidebook:
  sections:
    - title:
        es: "Parece que…: …-(e)la dirudi"
        eu: "…-(e)la dirudi"
      body:
        es: "Para suponer algo, la frase termina en -(e)la y sigue «dirudi» o «ematen du»: «berandu etorriko dela dirudi» (parece que llegará tarde). También delante: «badirudi…», «ematen du…»."
        eu: "Zerbait susmatzeko, esaldiak -(e)la amaiera hartzen du, eta gero «dirudi» edo «ematen du» dator: «berandu etorriko dela dirudi». Aurrean ere bai: «badirudi…», «ematen du…»."
      examples:
        - eu: Berandu etorriko dela dirudi.
          es: Parece que llegará tarde.
        - eu: Ematen du nekatuta zaudela.
          es: Parece que estás cansado.
    - title:
        es: "No parece que…: siempre -(e)nik"
        eu: "Ez dirudi…-(e)nik"
      body:
        es: "Si el verbo principal es negativo («ez dirudi», «ez du ematen», «ez dut uste», «ez zait iruditzen»), la frase termina en -(e)nik, nunca en -(e)la."
        eu: "Aditz nagusia ezezkoa bada («ez dirudi», «ez du ematen», «ez dut uste», «ez zait iruditzen»), esaldiak -(e)nik amaiera hartzen du, inoiz ez -(e)la."
      examples:
        - eu: Ez du ematen gaixo dagoenik.
          es: No parece que esté enfermo.
        - eu: Ez dut uste oker zaudenik.
          es: No creo que estés equivocado.
    - title:
        es: "Cada vez más: gero eta …-ago"
        eu: "Gero eta …-ago"
      body:
        es: "«Gero eta» va con un comparativo: «gero eta handiagoa» (cada vez más grande), «gero eta jende gehiago» (cada vez más gente), «gero eta diru gutxiago» (cada vez menos dinero). Nunca con «oso»."
        eu: "«Gero eta» konparatibo batekin doa: «gero eta handiagoa», «gero eta jende gehiago», «gero eta diru gutxiago». Inoiz ez «oso»rekin."
      examples:
        - eu: Gero eta hobeto hitz egiten duzu euskaraz.
          es: Cada vez hablas mejor en euskera.
        - eu: Gero eta diru gutxiago daukat.
          es: Cada vez tengo menos dinero.
    - title:
        es: "Empezar, seguir, intentar: …-t(z)en hasi"
        eu: "…-t(z)en hasi, jarraitu, saiatu"
      body:
        es: "Con «hasi» (empezar), «jarraitu» (seguir) y «saiatu» (intentar), el otro verbo va en -t(z)en: «kirola egiten hasi naiz». Para dejar de hacer algo: «-t(z)eari utzi»: «erretzeari utzi diot»."
        eu: "«Hasi», «jarraitu» eta «saiatu» aditzekin, beste aditza -t(z)en forman doa: «kirola egiten hasi naiz». Zerbait egiteari uzteko: «-t(z)eari utzi»: «erretzeari utzi diot»."
      examples:
        - eu: Kirola egiten hasi naiz.
          es: He empezado a hacer deporte.
        - eu: Euskara ikasten jarraituko dut.
          es: Seguiré estudiando euskera.
        - eu: Erretzeari utzi diot.
          es: He dejado de fumar.
