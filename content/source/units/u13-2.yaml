# Unit 13.2 · Zer iruditzen zaizu? — A2.1 book unit 1 (B + C): making proposals and giving reasons
# to agree; first impressions of other people's character and hobbies. Potential of NOR-NORK with
# a third-person object (dezakegu, ditzakegu) and NOR (gaitezke); bururatu / pentsatu / proposatu +
# -T(Z)EA; ordinals; dirudi and ematen du; -ZALE. Recall: DAITEKE (9.1), -(E)LAKO, baina.
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u13-2
section: s5
bookUnit: 13
title:
  es: ¿Qué te parece?
  eu: Zer iruditzen zaizu?
goals:
  - es: Hacer propuestas y dar razones para ponerse de acuerdo.
    eu: Proposamenak egin eta arrazoiak eman, besteekin ados jartzeko.
  - es: Decir qué se te ha ocurrido o qué has pensado hacer.
    eu: Zer egitea bururatu zaizun edo pentsatu duzun esan.
  - es: Dar tu primera impresión sobre el carácter y las aficiones de otras personas.
    eu: Besteen izaerari eta zaletasunei buruzko lehen iritzia eman.
guidebook:
  sections:
    - title:
        es: "Lo que podemos hacer: dezakegu, ditzakegu"
        eu: "Egin dezakeguna: dezakegu, ditzakegu"
      body:
        es: Para proponer algo se usa el potencial. Con verbos que llevan «dut» (egin, antolatu, saldu) va «dezaket, dezakezu, dezake, dezakegu…»; si lo que se hace es plural, «ditzaket, ditzakegu…». Con verbos que llevan «naiz» (joan, etorri) va «naiteke, zaitezke, gaitezke…», como el «daiteke» que ya conoces.
        eu: Zerbait proposatzeko ahalera erabiltzen da. «Dut» hartzen duten aditzekin (egin, antolatu, saldu), «dezaket, dezakezu, dezake, dezakegu…»; egiten dena plurala bada, «ditzaket, ditzakegu…». «Naiz» hartzen duten aditzekin (joan, etorri), «naiteke, zaitezke, gaitezke…», ezagutzen duzun «daiteke» bezala.
      examples:
        - eu: Kontzertu bat antola dezakegu.
          es: Podemos organizar un concierto.
        - eu: Kamisetak sal ditzakegu.
          es: Podemos vender camisetas.
        - eu: Trenez joan gaitezke.
          es: Podemos ir en tren.
    - title:
        es: "Lo que se nos ha ocurrido: …-t(z)ea bururatu zaigu"
        eu: "Bururatu zaiguna: …-t(z)ea bururatu zaigu"
      body:
        es: "Con «bururatu» (ocurrirse), «pentsatu» (pensar) y «proposatu» (proponer), lo que se propone va en -t(z)ea. «Bururatu» funciona como «gustatu»: bururatu zait, zaizu, zaigu…"
        eu: "«Bururatu», «pentsatu» eta «proposatu» aditzekin, proposatzen dena -t(z)ea forman doa. «Bururatu» «gustatu» bezala jokatzen da: bururatu zait, zaizu, zaigu…"
      examples:
        - eu: Kontzertu bat antolatzea bururatu zaigu.
          es: Se nos ha ocurrido organizar un concierto.
        - eu: Kamisetak saltzea pentsatu dute.
          es: Han pensado vender camisetas.
        - eu: Mendira joatea proposatu digu.
          es: Nos ha propuesto ir al monte.
    - title:
        es: "Parece: dirudi, ematen du"
        eu: "Dirudi, ematen du"
      body:
        es: «Lasaia dirudi» y «lasaia ematen du» significan lo mismo, «parece tranquilo». Quien parece va con -k (Ainhoak, mutil horrek); si son varios, «dirudite» o «ematen dute». En negativo, «ez dirudi» o «ez du … ematen».
        eu: «Lasaia dirudi» eta «lasaia ematen du» gauza bera dira. Iruditzen zaigun pertsonak -k hartzen du (Anek, mutil horrek); asko badira, «dirudite» edo «ematen dute». Ezezkoan, «ez dirudi» edo «ez du … ematen».
      examples:
        - eu: Anek lasaia dirudi.
          es: Ane parece tranquila.
        - eu: Mutil horiek anaiak dirudite.
          es: Esos chicos parecen hermanos.
        - eu: Mikelek ez du oso serioa ematen.
          es: Mikel no parece muy serio.
    - title:
        es: "Aficionados: -zale"
        eu: "Zaleak: -zale"
      body:
        es: "«-zale» se añade a un nombre para decir que a alguien le gusta mucho, como «-ero» o «aficionado a»: mendizale, futbolzale, irakurzale."
        eu: "«-zale» atzizkia izen bati eransten zaio, norbaiti zerbait asko gustatzen zaiola adierazteko: mendizale, futbolzale, irakurzale."
      examples:
        - eu: Nire aita mendizalea da.
          es: Mi padre es montañero.
        - eu: Irakurzale handia dirudi.
          es: Parece muy aficionado a la lectura.
