  - type: story
    title:
      es: "Historia: un compañero de piso"
      eu: "Istorioa: pisukide bat"
    story:
      title: Pisukide berria
      lines:
        - Alaitz | Markel, hiru iragarki irakurri ditut. Pisukide bat behar dugu. = Markel, he leído tres anuncios. Necesitamos un compañero de piso.
        - Markel | Ondo. Nolakoak dira? = Bien. ¿Cómo son?
        - Alaitz | Lehenengoa Aitor da. Futbolzalea da, eta oso alaia dirudi. = El primero es Aitor. Es aficionado al fútbol y parece muy alegre.
        - Markel | Futbolzalea? Telebista beti piztuta egongo da! = ¿Futbolero? ¡La tele estará siempre encendida!
        - Alaitz | Bigarrena Nahia da. Irakurzalea eta oso ordenatua da. = La segunda es Nahia. Es aficionada a la lectura y muy ordenada.
        - Markel | Ordenatua? Hori ona da! Eta hirugarrena? = ¿Ordenada? ¡Eso está bien! ¿Y el tercero?
        - Alaitz | Hirugarrena Gorka da. Mendizalea da, baina serioa dirudi. = El tercero es Gorka. Es montañero, pero parece serio.
        - Markel | Nik Nahia proposatzen dut, lasaia delako. = Yo propongo a Nahia, porque es tranquila.
        - Alaitz | Ados. Bihar deituko diogu. = De acuerdo. Mañana la llamaremos.
        - Markel | Primeran! = ¡Estupendo!
      questions:
        - afterLine: 3
          prompt: ¿Por qué no le convence Aitor a Markel?
          options:
            - Porque es futbolero y verá mucho la tele
            - Porque es muy serio
            - Porque es muy desordenado
        - afterLine: 7
          prompt: ¿Cómo parece Gorka?
          options:
            - Serio
            - Muy alegre
            - Tímido
        - afterLine: 8
          prompt: ¿A quién propone Markel y por qué?
          options:
            - A Nahia, porque es tranquila
            - A Gorka, porque le gusta el monte
            - A Aitor, porque es alegre
