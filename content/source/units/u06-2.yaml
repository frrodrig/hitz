    story:
      title: Amaren urtebetetzea
      lines:
        - Julen | Izaro, amaren urtebetetzea da! = Izaro, ¡es el cumpleaños de mamá!
        - Izaro | Bai! Opari bat erosi nahi dut. = ¡Sí! Quiero comprar un regalo.
        - Julen | Zer gustatzen zaio amari? = ¿Qué le gusta a mamá?
        - Izaro | Arropa gustatzen zaio. Soineko bat? = Le gusta la ropa. ¿Un vestido?
        - Saltzailea | Kaixo! Norentzat da oparia? = ¡Hola! ¿Para quién es el regalo?
        - Julen | Gure amarentzat. Soineko urdin bat, mesedez. = Para nuestra madre. Un vestido azul, por favor.
        - Saltzailea | Hau oso polita da. Ehun euro. = Este es muy bonito. Cien euros.
        - Izaro | Ehun euro? Garestiegia da! = ¿Cien euros? ¡Es demasiado caro!
        - Saltzailea | Eta jertse gris hau? Hogeita hamar euro. = ¿Y este jersey gris? Treinta euros.
        - Julen | Grisa? Ez. Amari urdina gustatzen zaio. = ¿Gris? No. A mamá le gusta el azul.
        - Saltzailea | Jertse urdina ere daukagu! = ¡También tenemos el jersey azul!
        - Izaro | Ondo! Jertse urdina erosi nahi dugu, amari gustatzen zaiolako. = ¡Bien! Queremos comprar el jersey azul, porque a mamá le gusta.
      questions:
        - afterLine: 3
          prompt: ¿Por qué quieren comprar un regalo?
          options:
            - Es el cumpleaños de su madre
            - Es el cumpleaños de Izaro
            - Es para un amigo
        - afterLine: 7
          prompt: ¿Por qué no compran el vestido?
          options:
            - Es demasiado caro
            - Es demasiado grande
            - No es azul
        - afterLine: 11
          prompt: ¿Qué compran al final?
          options:
            - Un jersey azul
            - Un jersey gris
            - Un vestido azul
