# Unit 6.2 · Opari bat — clothes and colours, -EGI(A), NOLAKOA(K)?, NOLA DAUKAZU?, NORENTZAT,
# -T(Z)EA with gustatu, causal -ELAKO and ZERGATIK?
id: u06-2
section: s2
bookUnit: 6
title:
  es: Un regalo
  eu: Opari bat
goals:
  - es: Hablar de ropa, describirla, opinar sobre ella y decir lo que se necesita.
    eu: Arropaz hitz egin, deskribatu, iritzia eman eta zer behar den esan.
  - es: Elegir y comprar un regalo según los gustos de alguien.
    eu: Norbaiten gustuen arabera opari bat aukeratu eta erosi.
guidebook:
  sections:
    - title:
        es: "¿Cómo es? Nolakoa da?"
        eu: "Nolakoa da?"
      body:
        es: "Para preguntar cómo es algo, «Nolakoa da?»; si son varias cosas, «Nolakoak dira?». El color va detrás del nombre y lleva el artículo: alkandora zuria, galtza beltzak."
        eu: "Zerbait nolakoa den galdetzeko, «Nolakoa da?»; gauza bat baino gehiago badira, «Nolakoak dira?». Kolorea izenaren atzetik doa, eta artikulua darama: alkandora zuria, galtza beltzak."
      examples:
        - eu: Nolakoa da jertsea?
          es: ¿Cómo es el jersey?
        - eu: Jertsea urdina eta handia da.
          es: El jersey es azul y grande.
        - eu: Nolakoak dira zapatak?
          es: ¿Cómo son los zapatos?
    - title:
        es: "Demasiado: -egi"
        eu: "Gehiegi: -egi"
      body:
        es: "Para decir «demasiado», añade -egi al adjetivo, antes del artículo: handi → handiegia, garesti → garestiegia. Cuidado: «kamiseta hori» es «esa camiseta» y «kamiseta horia», «la camiseta amarilla»."
        eu: "«Gehiegi» esateko, -egi adjektiboari, artikuluaren aurretik: handi → handiegia, garesti → garestiegia. Kontuz: «kamiseta hori» eta «kamiseta horia» ez dira gauza bera."
      examples:
        - eu: Beroki hau garestiegia da.
          es: Este abrigo es demasiado caro.
        - eu: Zapata hauek handiegiak dira.
          es: Estos zapatos son demasiado grandes.
    - title:
        es: "¿Para quién? -rentzat"
        eu: "Norentzat?"
      body:
        es: "«Para» se dice con -(r)entzat: amarentzat, Ikerrentzat. Con pronombres: niretzat, zuretzat, harentzat, guretzat. La pregunta es «Norentzat?»."
        eu: "Norentzat den esateko, -(r)entzat: amarentzat, Ikerrentzat. Izenordainekin: niretzat, zuretzat, harentzat, guretzat. Galdera «Norentzat?» da."
      examples:
        - eu: Opari hau zuretzat da.
          es: Este regalo es para ti.
        - eu: Norentzat da beroki hau?
          es: ¿Para quién es este abrigo?
        - eu: Jertse bat erosi nahi dut amarentzat.
          es: Quiero comprar un jersey para mi madre.
    - title:
        es: "¿Por qué? Zergatik? … -elako"
        eu: "Zergatik? … -elako"
      body:
        es: "A «Zergatik?» se responde con el verbo + -lako, al final: merkea delako (porque es barato), politak direlako. Y para decir que te gusta hacer algo, verbo + -t(z)ea + gustatzen zait."
        eu: "«Zergatik?» galderari aditza + -lako erantzuten diogu: merkea delako, politak direlako. Zerbait egitea gustatzen zaigula esateko: aditza + -t(z)ea + gustatzen zait."
      examples:
        - eu: Zergatik nahi duzu gona hau? Merkea delako.
          es: ¿Por qué quieres esta falda? Porque es barata.
        - eu: Arropa erostea gustatzen zait.
          es: Me gusta comprar ropa.
