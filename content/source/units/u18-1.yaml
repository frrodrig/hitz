# Unit 18.1 · Erosle onak — A2.1 book unit 6 (Atarian + A): kinds of shoppers and consumer advice;
# shopping habits with percentages, fractions and frequency. KOMENIGARRIA / GOMENDAGARRIA DA +
# -T(Z)EA and GOMENDATU + -T(Z)EA; fractions (erdia, herena, laurdena, hirutik bat); percentages
# declined with the verb; frequency with -ERO, ZENBATEAN BEHIN? and SEKULA EZ.
# Recall: relative clauses (17.1), now with NORK subjects inside the clause; komeni + -T(Z)EA
# (5.2, 13.1); percentages (12.2); frequency (5.2, 8.2).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u18-1
section: s6
bookUnit: 18
title:
  es: Buenos compradores
  eu: Erosle onak
goals:
  - es: Describir tipos de compradores y dar consejos de consumo.
    eu: Erosle motak deskribatu eta kontsumoari buruzko aholkuak eman.
  - es: Contar hábitos de compra con porcentajes y fracciones.
    eu: Erosteko ohiturak kontatu, ehunekoak eta zatikiak erabiliz.
  - es: Decir con qué frecuencia haces algo.
    eu: Zerbait zenbatean behin egiten duzun esan.
guidebook:
  sections:
    - title:
        es: "Es recomendable…: gomendagarria da …-t(z)ea"
        eu: "Gomendagarria da …-t(z)ea"
      body:
        es: "Para aconsejar en general: «komenigarria da» o «gomendagarria da» con el verbo en -t(z)ea: «komenigarria da prezioak alderatzea». A alguien en concreto: «…-t(z)ea gomendatzen dizut»."
        eu: "Oro har aholkatzeko: «komenigarria da» edo «gomendagarria da», aditza -t(z)ea forman dela: «komenigarria da prezioak alderatzea». Norbaiti zehazki: «…-t(z)ea gomendatzen dizut»."
      examples:
        - eu: Gomendagarria da ordainagiria gordetzea.
          es: Es recomendable guardar el ticket.
        - eu: Barazki ekologikoak erostea gomendatzen dizut.
          es: Te recomiendo comprar verdura ecológica.
    - title:
        es: "La mitad, un tercio, uno de cada tres"
        eu: "Erdia, herena, hirutik bat"
      body:
        es: "Erdia (la mitad), herena (un tercio), laurdena (un cuarto), hirutik bat (uno de cada tres). Si hacen algo con un verbo como «erosi», llevan -k: «erosleen erdiak», «hirutik batek». El verbo va en singular."
        eu: "Erdia, herena, laurdena, hirutik bat. «Erosi» bezalako aditz batekin -k hartzen dute: «erosleen erdiak», «hirutik batek». Aditza singularrean doa."
      examples:
        - eu: Erosleen erdiak merkealdietan erosten du.
          es: La mitad de los compradores compra en rebajas.
        - eu: Hirutik batek sarean erosten du.
          es: Uno de cada tres compra por internet.
    - title:
        es: "Porcentajes: ehuneko hirurogeik"
        eu: "Ehunekoak: ehuneko hirurogeik"
      body:
        es: "% 60 se lee «ehuneko hirurogei». Como cualquier nombre, toma el caso que pide el verbo: «gazteen ehuneko hirurogeik sarean erosten du»."
        eu: "% 60 «ehuneko hirurogei» irakurtzen da. Beste edozein izenek bezala, aditzak eskatzen duen kasua hartzen du: «gazteen ehuneko hirurogeik sarean erosten du»."
      examples:
        - eu: Gazteen ehuneko hirurogeik sarean erosten du.
          es: El 60 % de los jóvenes compra por internet.
    - title:
        es: "Cada viernes, nunca: ostiralero, sekula ez"
        eu: "Ostiralero, sekula ez"
      body:
        es: "-ero significa «cada»: ostiralero (cada viernes), hilero (cada mes). «Sekula ez» e «inoiz ez» (nunca) necesitan el verbo en negativo: «sekula ez dut sarean erosi»."
        eu: "-ero atzizkiak «bakoitz» esan nahi du: ostiralero, hilero. «Sekula ez» eta «inoiz ez» ezezko aditzarekin doaz: «sekula ez dut sarean erosi»."
      examples:
        - eu: Zenbatean behin erosten duzu arropa?
          es: ¿Cada cuánto compras ropa?
        - eu: Sekula ez dut ezer sarean erosi.
          es: Nunca he comprado nada por internet.
