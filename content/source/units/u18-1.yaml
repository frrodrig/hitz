  - type: story
    title:
      es: "Historia: la encuesta"
      eu: "Istorioa: inkesta"
    story:
      title: Inkesta
      lines:
        - Kazetaria | Egun on! Inkesta bat egiten ari gara erosketei buruz. Zenbatean behin erosten duzu arropa? = ¡Buenos días! Estamos haciendo una encuesta sobre las compras. ¿Cada cuánto compra ropa?
        - Edurne | Urtean bitan, merkealdietan bakarrik. Deskontuak maite ditut! = Dos veces al año, solo en rebajas. ¡Me encantan los descuentos!
        - Kazetaria | Eta sarean erosten duzu? = ¿Y compra por internet?
        - Edurne | Sekula ez. Produktuak ikusi nahi izaten ditut erosi baino lehen. = Nunca. Suelo querer ver los productos antes de comprarlos.
        - Peio | Nik, berriz, dena sarean erosten dut. Merkeagoa da, eta denbora gutxiago behar da. = Yo, en cambio, lo compro todo por internet. Es más barato, y hace falta menos tiempo.
        - Kazetaria | Gure datuen arabera, gazteen ehuneko hirurogeik sarean erosten du. = Según nuestros datos, el 60 % de los jóvenes compra por internet.
        - Edurne | Eta zer gomendatzen duzu? = ¿Y qué recomienda usted?
        - Kazetaria | Komenigarria da prezioak alderatzea eta ordainagiria beti gordetzea. = Es conveniente comparar los precios y guardar siempre el ticket.
        - Peio | Ordainagiria? Nik sekula ez dut gordetzen… = ¿El ticket? Yo nunca lo guardo…
        - Edurne | Horregatik izaten dituzu hainbeste arazo! = ¡Por eso tienes tantos problemas!
        - Peio | Bai, egia da… = Sí, es verdad…
      questions:
        - afterLine: 2
          prompt: ¿Cuándo compra ropa Edurne?
          options:
            - Solo en rebajas
            - Cada viernes
            - Todos los meses
        - afterLine: 5
          prompt: ¿Por qué compra Peio por internet?
          options:
            - Porque es más barato y más rápido
            - Porque no le gustan las tiendas
            - Porque tiene descuentos
        - afterLine: 10
          prompt: ¿Qué le pasa a Peio por no guardar el ticket?
          options:
            - Tiene muchos problemas
            - No le dan la factura
            - No puede comprar por internet
