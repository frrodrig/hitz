  - type: story
    title:
      es: "Historia: la foto de carnaval"
      eu: "Istorioa: inauterietako argazkia"
    story:
      title: Inauterietako argazkia
      lines:
        - Nahia | Gorka, begira argazki hau! Iazko inauterietakoa da. = Gorka, ¡mira esta foto! Es del carnaval del año pasado.
        - Gorka | A zer mozorroak! Nor da zaldi mozorroa daukana? = ¡Vaya disfraces! ¿Quién es el que tiene el disfraz de caballo?
        - Nahia | Hori nire anaia da. Eta ondoan dagoen katua ni naiz! = Ese es mi hermano. ¡Y el gato que está a su lado soy yo!
        - Gorka | Eta loreak dituen kapela daukan emakumea? = ¿Y la mujer que tiene el sombrero con flores?
        - Nahia | Nire ama da. Urtero mozorro berdina janzten du. = Es mi madre. Todos los años se pone el mismo disfraz.
        - Gorka | Eta txakurra? Zer egiten ari da? = ¿Y el perro? ¿Qué está haciendo?
        - Nahia | Ogi bat jaten ari da! Txakurrak ere mozorroa zeraman. = ¡Se está comiendo un pan! El perro también llevaba disfraz.
        - Gorka | Aurten zer mozorro daukazu? = ¿Qué disfraz tienes este año?
        - Nahia | Ez dizut esango. Baina gaur mozorro bat dakart zuretzat! = No te lo voy a decir. ¡Pero hoy traigo un disfraz para ti!
        - Gorka | Benetan? Eskerrik asko! = ¿De verdad? ¡Muchas gracias!
      questions:
        - afterLine: 3
          prompt: ¿Quién es el gato de la foto?
          options:
            - Nahia
            - El hermano de Nahia
            - La madre de Nahia
        - afterLine: 5
          prompt: ¿Qué hace la madre de Nahia todos los años?
          options:
            - Se pone el mismo disfraz
            - Hace fotos
            - Se queda en casa
        - afterLine: 9
          prompt: ¿Qué trae hoy Nahia?
          options:
            - Un disfraz para Gorka
            - Un pan para el perro
            - Una foto nueva
