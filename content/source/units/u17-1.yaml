# Unit 17.1 · Nor da nor? — A2.1 book unit 5 (Atarian + A): animals and what they do; what is
# happening right now; who is who in a photo, at the beach or at the carnival. Relative clauses with
# -(E)N when the antecedent is NOR, and without antecedent (-(E)NA, -(E)NAK); synthetic present of
# EKARRI. Recall: -T(Z)EN ARI IZAN (7.2) against synthetic verbs (EGON, JOAN, ETORRI, IBILI, EDUKI).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u17-1
section: s6
bookUnit: 17
title:
  es: ¿Quién es quién?
  eu: Nor da nor?
goals:
  - es: Describir animales y decir qué hacen.
    eu: Animaliak deskribatu eta zer egiten duten esan.
  - es: Decir qué está pasando en un momento dado.
    eu: Une jakin batean zer gertatzen ari den esan.
  - es: Identificar a personas y cosas («la que está de pie», «el que tiene sombrero»).
    eu: Pertsonak eta gauzak identifikatu («zutik dagoena», «kapela daukana»).
guidebook:
  sections:
    - title:
        es: "Ahora mismo: ari naiz… pero noa, nago"
        eu: "Orain: ari naiz… baina noa, nago"
      body:
        es: "Para lo que pasa ahora se usa «-t(z)en ari naiz» (jolasten ari da). Pero los verbos con forma propia (egon, joan, etorri, ibili, eduki, ekarri…) nunca la llevan: «mendira noa», no «joaten ari naiz»."
        eu: "Orain gertatzen dena esateko «-t(z)en ari naiz» erabiltzen da (jolasten ari da). Baina forma trinkoa duten aditzek (egon, joan, etorri, ibili, eduki, ekarri…) ez dute inoiz hartzen: «mendira noa», ez «joaten ari naiz»."
      examples:
        - eu: Txakurra jolasten ari da.
          es: El perro está jugando.
        - eu: Mendira noa.
          es: Voy al monte.
    - title:
        es: "La que está de pie: zutik dagoen emakumea"
        eu: "Zutik dagoen emakumea"
      body:
        es: "En euskera la frase de relativo va delante del nombre, y el verbo termina en -(e)n: «zutik dago» → «zutik dagoen emakumea» (la mujer que está de pie). El artículo y el caso van al final: «emakumea», «emakumeak»."
        eu: "Euskaraz erlatibozko esaldia izenaren aurrean doa, eta aditzak -(e)n amaiera hartzen du: «zutik dago» → «zutik dagoen emakumea». Artikulua eta kasua amaieran doaz: «emakumea», «emakumeak»."
      examples:
        - eu: Zutik dagoen gizona irakaslea da.
          es: El hombre que está de pie es el profesor.
        - eu: Kapela gorria daukan neska Ane da.
          es: La chica que tiene el sombrero rojo es Ane.
    - title:
        es: "El que…, los que…: dagoena, daudenak"
        eu: "Dagoena, daudenak"
      body:
        es: "Sin nombre, el artículo se pone al verbo: «zutik dagoena» (el que está de pie), «hondartzan daudenak» (los que están en la playa), «kapela daukana» (el que tiene sombrero)."
        eu: "Izenik gabe, artikulua aditzari jartzen zaio: «zutik dagoena», «hondartzan daudenak», «kapela daukana»."
      examples:
        - eu: Hondartzan daudenak nire lagunak dira.
          es: Los que están en la playa son mis amigos.
        - eu: Kapela daukana Mikel da.
          es: El que tiene sombrero es Mikel.
    - title:
        es: "Traer: dakart, dakarzu, dakar"
        eu: "Ekarri: dakart, dakarzu, dakar"
      body:
        es: "«Ekarri» (traer) tiene forma propia en presente, como «eraman» (daramat): dakart, dakarzu, dakar, dakargu, dakarzue, dakarte."
        eu: "«Ekarri» aditzak forma trinkoa du orainaldian, «eraman» aditzak bezala (daramat): dakart, dakarzu, dakar, dakargu, dakarzue, dakarte."
      examples:
        - eu: Zer dakarzu?
          es: ¿Qué traes?
        - eu: Txakurrak pilota bat dakar ahoan.
          es: El perro trae una pelota en la boca.
