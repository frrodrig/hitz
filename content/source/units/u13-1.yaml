# Unit 13.1 · Zaletasunak — A2.1 book unit 1 (Atarian + A): introducing oneself at the start of a
# course, how long one has been learning and why, what is hard and what one should do; what we talk
# about with friends, habits and hobbies. ERAMAN (duration), zaila da + -T(Z)EA, komeni zait +
# -T(Z)EA, NORI / ZERI BURUZ; recall of -(E)LAKO, habitual present and gustatu + -T(Z)EA.
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u13-1
section: s5
bookUnit: 13
title:
  es: Aficiones
  eu: Zaletasunak
goals:
  - es: Presentarte en un curso y decir cuánto tiempo llevas aprendiendo y por qué.
    eu: Ikastaro batean zure burua aurkeztu, eta zenbat denbora daramazun ikasten eta zergatik esan.
  - es: Decir qué te resulta difícil y qué te conviene hacer.
    eu: Zer egitea zaila den eta zer egitea komeni zaizun esan.
  - es: Contar de qué hablas con tus amigos, tus costumbres y tus aficiones.
    eu: Lagunekin zeri buruz hitz egiten duzun, zure ohiturak eta zure zaletasunak kontatu.
guidebook:
  sections:
    - title:
        es: "Cuánto tiempo llevas: daramat"
        eu: "Zenbat denbora daramazu: daramat"
      body:
        es: Para decir cuánto tiempo llevas haciendo algo se usa «eraman» (llevar) con el verbo en -t(z)en. Con una cantidad en singular (urte bat, hilabete bat) va «daramat»; con dos o más, «daramatzat».
        eu: Zerbait egiten zenbat denbora daramazun esateko, «eraman» aditza erabiltzen da, eta beste aditza -t(z)en forman. Urte bat edo hilabete bat bada, «daramat»; bi edo gehiago badira, «daramatzat».
      examples:
        - eu: Urte bat daramat euskara ikasten.
          es: Llevo un año aprendiendo euskera.
        - eu: Bi urte daramatzat Bilbon bizitzen.
          es: Llevo dos años viviendo en Bilbao.
        - eu: Zenbat denbora daramazu hemen lanean?
          es: ¿Cuánto tiempo llevas trabajando aquí?
    - title:
        es: "Lo difícil y lo que conviene: zaila da …-t(z)ea"
        eu: "Zaila dena eta komeni dena: zaila da …-t(z)ea"
      body:
        es: Tras «zaila da», «erraza da» o «komeni zait» el verbo termina en -t(z)ea y va siempre en singular. «Komeni» cambia según a quién le conviene, como «gustatu» (zait, zaizu, zaio…). «Zailena» es «lo más difícil».
        eu: «Zaila da», «erraza da» edo «komeni zait» esan ondoren, aditzak -t(z)ea amaiera hartzen du, beti singularrean. «Komeni» norentzat den aldatzen da, «gustatu» bezala (zait, zaizu, zaio…). «Zailena» esaldi baten gauzarik zailena da.
      examples:
        - eu: Niretzat zailena aditzak ikastea da.
          es: Para mí lo más difícil es aprender los verbos.
        - eu: Euskara ulertzea erraza da.
          es: Entender euskera es fácil.
        - eu: Egunero irratia entzutea komeni zaizu.
          es: Te conviene escuchar la radio todos los días.
    - title:
        es: "Sobre qué: Aneri buruz, filmari buruz"
        eu: "Zeri buruz: Aneri buruz, filmari buruz"
      body:
        es: «Sobre» o «de» un tema se dice con el caso «nori» más «buruz». Con nombres propios, -(r)i buruz (Aneri buruz); con nombres comunes, -ari buruz en singular y -ei buruz en plural. Para preguntar, «zeri buruz?» o «nori buruz?».
        eu: Gai bati buruz hitz egiteko, hitzak nori kasua hartzen du, eta gero «buruz». Izen berezietan -(r)i buruz (Aneri buruz); izen arruntetan -ari buruz singularrean eta -ei buruz pluralean. Galdetzeko, «zeri buruz?» edo «nori buruz?».
      examples:
        - eu: Zeri buruz hitz egin duzue?
          es: ¿De qué habéis hablado?
        - eu: Lanari buruz hitz egin dugu.
          es: Hemos hablado del trabajo.
        - eu: Liburu hau euskarari buruz da.
          es: Este libro es sobre el euskera.
    - title:
        es: "Por qué: -(e)lako, eta"
        eu: "Zergatik: -(e)lako, eta"
      body:
        es: Repaso. A «zergatik?» se responde con el verbo en -(e)lako (nahi dudalako, delako). También se puede añadir la razón detrás, con «eta» al final.
        eu: Errepasoa. «Zergatik?» galderari aditza -(e)lako forman erantzuten zaio (nahi dudalako, delako). Arrazoia atzean ere jar daiteke, «eta» amaieran duela.
      examples:
        - eu: Euskara ikasten ari naiz, bilobekin hitz egin nahi dudalako.
          es: Estoy aprendiendo euskera porque quiero hablar con mis nietos.
        - eu: Euskara ikasten ari naiz, bezeroekin hitz egin nahi dut eta.
          es: Estoy aprendiendo euskera, pues quiero hablar con los clientes.
