  - type: story
    title:
      es: "Historia: el primer día del curso"
      eu: "Istorioa: ikastaroaren lehen eguna"
    story:
      title: Ikastaroaren lehen eguna
      lines:
        - Irakaslea | Kaixo guztioi! Nor zarete? = ¡Hola a todos! ¿Quiénes sois?
        - Patxi | Ni Patxi naiz. Erretiratua naiz, eta urte bat daramat euskara ikasten. = Yo soy Patxi. Estoy jubilado y llevo un año aprendiendo euskera.
        - Irakaslea | Eta zergatik ari zara euskara ikasten, Patxi? = ¿Y por qué estás aprendiendo euskera, Patxi?
        - Patxi | Bilobekin euskaraz hitz egin nahi dudalako. = Porque quiero hablar en euskera con mis nietos.
        - Edurne | Ni Edurne naiz, kazetaria. Bi ikasturte daramatzat hemen. = Yo soy Edurne, periodista. Llevo dos cursos aquí.
        - Irakaslea | Zer da zailena zuretzat, Edurne? = ¿Qué es lo más difícil para ti, Edurne?
        - Edurne | Niretzat zailena jendea ulertzea da. Oso azkar hitz egiten dute! = Para mí lo más difícil es entender a la gente. ¡Hablan muy deprisa!
        - Irakaslea | Egunero irratia entzutea komeni zaizu, orduan. = Entonces te conviene escuchar la radio todos los días.
        - Edurne | Ados. Eta zer gustatzen zaizu zuri egitea jaiegunetan? = De acuerdo. ¿Y a ti qué te gusta hacer los días de fiesta?
        - Irakaslea | Niri? Mendian ibiltzea eta lagunekin afaltzea. = ¿A mí? Andar por el monte y cenar con los amigos.
      questions:
        - afterLine: 3
          prompt: ¿Por qué aprende euskera Patxi?
