# Unit 8.1 · Buruko mina — parts of the body, NONGO MINA (buruko mina daukat), symptoms,
# NONGO with common and proper nouns (Bilboko ospitalea) and ZER ORDUTAN? (hiruretan).
id: u08-1
section: s3
bookUnit: 8
title:
  es: Dolor de cabeza
  eu: Buruko mina
goals:
  - es: Decir qué te duele y describir síntomas.
    eu: Non duzun mina esan eta sintomak azaldu.
  - es: Pedir cita en el centro de salud y quedar a una hora.
    eu: Osasun-etxean hitzordua hartu eta ordu bat adostu.
guidebook:
  sections:
    - title:
        es: "¿Qué te duele? Buruko mina"
        eu: "Non duzu mina? Buruko mina"
      body:
        es: Para decir qué te duele, la parte del cuerpo lleva -ko (-eko tras consonante) y luego «mina» + daukat o dut, como «tengo dolor de…». Para preguntar se dice «Non daukazu mina?».
        eu: Non duzun mina esateko, gorputz-atalak -ko hartzen du (-eko kontsonante ondoren) eta gero «mina» + daukat edo dut. Galdetzeko, «Non daukazu mina?».
      examples:
        - eu: Buruko mina daukat.
          es: Me duele la cabeza.
        - eu: Non daukazu mina? Hankan.
          es: ¿Dónde te duele? En la pierna.
        - eu: Ez daukat sabeleko minik.
          es: No me duele la tripa.
    - title:
        es: Tener fiebre, estar cansado
        eu: Sukarra izan, nekatuta egon
      body:
        es: «Sukarra», «eztula» y «hotzeria» van con daukat o dut (tener). «Gaixo» y «nekatuta» van con nago, zaude, dago (estar). En negativa, el nombre lleva -rik (ez daukat sukarrik).
        eu: «Sukarra», «eztula» eta «hotzeria» daukat edo dut aditzarekin doaz. «Gaixo» eta «nekatuta» nago, zaude, dago aditzarekin. Ezezkoan, izenak -rik hartzen du (ez daukat sukarrik).
      examples:
        - eu: Sukarra eta eztula dauzkat.
          es: Tengo fiebre y tos.
        - eu: Oso nekatuta nago.
          es: Estoy muy cansado.
    - title:
        es: "De un lugar: Bilboko ospitalea"
        eu: "Leku batekoa: Bilboko ospitalea"
      body:
        es: La misma terminación -ko sirve para decir «de» un lugar, como en Bilboko ospitalea (el hospital de Bilbao), herriko farmazia (la farmacia del pueblo). Va delante del nombre.
        eu: -ko atzizki berak leku bateko zerbait adierazten du (Bilboko ospitalea, herriko farmazia). Izenaren aurretik doa.
      examples:
        - eu: Bilboko ospitalea handia da.
          es: El hospital de Bilbao es grande.
        - eu: Herriko osasun-etxea plazan dago.
          es: El centro de salud del pueblo está en la plaza.
    - title:
        es: "¿A qué hora? Zer ordutan?"
        eu: "Zer ordutan?"
      body:
        es: Para decir a qué hora pasa algo, el número lleva -(r)etan (hiruretan, bostetan); «a la una» es «ordu batean». Se puede añadir goizeko, arratsaldeko o gaueko delante. Para pedir cita en el centro de salud (osasun-etxea) se dice «Hitzordua hartu nahi dut».
        eu: Zerbait zer ordutan gertatzen den esateko, zenbakiak -(r)etan hartzen du (hiruretan, bostetan); «ordu batean» esaten da. Aurretik goizeko, arratsaldeko edo gaueko jar daiteke. Osasun-etxean «Hitzordua hartu nahi dut» esaten da.
      examples:
        - eu: Zer ordutan? Hiruretan.
          es: ¿A qué hora? A las tres.
        - eu: Goizeko hamarretan etorriko naiz.
          es: Vendré a las diez de la mañana.
        - eu: Osasun-etxean hitzordua daukat, hiruretan.
          es: Tengo cita en el centro de salud a las tres.
