              - hartzen
      - structures: [nongo, symptoms]
        sentences:
          - Barkatu, non dago Getxoko osasun-etxea? = Perdona, ¿dónde está el centro de salud de Getxo? | Perdone, ¿dónde está el centro de salud de Getxo?
          - Herriko farmazia urrun dago? = ¿La farmacia del pueblo está lejos? | ¿Está lejos la farmacia del pueblo?
          - Ez, gertu dago, elizaren ondoan. = No, está cerca, al lado de la iglesia.
