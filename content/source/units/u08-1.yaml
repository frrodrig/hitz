          - Zure izena, mesedez? = ¿Su nombre, por favor? | ¿Tu nombre, por favor?
          - Bihar, goizeko bederatzietan, ondo? = Mañana, a las nueve de la mañana, ¿bien? | Mañana, a las nueve de la mañana, ¿le va bien? | Mañana, a las nueve de la mañana, ¿te va bien?
          - Ez, goizean lan egiten dut. = No, por la mañana trabajo.
          - Arratsaldeko hiru eta erdietan? = ¿A las tres y media de la tarde?
          - Bai, oso ondo. Eskerrik asko! = Sí, muy bien. ¡Muchas gracias! | Sí, muy bien. ¡Gracias!
        chats:
          - messages:
