  - type: lesson
    title:
      es: En la consulta
      eu: Medikuarekin
    lessons:
      - structures: [nongo-mina, symptoms]
        sentences:
          - Egun on. Zer daukazu? = Buenos días. ¿Qué le pasa? | Buenos días. ¿Qué tienes? | Buenos días. ¿Qué te pasa?
          - Buruko mina eta sukarra dauzkat. = Me duele la cabeza y tengo fiebre. | Tengo dolor de cabeza y fiebre.
          - Eta eztula? = ¿Y tos?
          - Bai, eta oso nekatuta nago. = Sí, y estoy muy cansado. | Sí, y estoy muy cansada.
          - Hotzeria daukazu. = Tienes un resfriado. | Tiene usted un resfriado. | Estás resfriado.
          - Gaur etxean geratu behar duzu. = Hoy tienes que quedarte en casa. | Hoy debe quedarse en casa. | Hoy te tienes que quedar en casa.
        chats:
          - messages:
              - Medikua | Egun on, Nahia. Zer daukazu?
              - Nahia | Ez nago ondo.
              - Medikua | Non daukazu mina?
            options:
              - Sabelean, hemen.
              - Sabeleko, hemen.
              - Bihar arte.
          - messages:
              - Nahia | Sukarra daukat?
            options:
              - Ez, ez daukazu sukarrik.
              - Ez, ez dut sukarra.
              - Bai, gaixo naiz.
        true_false:
          - passage: Gaur ez dut lan egin. Bizkarreko min handia daukat.
            statement: Hoy ha trabajado.
            answer: false
          - passage: Umeak sukarra dauka. Gaixo dago eta lo egiten ari da.
            statement: El niño está durmiendo.
            answer: true
        meanings:
          - text: Nekatuta zaude?
            options:
