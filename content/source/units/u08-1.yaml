  - type: story
    title:
      es: "Historia: Josu está enfermo"
      eu: "Istorioa: Josu gaixo dago"
    story:
      title: Josu gaixo dago
      lines:
        - Miren | Kaixo, Josu! Zer moduz zaude? = ¡Hola, Josu! ¿Qué tal estás?
        - Josu | Ez oso ondo. Gaixo nago. = No muy bien. Estoy enfermo.
        - Miren | Zer daukazu? = ¿Qué tienes?
        - Josu | Buruko mina eta eztula. Oso nekatuta nago. = Dolor de cabeza y tos. Estoy muy cansado.
        - Miren | Sukarra daukazu? = ¿Tienes fiebre?
        - Josu | Bai, atzo gauean sukarra izan dut. = Sí, anoche tuve fiebre.
        - Miren | Osasun-etxean hitzordua hartu duzu? = ¿Has pedido cita en el centro de salud?
        - Josu | Bai, gaur arratsaldeko lauretan. = Sí, hoy a las cuatro de la tarde.
        - Miren | Ni Durangoko farmaziara noa. Zer behar duzu? = Voy a la farmacia de Durango. ¿Qué necesitas?
        - Josu | Ura eta zukua, mesedez. = Agua y zumo, por favor.
        - Miren | Ondo. Bostetan zure etxera etorriko naiz. Agur! = Bien. A las cinco iré a tu casa. ¡Adiós!
      questions:
        - afterLine: 3
          prompt: ¿Qué le pasa a Josu?
          options:
            - Le duele la cabeza y tiene tos.
            - Le duele la espalda.
            - Le duele un pie.
        - afterLine: 7
          prompt: ¿A qué hora tiene Josu cita en el centro de salud?

          options:
            - A las cuatro
            - A las cinco
            - A las tres
        - afterLine: 10
          prompt: ¿Qué le va a llevar Miren?
          options:
            - Agua y zumo
            - Leche y café
            - Pan y queso
