# Unit 6.1 · Dendan — everyday shopping: verb + NAHI IZAN, shop names with -tegi/-degi, ZENBAT DA?,
# paying (txartelarekin / eskudirutan).
id: u06-1
section: s2
bookUnit: 6
title:
  es: En la tienda
  eu: Dendan
goals:
  - es: Hacer la compra diaria en tiendas y centros comerciales.
    eu: Eguneroko erosketak egin dendetan eta merkataritza-guneetan.
  - es: Pedir un producto, preguntar el precio y pagar.
    eu: Produktu bat eskatu, prezioa galdetu eta ordaindu.
guidebook:
  sections:
    - title:
        es: "Quiero comprar: erosi nahi dut"
        eu: "Erosi nahi dut"
      body:
        es: "Para decir lo que quieres hacer, pon el verbo y después «nahi dut / duzu / du». Con varias cosas, el auxiliar va en plural: erosi nahi ditut."
        eu: "Zer egin nahi duzun esateko: aditza eta gero «nahi dut / duzu / du». Gauza bat baino gehiago badira, laguntzailea pluralean: erosi nahi ditut."
      examples:
        - eu: Ogia erosi nahi dut.
          es: Quiero comprar pan.
        - eu: Zer erosi nahi duzu?
          es: ¿Qué quieres comprar?
        - eu: Anek sagarrak erosi nahi ditu.
          es: Ane quiere comprar manzanas.
    - title:
        es: "Tiendas: -tegi / -degi"
        eu: "Dendak: -tegi / -degi"
      body:
        es: "Muchas tiendas se forman con el producto + -tegi o -degi: haragi → harategi, arrain → arrandegi, y también okindegi. Otras llevan «denda»: frutadenda, liburu-denda."
        eu: "Denda askoren izena produktua + -tegi edo -degi da: haragi → harategi, arrain → arrandegi, eta okindegi ere bai. Beste batzuek «denda» dute: frutadenda, liburu-denda."
      examples:
        - eu: Harategian haragia dago.
          es: En la carnicería hay carne.
        - eu: Arrandegian arraina dago.
          es: En la pescadería hay pescado.
    - title:
        es: "¿Cuánto es? Zenbat da?"
        eu: "Zenbat da?"
      body:
        es: "Para el precio, «Zenbat da?» o «Zenbat balio du?». Con varias cosas, «Zenbat dira?». Después de un número, «euro» no lleva artículo: hiru euro."
        eu: "Prezioa galdetzeko, «Zenbat da?» edo «Zenbat balio du?». Gauza bat baino gehiago badira, «Zenbat dira?». Zenbakiaren ondoren, «euro» artikulurik gabe: hiru euro."
      examples:
        - eu: Zenbat da?
          es: ¿Cuánto es?
        - eu: Hiru euro dira.
          es: Son tres euros.
    - title:
        es: Pagar
        eu: Ordaindu
      body:
        es: "Con tarjeta se dice «txartelarekin» y en efectivo, «eskudirutan». El dependiente suele preguntar: «Txartelarekin ala eskudirutan?»"
        eu: "Txartelarekin edo eskudirutan ordain daiteke. Saltzaileak galdetzen du: «Txartelarekin ala eskudirutan?»"
      examples:
        - eu: Txartelarekin ala eskudirutan?
          es: ¿Con tarjeta o en efectivo?
        - eu: Eskudirutan ordaindu nahi dut.
          es: Quiero pagar en efectivo.
        - eu: Ez daukat eskudirurik, baina txartela daukat.
          es: No tengo efectivo, pero tengo tarjeta.
