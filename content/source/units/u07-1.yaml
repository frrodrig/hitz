    story:
      title: Non dago telefonoa?
      lines:
        - Ane | Kaixo, Iker! Zer moduz? = ¡Hola, Iker! ¿Qué tal?
        - Iker | Ez oso ondo. Telefonoa galdu dut! = No muy bien. ¡He perdido el teléfono!
        - Ane | Nola? Non galdu duzu? = ¿Cómo? ¿Dónde lo has perdido?
        - Iker | Ez dakit! Gaur goizean kafe bat hartu dut tabernan. = ¡No lo sé! Esta mañana he tomado un café en el bar.

        - Iker | Gero liburutegira joan naiz, ikastera. = Después he ido a la biblioteca, a estudiar.
        - Ane | Eta liburutegitik nora joan zara? = ¿Y de la biblioteca adónde has ido?
        - Iker | Jatetxe batera, Mikelekin bazkaltzera. = A un restaurante, a comer con Mikel.
        - Ane | Mikeli deitu diozu? = ¿Has llamado a Mikel?
        - Iker | Ez! Telefonorik ez daukat! = ¡No! ¡No tengo teléfono!
        - Ane | Hemen duzu nire telefonoa. Deitu, mesedez. = Aquí tienes mi teléfono. Llama, por favor.
        - Iker | Mikel? Telefonoa jatetxean dago? Eskerrik asko! = ¿Mikel? ¿El teléfono está en el restaurante? ¡Muchas gracias!
      questions:
        - afterLine: 1
          prompt: ¿Qué le ha pasado a Iker?
          options:
            - Ha perdido el teléfono.
            - Ha perdido la tarjeta.
            - Ha perdido el autobús.
        - afterLine: 6
          prompt: ¿Con quién ha comido Iker?
          options:
            - Con Mikel
            - Con Ane
            - Solo
        - afterLine: 10
          prompt: ¿Dónde está el teléfono?
          options:
            - En el restaurante
            - En la biblioteca
            - En el bar
  - type: review
  - type: legendary
