# Unit 7.1 · Zer egin duzu? — recent past: perfective with NOR (joan naiz) and NOR-NORK (ikusi dut),
# time markers, days of the week, NORA / NONDIK and -T(Z)ERA purpose.
id: u07-1
section: s3
bookUnit: 7
title:
  es: ¿Qué has hecho?
  eu: Zer egin duzu?
goals:
  - es: Contar lo que has hecho hoy y estos días.
    eu: Gaur eta egun hauetan egin duzuna kontatu.
  - es: Preguntar a otra persona qué ha hecho, adónde ha ido y de dónde viene.
    eu: Besteari galdetu zer egin duen, nora joan den eta nondik datorren.
  - es: Situar las acciones en el tiempo con los días de la semana y expresiones como «atzo» o «duela bi aste».
    eu: Ekintzak denboran kokatu asteko egunekin eta «atzo» edo «duela bi aste» bezalako esapideekin.
guidebook:
  sections:
    - title:
        es: "Ir, venir, nacer: joan naiz"
        eu: "Joan, etorri, jaio: joan naiz"
      body:
        es: Para contar lo que ha pasado se usa el participio (joan, etorri, jaio) seguido de naiz, zara, da, gara, zarete o dira cuando el verbo no tiene objeto. El participio va delante del auxiliar.
        eu: Gertatutakoa kontatzeko partizipioa (joan, etorri, jaio) eta naiz, zara, da, gara, zarete edo dira erabiltzen dira, aditzak objekturik ez duenean. Partizipioa laguntzailearen aurretik doa.
      examples:
        - eu: Gaur Bilbora joan naiz.
          es: Hoy he ido a Bilbao.
        - eu: Ane Donostian jaio da.
          es: Ane nació en San Sebastián.
        - eu: Ni ez naiz joan.
          es: Yo no he ido.
    - title:
        es: "Ver, comprar, comer: ikusi dut"
        eu: "Ikusi, erosi, bazkaldu: ikusi dut"
      body:
        es: Los verbos con objeto (ver, comprar, comer, cenar…) usan dut, duzu, du, dugu, duzue o dute. El sujeto lleva -k (nik, zuk, Anek). Con objeto plural se dice ditut.
        eu: Objektua duten aditzek (ikusi, erosi, bazkaldu, afaldu…) dut, duzu, du, dugu, duzue edo dute erabiltzen dute. Subjektuak -k darama (nik, zuk, Anek). Objektua plurala bada, ditut.
      examples:
        - eu: Nik Mikel ikusi dut.
          es: He visto a Mikel.
        - eu: Zuk zer erosi duzu?
          es: ¿Qué has comprado?
        - eu: Liburu asko irakurri ditut.
          es: He leído muchos libros.
    - title:
        es: ¿Cuándo?
        eu: Noiz?
      body:
        es: «Gaur» es hoy, «atzo» ayer, «herenegun» anteayer e «iaz» el año pasado. Los días de la semana y las partes del día llevan -(e)an (astelehenean, goizean) y «duela» va delante de la cantidad (duela bi egun, duela bi aste).
        # TODO(revisión-nativa): en batua escrito, con «atzo», «iaz» o «duela…» se prefiere el pasado (joan nintzen); aquí se usa el perfecto (joan naiz), habitual en la lengua hablada y en A1.
        eu: «Gaur», «atzo», «herenegun» eta «iaz» denbora adierazten dute. Asteko egunek eta eguneko uneek -(e)an hartzen dute (astelehenean, goizean), eta «duela» kopuruaren aurretik doa (duela bi egun, duela bi aste).
      examples:
        - eu: Atzo gauean etxean afaldu dut.
          es: Anoche cené en casa.
        - eu: Duela bi egun Parisera joan naiz.
          es: Hace dos días fui a París.
        - eu: Joan den larunbatean mendira joan gara.
          es: El sábado pasado fuimos al monte.
    - title:
        es: "Adónde, de dónde y a qué: -ra, -tik, -tzera"
        eu: "Nora, nondik eta zertara: -ra, -tik, -tzera"
      body:
        es: «Nora?» pide el destino (Bilbora, etxera) y «Nondik?» el origen (Bilbotik, etxetik). Para decir a qué vas, el verbo lleva -tzera o -tera (erostera, ikustera), y se pregunta con «Zertara?».
        eu: «Nora?» helmuga da (Bilbora, etxera) eta «Nondik?» jatorria (Bilbotik, etxetik). Zertara zoazen esateko, aditzak -tzera edo -tera hartzen du (erostera, ikustera), eta «Zertara?» galdetzen da.
      examples:
        - eu: Nondik etorri zara? Donostiatik.
          es: ¿De dónde has venido? De San Sebastián.
        - eu: Zertara joan zara? Arropa erostera.
          es: ¿A qué has ido? A comprar ropa.
levels:
  - type: lesson
    title:
      es: Ayer y hoy
      eu: Atzo eta gaur
    lessons:
      - structures: [time-markers, nork-perfective]
        sentences:
          - Gaur goizean kafe bat hartu dut. = Esta mañana he tomado un café. | Hoy por la mañana he tomado un café. | Esta mañana tomé un café.
          - Atzo Jonek etxean afaldu du. = Ayer Jon cenó en casa.
          - Gaur jatetxean bazkaldu dugu. = Hoy hemos comido en el restaurante. | Hoy comimos en el restaurante. | Hoy hemos comido en un restaurante.
          - Herenegun lagunekin afaldu dut. = Anteayer cené con mis amigos. | Anteayer cené con amigos. | Anteayer cené con mis amigas.
          - Gaur arratsaldean Mikel ikusi dut. = Esta tarde he visto a Mikel. | Hoy por la tarde he visto a Mikel. | Esta tarde vi a Mikel.
          - Atzo gauean ez dut afaldu, baina gaur asko jan dut. = Anoche no cené, pero hoy he comido mucho. | Ayer por la noche no cené, pero hoy he comido mucho. | Anoche no cené, pero hoy comí mucho.
          - Zer egin duzu gaur? | Gaur zer egin duzu? = ¿Qué has hecho hoy? | ¿Qué ha hecho usted hoy? | ¿Qué hiciste hoy?
          - Gaur goizean liburu bat erosi dut. = Esta mañana he comprado un libro. | Hoy por la mañana he comprado un libro. | Esta mañana compré un libro.
        pairs:
          - - atzo = ayer
            - gaur = hoy
            - herenegun = anteayer
            - gaur goizean = esta mañana
            - atzo gauean = anoche
        meanings:
          - text: Herenegun Mikel ikusi dut.
            options:
              - Anteayer vi a Mikel.
              - Ayer vi a Mikel.
              - Hoy he visto a Mikel.
        blanks:
          - text: Gaur kafe bat hartu ___. = Hoy he tomado un café.
            options:
              - dut
              - naiz
        chats:
          - messages:
              - Leire | Zer egin duzu gaur?
            options:
              - Jatetxean bazkaldu dut.
              - Jatetxean bazkaldu naiz.
              - Bihar arte.
        true_false:
          - passage: Gaur goizean kafe bat hartu dut. Gero liburu bat ere erosi dut.
            statement: Ha comprado un libro.
            answer: true
      - structures: [weekdays, time-markers]
        sentences:
          - Astelehenean Bilbon lan egin dut. = El lunes trabajé en Bilbao. | El lunes he trabajado en Bilbao.
          - Asteartean liburutegian euskara ikasi dut. = El martes estudié euskera en la biblioteca. | El martes he estudiado euskera en la biblioteca.
          - Asteazkenean amari deitu diot. = El miércoles llamé a mi madre. | El miércoles he llamado a mi madre.
          - Ostegunean lagunak ikusi ditut. = El jueves vi a mis amigos. | El jueves he visto a mis amigos. | El jueves vi a mis amigas.
          - Ostiralean Leirerekin afaldu dut. = El viernes cené con Leire. | El viernes he cenado con Leire.
          - Larunbatean telefonoa galdu dut. = El sábado perdí el teléfono. | El sábado he perdido el teléfono. | El sábado perdí el móvil.
          - Igandean etxean liburu bat irakurri dut. = El domingo leí un libro en casa. | El domingo he leído un libro en casa.
          - Joan den astean Donostian bazkaldu dugu. = La semana pasada comimos en San Sebastián. | La semana pasada comimos en Donostia. | La semana pasada hemos comido en San Sebastián.
        pairs:
          - - astelehena = lunes
            - asteartea = martes
            - asteazkena = miércoles
            - osteguna = jueves
            - ostirala = viernes
            - igandea = domingo
        meanings:
          - text: Igandean Gasteizen bazkaldu dut.
            options:
              - El domingo comí en Vitoria.
              - El sábado comí en Vitoria.
              - El domingo cené en Vitoria.
        blanks:
          - text: Joan den ___ lagunak ikusi ditut. = La semana pasada vi a mis amigos.
            options:
              - astean
              - atzo
        chats:
          - messages:
              - Unai | Zer egin duzu larunbatean?
            options:
              - Lagunekin bazkaldu dut.
              - Lagunekin bazkaldu naiz.
              - Larunbata da.
        true_false:
          - passage: Joan den astean Parisen lan egin dut. Ostiralean etxera etorri naiz.
            statement: El viernes volvió a casa.
            answer: true
      - structures: [nor-perfective, time-markers]
        sentences:
          - Ni Gasteizen jaio naiz. = Nací en Vitoria. | Yo nací en Vitoria. | Nací en Gasteiz.
          - Nire alaba iaz jaio da. = Mi hija nació el año pasado.
          - Iaz Frantziara bidaiatu dugu. = El año pasado viajamos a Francia.  # TODO(revisión-nativa): auxiliar de «bidaiatu» (du, NOR-NORK) y régimen con -ra
          - Duela hilabete bat Londresera joan naiz. = Hace un mes fui a Londres.
          - Duela bi egun Mikeli idatzi diot. = Hace dos días le escribí a Mikel. | Hace dos días escribí a Mikel.
          - Barkatu, ez dut entzun. Berriro, mesedez. = Perdona, no lo he oído. Otra vez, por favor. | Perdona, no he oído. Otra vez, por favor. | Perdone, no lo he oído. Otra vez, por favor.
          - Zu non jaio zara? | Non jaio zara zu? = ¿Dónde naciste? | ¿Dónde naciste tú? | ¿Dónde nació usted? | ¿Dónde has nacido?
          - Iaz Itziar eta Unai ezkondu dira. = El año pasado Itziar y Unai se casaron. | Itziar y Unai se casaron el año pasado.
        pairs:
          - - jaio = nacer
            - bidaiatu = viajar
            - liburu = libro
            - entzun = escuchar
            - iaz = el año pasado
            - hilabete = mes
        meanings:
          - text: Duela hiru hilabete Eibarrera joan gara.
            options:
              - Hace tres meses fuimos a Eibar.
              - Hace tres semanas fuimos a Eibar.
              - Dentro de tres meses iremos a Eibar.
        blanks:
          - text: Ni Bilbon jaio ___. = Nací en Bilbao.
            options:
              - naiz
              - dut
          - text: ___ bi aste Parisera joan naiz. = Hace dos semanas fui a París.
            options:
              - Duela
              - Iaz
        chats:
          - messages:
              - Garazi | Non jaio zara?
            options:
              - Donostian jaio naiz.
              - Donostian jaio dut.
              - Donostiara joan naiz.
        true_false:
          - passage: Ni Iruñean jaio naiz. Iaz Gasteizera etorri naiz.
            statement: Nació en Pamplona.
            answer: true
  - type: lesson
    title:
      es: ¿Adónde has ido?
      eu: Nora joan zara?
    lessons:
      - structures: [nor-perfective]
        sentences:
          - Gaur goizean mendira joan naiz. = Esta mañana he ido al monte. | Hoy por la mañana he ido al monte. | Esta mañana fui al monte.
          - Atzo Ane hondartzara joan da. = Ayer Ane fue a la playa.
          - Herenegun Bilbora joan gara. = Anteayer fuimos a Bilbao.
          - Zuek nora joan zarete? | Nora joan zarete zuek? = ¿Adónde habéis ido? | ¿A dónde habéis ido? | ¿Adónde fuisteis? | ¿Adónde han ido ustedes?
          - Gurasoak Gasteizera joan dira. = Mis padres han ido a Vitoria. | Mis padres fueron a Vitoria. | Mis padres han ido a Gasteiz.
          - Ni ez naiz joan, baina Ane joan da. = Yo no he ido, pero Ane sí. | Yo no he ido, pero Ane ha ido. | No he ido, pero Ane sí. | Yo no fui, pero Ane sí.
          - Mikel eta Nerea etxera etorri dira. = Mikel y Nerea han venido a casa. | Mikel y Nerea vinieron a casa.
          - Zu nora joan zara gaur? | Gaur nora joan zara? = ¿Adónde has ido hoy? | ¿A dónde has ido hoy? | ¿Adónde ha ido usted hoy? | ¿Adónde fuiste hoy?
        blanks:
          - text: Gu atzo parkera joan ___. = Ayer fuimos al parque.
            options:
              - gara
              - dugu
          - text: Haiek Bilbora joan ___. = Ellos han ido a Bilbao.
            options:
              - dira
              - dute
        meanings:
          - text: Jon ez da etorri.
            options:
              - Jon no ha venido.
              - Jon no ha ido.
              - Jon ha venido.
        chats:
          - messages:
              - Olatz | Atzo nora joan zara?
            options:
              - Hondartzara joan naiz.
              - Hondartzara joan dut.
              - Hondartzan bazkaldu naiz.
        true_false:
          - passage: Gaur Mikel ez da etorri. Etxean dago.
            statement: Mikel está en casa.
            answer: true
      - structures: [nork-perfective]
        sentences:
          - Nik kafe bat hartu dut. = Yo he tomado un café. | He tomado un café. | Tomé un café.
          - Zuk zer erosi duzu? | Zer erosi duzu zuk? = ¿Qué has comprado? | ¿Qué has comprado tú? | ¿Qué ha comprado usted?
          - Anek liburu bat idatzi du. = Ane ha escrito un libro. | Ane escribió un libro.
          - Guk jatetxean afaldu dugu. = Hemos cenado en el restaurante. | Nosotros hemos cenado en el restaurante. | Cenamos en el restaurante.
          - Haiek txartela galdu dute. = Han perdido la tarjeta. | Ellos han perdido la tarjeta. | Ellas han perdido la tarjeta.
          - Zuek Mikel ikusi duzue? = ¿Habéis visto a Mikel? | ¿Vosotros habéis visto a Mikel? | ¿Visteis a Mikel? | ¿Han visto ustedes a Mikel?
          - Lagunak ikusi ditut. = He visto a mis amigos. | He visto a los amigos. | Vi a mis amigos.
          - Iker eta Iratik ez dute bazkaldu. = Iker e Irati no han comido. | Iker e Irati no comieron.
        blanks:
          - text: Nik ogia erosi ___. = He comprado pan.
            options:
              - dut
              - naiz
          - text: Guk Leire ikusi ___. = Hemos visto a Leire.
            options:
              - dugu
              - gara
        meanings:
          - text: Ez dut telefonoa galdu.
            options:
              - No he perdido el teléfono.
              - He perdido el teléfono.
              - No has perdido el teléfono.
        chats:
          - messages:
              - Josu | Zuk zer hartu duzu?
            options:
              - Nik te bat hartu dut.
              - Nik te bat hartu naiz.
              - Zuk te bat hartu duzu.
        true_false:
          - passage: Gaur Ane eta Mikelek etxean afaldu dute. Gero parkera joan dira.
            statement: Ane y Mikel han cenado en un restaurante.
            answer: false
      - structures: [nora-nondik, tzera-purpose]
        sentences:
          - Nondik etorri zara? = ¿De dónde has venido? | ¿De dónde ha venido usted? | ¿De dónde viniste?
          - Donostiatik etorri naiz. = He venido de San Sebastián. | Vengo de San Sebastián. | He venido de Donostia. | Vine de San Sebastián.
          - Ama ospitaletik etorri da. = Mi madre ha venido del hospital. | Mi madre vino del hospital.
          - Zertara joan zara Bilbora? = ¿A qué has ido a Bilbao? | ¿A qué fuiste a Bilbao? | ¿A qué ha ido usted a Bilbao?
          - Liburu bat erostera joan naiz. = He ido a comprar un libro. | Fui a comprar un libro.
          - Lagunak ikustera joan gara. = Hemos ido a ver a los amigos. | Hemos ido a ver a nuestros amigos. | Fuimos a ver a los amigos.
          - Jatetxera bazkaltzera joan dira. = Han ido a comer al restaurante. | Fueron a comer al restaurante.
          - Liburutegira ikastera joan zara? = ¿Has ido a estudiar a la biblioteca? | ¿Has ido a la biblioteca a estudiar? | ¿Fuiste a estudiar a la biblioteca? | ¿Ha ido usted a estudiar a la biblioteca?
