        sentences:
          - Zer iruditzen zaizu zure auzoa? = ¿Qué te parece tu barrio? | ¿Qué le parece su barrio?
          - Iruditzen zait auzoan zarata asko dagoela. = Me parece que en el barrio hay mucho ruido. | Me parece que hay mucho ruido en el barrio.
          - Nire ustez, herrian bizi-kalitatea hobea da. = En mi opinión, en el pueblo la calidad de vida es mejor. | Creo que en el pueblo la calidad de vida es mejor.
