# Unit 10.2 · Bizitzeko lekua — -ELA completives, negative comparatives (bezain), hobe/onena, gustatu + -T(Z)EA.
id: u10-2
section: s4
bookUnit: 10
title:
  es: Un lugar para vivir
  eu: Bizitzeko lekua
goals:
  - es: Dar tu opinión sobre la calidad de vida de un lugar.
    eu: Leku baten bizi-kalitateari buruzko iritzia eman.
  - es: Decir dónde te gusta pasar las vacaciones.
    eu: Oporrak non pasatzea gustatzen zaizun esan.
guidebook:
  sections:
    - title:
        es: "Creo que…: -ela"
        eu: "Uste dut…: -ela"
      body:
        es: Tras «uste dut» (creo que), «iruditzen zait» (me parece que) o «esan du» (ha dicho que), el verbo de la segunda frase lleva -ela al final (da → dela, dago → dagoela, daude → daudela).
        eu: «Uste dut», «iruditzen zait» edo «esan du» esan ondoren, bigarren esaldiko aditzak -ela hartzen du (da → dela, dago → dagoela, daude → daudela).
      examples:
        - eu: Uste dut herria lasaiagoa dela.
          es: Creo que el pueblo es más tranquilo.
        - eu: Iruditzen zait auzoan trafiko asko dagoela.
          es: Me parece que en el barrio hay mucho tráfico.
        - eu: Anek esan du kanpina oso ona dela.
          es: Ane ha dicho que el camping es muy bueno.
    - title:
        es: "No tan … como: bezain"
        eu: "Ez da … bezain"
      body:
        es: «A ez da B bezain …» significa «A no es tan … como B»; el adjetivo va con artículo. También se puede negar la comparación con «baino», «A ez da B baino …-agoa».
        eu: «A ez da B bezain …» egiturarekin bi gauza konparatzen ditugu. «Baino» egiturarekin ere bai, «A ez da B baino …-agoa».
      examples:
        - eu: Herria ez da hiria bezain zaratatsua.
          es: El pueblo no es tan ruidoso como la ciudad.
        - eu: Trena ez da autobusa baino garestiagoa.
          es: El tren no es más caro que el autobús.
    - title:
        es: "Bueno, mejor, el mejor"
        eu: "On, hobe, onena"
      body:
        es: «On» (bueno) es irregular en el comparativo, «hobea» (mejor), pero el superlativo es regular, «onena» (el mejor). «Txar» (malo) es regular, «txarragoa», «txarrena».
        eu: «On» irregularra da konparatiboan, «hobea», baina superlatiboa erregularra da, «onena». «Txar» erregularra da, «txarragoa», «txarrena».
      examples:
        - eu: Herrian bizi-kalitatea hobea da.
          es: En el pueblo la calidad de vida es mejor.
        - eu: Hau da kanpinik onena.
          es: Este es el mejor camping.
    - title:
        es: "Me gusta / me ha gustado + -tzea"
        eu: "Gustatzen zait / gustatu zait + -tzea"
      body:
        es: Con «gustatu», lo que gusta puede ser un verbo con -tzea (egotea, pasatzea). Para algo que ya ha pasado, como unas vacaciones de este año, se usa «gustatu zait» (me ha gustado).
        eu: «Gustatu» aditzarekin -tzea duen aditza erabil daiteke (egotea, pasatzea). Gertatu den zerbaitentzat, «gustatu zait» erabiltzen da.
      examples:
        - eu: Asko gustatzen zait kanpinean egotea.
          es: Me gusta mucho estar en el camping.
        - eu: Asko gustatu zait Lekeition oporrak pasatzea.  # TODO(revisión-nativa): ¿basta «gustatu zait» (pretérito perfecto) en A1 o hay que enseñar «gustatu zitzaidan»?
          es: Me ha gustado mucho pasar las vacaciones en Lekeitio.
