  - type: story
    title:
      es: "Historia: vacaciones en Zarautz"
      eu: "Istorioa: oporrak Zarautzen"
    story:
      title: Oporrak Zarautzen
      lines:
        - Garazi | Kaixo, Ibai! Non pasatu dituzu oporrak? = ¡Hola, Ibai! ¿Dónde has pasado las vacaciones?
        - Ibai | Zarautzen, kanpin batean. Primeran pasatu dugu! = En Zarautz, en un camping. ¡Lo hemos pasado estupendamente!
        - Garazi | Kanpinean? Ez da hotela bezain erosoa. = ¿En un camping? No es tan cómodo como un hotel.
        - Ibai | Uste dut kanpina hotela baino hobea dela. = Creo que el camping es mejor que el hotel.
        - Ibai | Asko gustatu zait hondartzaren ondoan egotea. = Me ha gustado mucho estar al lado de la playa.
        - Garazi | Eta Zarautz? Zer iruditu zaizu? = ¿Y Zarautz? ¿Qué te ha parecido?
        - Ibai | Herri polita da. Abuztuan turista asko daude. = Es un pueblo bonito. En agosto hay muchos turistas.
        - Ibai | Iruditzen zait trafiko eta zarata asko dagoela. = Me parece que hay mucho tráfico y ruido.
        - "Garazi | Nik oporrak atzerrian pasatu ditut, Londresen. = Yo he pasado las vacaciones en el extranjero, en Londres."
        - Garazi | Londres ez da Zarautz bezain lasaia, baina oso interesgarria da! = ¡Londres no es tan tranquilo como Zarautz, pero es muy interesante!
        - Ibai | Ni ere Londresera joan nahi dut! = ¡Yo también quiero ir a Londres!

      questions:
        - afterLine: 1
          prompt: ¿Dónde ha estado Ibai de vacaciones?
          options:
            - En un camping de Zarautz
            - En un hotel de Zarautz
            - En Londres
        - afterLine: 7
          prompt: ¿Qué problema tiene Zarautz en agosto, según Ibai?
          options:
            - Hay mucho tráfico y ruido
            - Es aburrido
            - No hay playa
        - afterLine: 10
          prompt: ¿Dónde ha pasado Garazi las vacaciones?
          options:
            - En Londres
            - En Zarautz
            - En su pueblo
  - type: review
  - type: legendary
