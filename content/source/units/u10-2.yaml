          - Kalean jende asko dago. = En la calle hay mucha gente. | Hay mucha gente en la calle.
          - Gure auzoa oso lasaia da. = Nuestro barrio es muy tranquilo.
          - Herrian bizi-kalitatea ona da. = En el pueblo la calidad de vida es buena.
          - Gure auzoan jende asko dago, baina zarata gutxi. = En nuestro barrio hay mucha gente, pero poco ruido.
          - Leku hau egokia da umeentzat. = Este lugar es adecuado para los niños.
          - Auzo hau ez da egokia bizitzeko. = Este barrio no es adecuado para vivir.
        pairs:
