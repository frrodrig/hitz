  - type: story
    title:
      es: "Historia: la bolsa de Peio"
      eu: "Istorioa: Peioren poltsa"
    story:
      title: Peioren poltsa
      lines:
        - Amaia | Kaixo, Peio! Zer daukazu poltsan? = ¡Hola, Peio! ¿Qué tienes en la bolsa?
        - "Peio | Hondakinak: botilak, papera eta kartoia. = Residuos: botellas, papel y cartón."
        - Amaia | Eta zakarrontzira zoaz? = ¿Y vas a la papelera?
        - Peio | Bai, kalean dago. = Sí, está en la calle.
        - Amaia | Ez, mesedez! Hori birzikla daiteke. = ¡No, por favor! Eso se puede reciclar.
        - Peio | Bai? Eta non sar daiteke? = ¿Sí? ¿Y dónde se puede echar?
        - Amaia | Papera eta kartoia, edukiontzi urdinean. = El papel y el cartón, en el contenedor azul.
        - Peio | Eta botilak? Beirazkoak dira. = ¿Y las botellas? Son de vidrio.
        - Amaia | Eraman itzazu edukiontzi berdera. Plazan dago. = Llévalas al contenedor verde. Está en la plaza.
        - Peio | Eskerrik asko, Amaia! Orain noa. = ¡Muchas gracias, Amaia! Voy ahora.
      questions:
        - afterLine: 1
          prompt: ¿Qué lleva Peio en la bolsa?
          options:
            - Botellas, papel y cartón
            - Plástico y madera
            - Ropa vieja
        - afterLine: 7
          prompt: ¿De qué son las botellas?
          options:
            - De vidrio
            - De plástico
            - De cartón
        - afterLine: 9
          prompt: ¿Dónde está el contenedor verde?
          options:
            - En la plaza
            - En la calle de Peio
            - Al lado de la escuela
