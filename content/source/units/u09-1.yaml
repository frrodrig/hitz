# Unit 9.1 · Birziklatu — waste, materials (ZEREZKOA?), DAITEKE, imperative and indirect imperative.
id: u09-1
section: s3
bookUnit: 9
title:
  es: Reciclar
  eu: Birziklatu
goals:
  - es: Decir de qué material está hecho un objeto.
    eu: Objektu bat zerezkoa den esan.
  - es: Explicar dónde se puede echar cada tipo de residuo.
    eu: Hondakin bakoitza non bota daitekeen azaldu.
  - es: Dar consejos e instrucciones para cuidar el medio ambiente.
    eu: Ingurumena zaintzeko aholkuak eta aginduak eman.
guidebook:
  sections:
    - title:
        es: ¿De qué es? -(e)zkoa
        eu: Zerezkoa da? -(e)zkoa
      body:
        es: Para decir de qué material es algo, se añade -zkoa (tras vocal) o -ezkoa (tras consonante) al material. Delante de un nombre se usa -(e)zko, sin artículo. La pregunta es «Zerezkoa da?».
        eu: Zerbait zerezkoa den esateko, materialari -zkoa (bokalaren ondoren) edo -ezkoa (kontsonantearen ondoren) gehitzen zaio. Izenaren aurrean -(e)zko erabiltzen da. Galdera «Zerezkoa da?» da.
      examples:
        - eu: Zerezkoa da botila hau?
          es: ¿De qué es esta botella?
        - eu: Beirazkoa da.
          es: Es de vidrio.
        - eu: Paperezko poltsa bat daukat.
          es: Tengo una bolsa de papel.
    - title:
        es: "Se puede: daiteke"
        eu: "Daiteke"
      body:
        es: «Daiteke» significa «se puede» y va detrás de la raíz del verbo (sar daiteke, birzikla daiteke). Con un plural se usa «daitezke». En negativo, «ez daiteke». El papel y el cartón van al contenedor azul, el plástico al amarillo y el vidrio al verde.
        eu: «Daiteke» aditzaren erroaren ondoren doa (sar daiteke, birzikla daiteke). Pluralarekin «daitezke» erabiltzen da. Ezezkoan, «ez daiteke». Papera eta kartoia edukiontzi urdinera doaz, plastikoa horira eta beira berdera.
      examples:
        - eu: Papera edukiontzi urdinean sar daiteke.
          es: El papel se puede echar en el contenedor azul.
        - eu: Botilak birzikla daitezke.  # TODO(revisión-nativa): ¿radical «birzikla» o participio «birziklatu daitezke» para A1?
          es: Las botellas se pueden reciclar.
        - eu: Hemen ez daiteke igeri egin.
          es: Aquí no se puede nadar.
    - title:
        es: "Dar instrucciones: ezazu, itzazu, zaitez"
        eu: "Aginduak: ezazu, itzazu, zaitez"
      body:
        es: El imperativo con «tú» se forma con la raíz del verbo y «ezazu» (un objeto) o «itzazu» (varios objetos). Si el verbo no tiene objeto, como «joan», se usa «zaitez».
        eu: Agintera emateko, aditzaren erroari «ezazu» (objektu bat) edo «itzazu» (objektu asko) gehitzen zaio. Aditzak objekturik ez badu, «joan» bezala, «zaitez» erabiltzen da.
      examples:
        - eu: Sar ezazu papera edukiontzi urdinean.
          es: Echa el papel en el contenedor azul.
        - eu: Eraman itzazu botilak edukiontzira.
          es: Lleva las botellas al contenedor.
        - eu: Joan zaitez basora!
          es: ¡Ve al bosque!
    - title:
        es: "Lo que otros piden: eskatu dit … -tzeko"
        eu: "Besteek eskatzen dutena: eskatu dit … -tzeko"
      body:
        es: Para contar lo que alguien nos ha pedido, se usa «eskatu dit» (me ha pedido) o «eskatu digu» (nos ha pedido) y el verbo con -tzeko o -teko al final.
        eu: Norbaitek eskatu diguna kontatzeko, «eskatu dit» edo «eskatu digu» erabiltzen dugu, eta aditza -tzeko edo -teko amaierarekin.
      examples:
        - eu: Amak eskatu dit botilak birziklatzeko.
          es: Mi madre me ha pedido que recicle las botellas.
        - eu: Irakasleak eskatu digu papera edukiontzi urdinera eramateko.
          es: La profesora nos ha pedido que llevemos el papel al contenedor azul.
