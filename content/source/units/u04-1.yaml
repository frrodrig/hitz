# Unit 4.1 · Etxea — rooms and parts of a home: EDUKI, plural objects with UKAN/EDUKI,
# BEHAR IZAN with nouns, numbers from 100. Source format: see docs/content-guide.md and u01-1.yaml.
id: u04-1
section: s2
bookUnit: 4
title:
  es: La casa
  eu: Etxea
goals:
  - es: Nombrar las habitaciones y las partes de una vivienda.
    eu: Etxebizitza baten gelak eta atalak izendatu.
  - es: Decir qué tiene una casa y cómo es.
    eu: Etxe batek zer daukan eta nolakoa den esan.
  - es: Decir qué necesita una casa.
    eu: Etxe batek zer behar duen esan.
guidebook:
  sections:
    - title:
        es: "Tener: daukat, daukazu, dauka"
        eu: "Eduki: daukat, daukazu, dauka"
      body:
        es: "«Eduki» también significa «tener» y es muy común en la lengua hablada. Como con «ukan», el sujeto lleva -k: nik daukat, zuk daukazu, hark dauka, guk daukagu, zuek daukazue, haiek daukate."
        eu: "Eduki aditzak ere «tener» esan nahi du. Subjektuak -k hartzen du: nik daukat, zuk daukazu, hark dauka, guk daukagu, zuek daukazue, haiek daukate."
      examples:
        - eu: Nik pisu bat daukat Bilbon.
          es: Tengo un piso en Bilbao.
        - eu: Zuk garajea daukazu?
          es: ¿Tienes garaje?
        - eu: Anek terraza handi bat dauka.
          es: Ane tiene una terraza grande.
    - title:
        es: Varias cosas
        eu: Gauza bat baino gehiago
      body:
        es: Si lo que se tiene es plural, el verbo cambia. Con «eduki», dauzkat, dauzkazu, dauzka; con «ukan», ditut, ditu, ditugu, dituzue, dituzte. Detrás de un número el nombre va sin artículo, como en «hiru logela».
        eu: Objektua plurala bada, aditza aldatzen da. Eduki aditzarekin dauzkat, dauzkazu, dauzka; ukan aditzarekin ditut, ditu, ditugu, dituzue, dituzte.
      examples:
        - eu: Etxeak hiru logela dauzka.
          es: La casa tiene tres dormitorios.
        - eu: Pisuak bi bainugela ditu.
          es: El piso tiene dos cuartos de baño.
        - eu: Guk bi garaje ditugu.
          es: Tenemos dos garajes.
    - title:
        es: "Necesitar: behar dut"
        eu: "Behar izan: behar dut"
      body:
        es: Para decir que necesitas algo, «behar» + el verbo «ukan» (dut, duzu, du…). Lo que se necesita va delante, y el sujeto lleva -k.
        eu: Zerbait behar duzula esateko, «behar» + ukan aditza (dut, duzu, du…). Subjektuak -k hartzen du.
      examples:
        - eu: Logela bat behar dut.
          es: Necesito un dormitorio.
        - eu: Zer behar duzu?
          es: ¿Qué necesitas?
        - eu: Mikelek garaje bat behar du.
          es: Mikel necesita un garaje.
    - title:
        es: Cómo es la casa
        eu: Nolakoa da etxea?
      body:
        es: "Los adjetivos van detrás del nombre: etxe berria (la casa nueva), pisu argitsua (el piso luminoso). La planta se dice con «-garren»: hirugarren solairuan (en el tercer piso). Del 100 en adelante se dice «ehun eta…»: ehun eta hogei (120)."
        eu: "Adjektiboa izenaren ondoren doa: etxe berria, pisu argitsua. Solairua «-garren» atzizkiarekin: hirugarren solairuan. 100etik aurrera, «ehun eta…»: ehun eta hogei."
      examples:
        - eu: Egongela oso argitsua da.
          es: La sala de estar es muy luminosa.
        - eu: Hirugarren solairuan bizi naiz.
          es: Vivo en el tercer piso.
        - eu: Etxe honek ehun eta hogei urte ditu.
          es: Esta casa tiene ciento veinte años.
