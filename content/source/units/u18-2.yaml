# Unit 18.2 · Kexa bat — A2.1 book unit 6 (B + C): comparing products and saying how much one likes
# them; complaining about a product or a service, apologising and explaining what happened. Degree
# words with verbs (batere, gutxi, dezente, asko, izugarri); BEZAIN for quality and ADINA for
# quantity; BAIZIK; relative clauses when the antecedent is NORK in the main clause, and negative
# relatives. Recall: BAINO …-AGO, HAIN / HAINBESTE (10.1), ez da … bezain (10.2); fixed phrases of
# anger and apology.
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u18-2
section: s6
bookUnit: 18
title:
  es: Una queja
  eu: Kexa bat
goals:
  - es: Comparar productos y decir cuánto te gustan.
    eu: Produktuak alderatu eta zenbat gustatzen zaizkizun esan.
  - es: Quejarte de un producto o un servicio.
    eu: Produktu edo zerbitzu batez kexatu.
  - es: Pedir perdón y explicar qué ha pasado.
    eu: Barkamena eskatu eta zer gertatu den azaldu.
guidebook:
  sections:
    - title:
        es: "Tan… como, tanto… como: bezain, adina"
        eu: "Bezain, adina"
      body:
        es: "«Bezain» compara cualidades: «hau hori bezain ona da» (este es tan bueno como ese). «Adina» compara cantidades: «hemen ez dago Bilbon adina jende» (aquí no hay tanta gente como en Bilbao). Los dos términos comparados llevan el mismo caso: «herrietan… hirietan»."
        eu: "«Bezain»ek ezaugarriak alderatzen ditu: «hau hori bezain ona da». «Adina»k kopuruak: «hemen ez dago Bilbon adina jende». Alderatzen diren bi osagaiek kasu bera hartzen dute: «herrietan… hirietan»."
      examples:
        - eu: Krema hau hori bezain ona da.
          es: Esta crema es tan buena como esa.
        - eu: Herrietan ez dago hirietan adina jende.
          es: En los pueblos no hay tanta gente como en las ciudades.
    - title:
        es: "Cuánto me gusta: batere, gutxi, dezente, asko, izugarri"
        eu: "Batere, gutxi, dezente, asko, izugarri"
      body:
        es: "De menos a más: «ez zait batere gustatzen» (no me gusta nada), «gutxi», «dezente» (bastante), «asko», «izugarri» (muchísimo). «Batere» siempre con verbo negativo."
        eu: "Gutxienetik gehienera: «ez zait batere gustatzen», «gutxi», «dezente», «asko», «izugarri». «Batere» beti ezezko aditzarekin."
      examples:
        - eu: Xanpu hau izugarri gustatzen zait.
          es: Este champú me gusta muchísimo.
        - eu: Krema hori ez zait batere gustatzen.
          es: Esa crema no me gusta nada.
    - title:
        es: "No… sino…: baizik"
        eu: "Ez…, …baizik"
      body:
        es: "Para corregir: la frase negativa primero y luego lo correcto con «baizik» al final: «ez dut gorria eskatu, urdina baizik» (no he pedido el rojo, sino el azul)."
        eu: "Zuzentzeko: lehenengo ezezko esaldia, eta gero zuzena, «baizik» amaieran dela: «ez dut gorria eskatu, urdina baizik»."
      examples:
        - eu: Ez nago pozik, haserre baizik.
          es: No estoy contento, sino enfadado.
    - title:
        es: "La estantería que he comprado tiene…: erosi dudan apalak"
        eu: "Erosi dudan apalak"
      body:
        es: "Si el nombre con la frase de relativo hace algo en la frase principal, lleva -k al final, como cualquier sujeto de «du»: «erosi dudan apalak akats bat du» (la estantería que he comprado tiene un defecto)."
        eu: "Erlatibozko esaldia duen izenak esaldi nagusian zerbait egiten badu, -k hartzen du amaieran, «du» aditzaren edozein subjektuk bezala: «erosi dudan apalak akats bat du»."
      examples:
        - eu: Erosi dudan apalak akats bat du.
          es: La estantería que he comprado tiene un defecto.
        - eu: Kalitaterik ez duen produktua ez dut erosiko.
          es: No compraré un producto que no tenga calidad.
