  - type: story
    title:
      es: "Historia: la queja"
      eu: "Istorioa: kexa"
    story:
      title: Kexa
      lines:
        - Iker | Egun on. Kexa bat jarri nahi dut. = Buenos días. Quiero poner una queja.
        - Saltzailea | Egun on. Zer gertatu da? = Buenos días. ¿Qué ha pasado?
        - Iker | Larunbatean erosi nuen apalak akats bat du, eta gainera gehiegi ordaindu nuen! = La estantería que compré el sábado tiene un defecto, ¡y además pagué de más!
        - Saltzailea | Sentitzen dut. Ordainagiria daukazu? = Lo siento. ¿Tiene el ticket?
        - Iker | Bai, hemen dago. Kokoteraino nago! = Sí, aquí está. ¡Estoy hasta las narices!
        - Saltzailea | Barkatu. Ez zen hirurogei euro, berrogeita hamar baizik. Hamar euro itzuliko dizkizugu. = Perdone. No eran sesenta euros, sino cincuenta. Le devolveremos diez euros.
        - Iker | Eta apala? = ¿Y la estantería?
        - Saltzailea | Beste bat emango dizugu. Hau hura bezain ona da, eta kolore hau ondo konbinatzen da zure hormarekin. = Le daremos otra. Esta es tan buena como aquella, y este color combina bien con su pared.
        - Iker | Ados. Eskerrik asko. Orain ez nago haserre, pozik baizik! = De acuerdo. Gracias. ¡Ahora no estoy enfadado, sino contento!
      questions:
        - afterLine: 3
          prompt: ¿Por qué se queja Iker?
          options:
            - Por un defecto y porque pagó de más
            - Porque la tienda estaba cerrada
            - Porque no le dieron el ticket
        - afterLine: 6
          prompt: ¿Cuánto dinero le devuelven?
          options:
            - Diez euros
            - Cincuenta euros
            - Sesenta euros
        - afterLine: 8
          prompt: ¿Qué le ofrece el vendedor por la estantería?
          options:
            - Otra estantería igual de buena
            - El dinero de la estantería
            - Un descuento en otra tienda
