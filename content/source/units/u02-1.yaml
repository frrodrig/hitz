              - Han da, plaza hura.
              - Ni udaletxea naiz.
        true_false:
          - passage: Hau Lekeitio da. Herri honetan hondartza bat eta jatetxe asko daude.
            statement: En Lekeitio hay muchos restaurantes.
            answer: true
