          - Zu Bilbon zaude, baina ez zara Bilbokoa. = Estás en Bilbao, pero no eres de Bilbao. | Tú estás en Bilbao, pero no eres de Bilbao. | Usted está en Bilbao, pero no es de Bilbao.
          - Ane gaur Gasteizen dago. = Ane hoy está en Vitoria. | Hoy Ane está en Vitoria. | Ane está hoy en Vitoria.
          - Gu Iruñean gaude. = Estamos en Pamplona. | Nosotros estamos en Pamplona. | Nosotras estamos en Pamplona.
          - Zuek non zaudete? = ¿Dónde estáis? | ¿Vosotros dónde estáis? | ¿Dónde están ustedes?
          - Haiek bi egun Baionan daude. = Están dos días en Bayona. | Ellos están dos días en Bayona. | Ellas están dos días en Bayona.  # TODO(revisión-nativa): ¿«bi egun» o «bi egunez» para la duración?
          - Ni Donostiakoa naiz, eta Bilbon nago. = Soy de San Sebastián y estoy en Bilbao. | Yo soy de San Sebastián y estoy en Bilbao.
          - Zu hotelean zaude? = ¿Estás en el hotel? | ¿Tú estás en el hotel? | ¿Está usted en el hotel?
        blanks:
          - text: Gu Iruñean ___. = Estamos en Pamplona.
            options:
              - gaude
              - gara
              - daude
          - text: Ni Bilbokoa ___, eta Gasteizen nago. = Soy de Bilbao y estoy en Vitoria.
            options:
              - naiz
              - nago
        meanings:
          - text: Zuek non zaudete?
            options:
