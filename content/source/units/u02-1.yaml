  - type: story
    title:
      es: "Historia: ¿dónde está el hotel?"
      eu: "Istorioa: non dago hotela?"
    story:
      title: Non dago hotela?
      lines:
        - Uxue | Barkatu! Euskaraz hitz egiten duzu? = ¡Perdona! ¿Hablas euskera?
        - Ibai | Bai, Lekeitiokoa naiz. Zer moduz? = Sí, soy de Lekeitio. ¿Qué tal?
        - Uxue | Ondo. Euskara ikasten ari naiz. Badago hotelik herrian? = Bien. Estoy aprendiendo euskera. ¿Hay algún hotel en el pueblo?
        - Ibai | Bai, badago. Hotela hondartzan dago. = Sí, hay. El hotel está en la playa.
        - Uxue | Barkatu, berriro, mesedez. Poliki! = Perdona, otra vez, por favor. ¡Despacio!
        - Ibai | Hotela hondartzan dago. Han, hura hotela da. = El hotel está en la playa. Allí, aquel es el hotel.
        - Uxue | Oso ondo! Eta badago farmaziarik? = ¡Muy bien! ¿Y hay alguna farmacia?
        - Ibai | Bai, plazan. Udaletxea eta farmazia plazan daude. = Sí, en la plaza. El ayuntamiento y la farmacia están en la plaza.
        - Uxue | Eta bankurik? = ¿Y algún banco?
        - Ibai | Herri honetan ez dago bankurik, baina Bermeon banku asko daude. = En este pueblo no hay banco, pero en Bermeo hay muchos bancos.
        - Uxue | Eskerrik asko! Gaur hemen nago, eta bihar Bermeon. Agur! = ¡Muchas gracias! Hoy estoy aquí y mañana en Bermeo. ¡Adiós!  # TODO(revisión-nativa): presente con «bihar»
