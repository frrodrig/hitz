# Unit 2.1 · Herrian — places and services in town, NON (inessive), present of EGON,
# BA…-(R)IK? questions, demonstratives in NON (honetan, horretan, hartan), hemen / hor / han.
id: u02-1
section: s1
bookUnit: 2
title:
  es: En el pueblo
  eu: Herrian
goals:
  - es: Nombrar lugares y servicios de un pueblo o una ciudad.
    eu: Herri edo hiri bateko lekuak eta zerbitzuak izendatu.
  - es: Preguntar si hay un lugar y dónde está.
    eu: Leku bat badagoen eta non dagoen galdetu.
guidebook:
  sections:
    - title:
        es: "¿Dónde? El caso NON"
        eu: "Non? NON kasua"
      body:
        es: "Para decir dónde está algo se añade -n, -an o -ean: plaza → plazan, kale → kalean, hotel → hotelean. Con nombres de lugar: Bilbo → Bilbon, Gasteiz → Gasteizen."
        eu: "Zerbait non dagoen esateko -n, -an edo -ean gehitzen da: plaza → plazan, kale → kalean, hotel → hotelean. Leku-izenekin: Bilbo → Bilbon, Gasteiz → Gasteizen."
      examples:
        - eu: Ane plazan dago.
          es: Ane está en la plaza.
        - eu: Ni Bilbon nago.
          es: Estoy en Bilbao.
    - title:
        es: "El verbo egon (estar)"
        eu: "Egon aditza"
      body:
        es: "«Egon» se usa para el lugar: nago, zaude, dago, gaude, zaudete, daude. «Izan» dice quién eres o de dónde eres: «Bilbokoa naiz» (soy de Bilbao), pero «Bilbon nago» (estoy en Bilbao)."
        eu: "Lekua esateko «egon» erabiltzen da: nago, zaude, dago, gaude, zaudete, daude. «Izan» nor edo nongoa zaren esateko da: «Bilbokoa naiz», baina «Bilbon nago»."
      examples:
        - eu: Non zaude? Liburutegian nago.
          es: ¿Dónde estás? Estoy en la biblioteca.
        - eu: Gu hondartzan gaude.
          es: Estamos en la playa.
        - eu: Ni Donostiakoa naiz, eta Bilbon nago.
          es: Soy de San Sebastián y estoy en Bilbao.
    - title:
        es: "¿Hay…? Badago …-rik?"
        eu: "Badago …-rik?"
      body:
        es: "Para preguntar si hay algo: «Badago» + nombre con -rik (o -ik tras consonante). Se responde «Bai, badago» o «Ez, ez dago …-rik». En la frase afirmativa se usa «bat»: «Plazan taberna bat dago»."
        eu: "Zerbait dagoen galdetzeko: «Badago» + izena -rik atzizkiarekin (-ik kontsonantearen ondoren). Erantzuna: «Bai, badago» edo «Ez, ez dago …-rik». Baiezkoan «bat» erabiltzen da: «Plazan taberna bat dago»."
      examples:
        - eu: Badago farmaziarik hemen?
          es: ¿Hay alguna farmacia aquí?
        - eu: Ez, ez dago hotelik.
          es: No, no hay hotel.
        - eu: Plazan taberna bat dago.
          es: En la plaza hay un bar.
    - title:
        es: "Aquí, ahí, allí"
        eu: "Hemen, hor, han"
      body:
        es: "Hemen (aquí), hor (ahí) y han (allí) van con hau (este), hori (ese) y hura (aquel). Con un lugar, el demostrativo toma -n: kale honetan (en esta calle), plaza horretan (en esa plaza), herri hartan (en aquel pueblo)."
        eu: "Hemen, hor eta han hau, hori eta hura erakusleekin doaz. Leku batekin, erakusleak -n hartzen du: kale honetan, plaza horretan, herri hartan."
      examples:
        - eu: Hotela hemen dago.
          es: El hotel está aquí.
        - eu: Kale honetan banku bat dago.
          es: En esta calle hay un banco.
    - title:
        es: "Hoy, mañana, otro, mucho"
        eu: "Gaur, bihar, beste, asko"
      body:
        es: "«Gaur» (hoy) y «bihar» (mañana) suelen ir al principio de la frase. «Asko» (mucho, muchos) va detrás del nombre y sin artículo: taberna asko (muchos bares). «Beste» (otro) va delante: beste kale bat (otra calle), beste egun bat (otro día)."
        eu: "«Gaur» eta «bihar» esaldiaren hasieran joan ohi dira. «Asko» izenaren atzean doa, artikulurik gabe: taberna asko. «Beste» izenaren aurrean doa: beste kale bat, beste egun bat."
      examples:
        - eu: Gaur Bilbon nago, eta bihar Gasteizen.  # TODO(revisión-nativa): presente con «bihar» (el futuro «egongo naiz» llega en 7.2)
          es: Hoy estoy en Bilbao y mañana en Vitoria.
        - eu: Herri honetan taberna asko daude.
          es: En este pueblo hay muchos bares.
        - eu: Bihar beste egun bat da.
          es: Mañana es otro día.
