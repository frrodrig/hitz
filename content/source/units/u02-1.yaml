      - structures: [ba-rik, egon-present]
        sentences:
          - Badago farmaziarik hemen? = ¿Hay alguna farmacia aquí? | ¿Hay farmacia aquí? | ¿Hay una farmacia por aquí?
          - Bai, badago. = Sí, hay. | Sí, sí que hay.
          - Ez, ez dago farmaziarik. = No, no hay farmacia. | No, no hay ninguna farmacia.
          - Badago bankurik herrian? = ¿Hay algún banco en el pueblo? | ¿Hay banco en el pueblo?
          - Plazan taberna bat dago. = En la plaza hay un bar. | Hay un bar en la plaza.
          - Herrian ez dago hotelik. = En el pueblo no hay hotel. | No hay hotel en el pueblo. | En el pueblo no hay ningún hotel.
          - Badago tabernarik edo jatetxerik hemen? = ¿Hay algún bar o restaurante aquí? | ¿Hay bar o restaurante aquí? | ¿Hay algún bar o algún restaurante aquí?
          - Badago beste farmaziarik? = ¿Hay otra farmacia? | ¿Hay alguna otra farmacia?
        blanks:
          - text: Ez, ez ___ hotelik. = No, no hay hotel.
            options:
              - dago
              - da
              - gaude
        meanings:
          - text: Badago bankurik herrian?
            options:
              - ¿Hay algún banco en el pueblo?
              - ¿Dónde está el banco del pueblo?
              - El banco está en el pueblo.
        chats:
          - messages:
              - Ibai | Barkatu, badago farmaziarik hemen?
            options:
              - Bai, plazan farmazia bat dago.
              - Bai, plazan farmaziarik dago.
              - Eskerrik asko.
        true_false:
          - passage: Tolosan ez dago hondartzarik.
            statement: En Tolosa hay playa.
            answer: false
      - structures: [demonstratives, hemen-hor-han]
        sentences:
          - Kale honetan banku bat dago. = En esta calle hay un banco. | Hay un banco en esta calle.
          - Plaza horretan eliza bat dago. = En esa plaza hay una iglesia. | Hay una iglesia en esa plaza.
          - Herri hartan ez dago eskolarik. = En aquel pueblo no hay escuela. | No hay escuela en aquel pueblo. | En aquel pueblo no hay ninguna escuela.
          - Hau liburutegia da, eta hori eskola. = Esta es la biblioteca y esa, la escuela. | Esta es la biblioteca y esa es la escuela.
          - Hura geltokia da? = ¿Aquella es la estación? | ¿Aquello es la estación?
          - Hotel honetan nago. = Estoy en este hotel. | Yo estoy en este hotel.
          - Jatetxe horretan daude. = Están en ese restaurante. | Ellos están en ese restaurante.
          - Farmazia ez dago kale honetan, beste kale batean dago. = La farmacia no está en esta calle, está en otra calle. | La farmacia no está en esta calle, está en otra.
        pairs:
          - - hemen = aquí
            - hor = ahí
            - han = allí
            - honetan = en este
            - horretan = en ese
            - hartan = en aquel
        blanks:
          - text: Kale ___ farmazia bat dago. = En esta calle hay una farmacia.
            options:
