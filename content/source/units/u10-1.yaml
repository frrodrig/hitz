  - type: lesson
    title:
      es: ¿Dónde se vive mejor?
      eu: Hiria ala herria?
    lessons:
      - structures: [comparative-ago, gehiago-gutxiago]
        sentences:
          - Zer nahiago duzu, hiria ala herria? = ¿Qué prefieres, la ciudad o el pueblo? | ¿Qué prefiere usted, la ciudad o el pueblo?
          - Nahiago dut herria, lasaiagoa delako. = Prefiero el pueblo porque es más tranquilo.
          - Hirian zerbitzu eta garraio gehiago daude. = En la ciudad hay más servicios y transporte.
          - Herrian ez dago zinemarik. = En el pueblo no hay cine. | No hay cine en el pueblo.
          - Hiria interesgarriagoa da. = La ciudad es más interesante.
          - Hirian aparkalekuak garestiak dira. = En la ciudad los aparcamientos son caros.
        chats:
          - messages:
              - Uxue | Zer nahiago duzu, hiria ala herria?
              - Asier | Hiria. Hirian zinemak eta antzokiak daude.
              - Uxue | Eta herria?
            options:
              - Herria aspergarriagoa da.
              - Herria autobusa da.
              - Hiria hain txikia naiz.
          - messages:
              - Asier | Herria hiria baino seguruagoa da?
            options:
              - Bai, herria seguruagoa da.
              - Bai, metroan nago.
              - Ez, herrian naiz.
        true_false:
          - passage: Ane Bilbon bizi da. Bilbon metroa, museoak eta antzokiak daude.
            statement: Ane vive en un pueblo pequeño.
            answer: false
          - passage: Jon herri txiki batean bizi da. Herrian ez dago kiroldegirik, eta igerilekua urrun dago.
            statement: En el pueblo de Jon no hay polideportivo.
            answer: true
        meanings:
          - text: Nahiago dut herria, lasaiagoa delako.
            options:
              - Prefiero el pueblo porque es más tranquilo.
              - Prefiero la ciudad porque es más tranquila.
              - El pueblo es menos tranquilo.
      - structures: [hain-hainbeste, superlative]
        sentences:
          - Hiria ez da hain arriskutsua. = La ciudad no es tan peligrosa.
          - Hainbeste autobus eta tren! = ¡Tantos autobuses y trenes!
          - Donostiako hondartzarik politena hau da. = La playa más bonita de San Sebastián es esta. | La playa más bonita de Donostia es esta.
          - Herri hau Gipuzkoako lasaiena da. = Este pueblo es el más tranquilo de Gipuzkoa. | Este pueblo es el más tranquilo de Guipúzcoa.
          - Igerileku hau hain zikina da! = ¡Esta piscina está tan sucia! | ¡Esta piscina es tan sucia!
          - Zein da herririk interesgarriena? = ¿Cuál es el pueblo más interesante?
        chats:
          - messages:
              - Haizea | Bilbon hainbeste museo daude!
              - Julen | Bai. Zein da interesgarriena?
            options:
              - Hau da interesgarriena, nire ustez.
              - Bai, hain zaratatsua.
              - Autobusa hartzen dut.
          - messages:
              - Garazi | Herria hain aspergarria da!
            options:
              - Ez, herrian kiroldegi bat eta igerileku bat daude.
              - Zinema itsusiena naiz.
              - Bai, metroan nago.
        true_false:
          - passage: Bilbo Euskal Herriko hiririk handiena da. Ez da hain arriskutsua.
            statement: Bilbao es una ciudad muy peligrosa.
            answer: false
          - passage: Gure herrian hainbeste aparkaleku daude!
            statement: En el pueblo hay muchos aparcamientos.
            answer: true
        blanks:
          - text: Hiria ez da ___ arriskutsua. = La ciudad no es tan peligrosa.
            options:
              - hain
              - hainbeste
      - structures: [comparative-ago, nolakoa]
        sentences:
