          - Hirian zinemak eta antzokiak daude. = En la ciudad hay cines y teatros. | Hay cines y teatros en la ciudad.
          - Herria lasaia da, eta hiria zaratatsua. = El pueblo es tranquilo, y la ciudad, ruidosa.
          - Trena autobusa baino seguruagoa da. = El tren es más seguro que el autobús.
          - Kiroldegia eskolaren ondoan dago. = El polideportivo está al lado de la escuela.
          - Herriko igerilekua oso erosoa da. = La piscina del pueblo es muy cómoda.
        chats:
          - messages:
              - Peio | Kaixo, Miren! Nolakoa da zure herria?
              - Miren | Txikia eta lasaia.
              - Peio | Eta zerbitzuak?
            options:
              - Gutxi daude, hirian gehiago daude.
              - Autobusa geltokian dago.
              - Hiria baino lasaiagoa naiz.
          - messages:
              - Miren | Eta zu? Hirian bizi zara?
            options:
              - Bai, Bilbon bizi naiz.
              - Bai, metroa hain polita.
              - Ez, kiroldegian.
        true_false:
