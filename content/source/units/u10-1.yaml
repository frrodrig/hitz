            answer: true
        meanings:
          - text: Trena autobusa baino seguruagoa da.
            options:
              - El tren es más seguro que el autobús.
              - El autobús es más seguro que el tren.
              - El tren es tan seguro como el autobús.
  - type: story
    title:
      es: "Historia: ¿ciudad o pueblo?"
      eu: "Istorioa: hiria ala herria?"
    story:
      title: Hiria ala herria?
      lines:
        - Irati | Gorka, zergatik bizi zara herri txiki batean? = Gorka, ¿por qué vives en un pueblo pequeño?
        - Gorka | Herria hiria baino lasaiagoa delako. = Porque el pueblo es más tranquilo que la ciudad.
        - Irati | Hiria interesgarriagoa da! Zinemak, museoak, antzokiak… = ¡La ciudad es más interesante! Cines, museos, teatros…
        - Gorka | Gure herrian zinema bat dago, eta kiroldegi bat. = En nuestro pueblo hay un cine y un polideportivo.
        - Irati | Eta garraioa? Hirian autobus eta tren gehiago daude. = ¿Y el transporte? En la ciudad hay más autobuses y trenes.
        - Gorka | Bai, herrian garraio gutxiago dago. = Sí, en el pueblo hay menos transporte.
        - Gorka | Herria seguruagoa eta garbiagoa da. = El pueblo es más seguro y más limpio.
        - Irati | Hiria ez da hain arriskutsua! = ¡La ciudad no es tan peligrosa!
        - Gorka | Nire herria Gipuzkoako herririk politena da. = Mi pueblo es el pueblo más bonito de Gipuzkoa.
        - Gorka | Zatoz bihar, eta ikusiko duzu! = ¡Ven mañana y lo verás!
        - Irati | Ados, bihar arte! = ¡De acuerdo, hasta mañana!
      questions:
        - afterLine: 1
          prompt: ¿Por qué vive Gorka en un pueblo?
          options:
            - Porque es más tranquilo
            - Porque es más barato
            - Porque hay metro
        - afterLine: 5
          prompt: ¿Dónde hay más transporte?
          options:
            - En la ciudad
            - En el pueblo
            - Igual en los dos sitios
        - afterLine: 10
          prompt: ¿Qué hará Irati mañana?
          options:
            - Ir al pueblo de Gorka
            - Ir al cine en la ciudad
            - Coger el metro
