# Unit 10.1 · Hiria ala herria? — comparatives (baino …-ago), gehiago/gutxiago, hain/hainbeste, superlative.
id: u10-1
section: s4
bookUnit: 10
title:
  es: ¿Ciudad o pueblo?
  eu: Hiria ala herria?
goals:
  - es: Describir una ciudad o un pueblo y sus servicios.
    eu: Hiri edo herri bat eta bere zerbitzuak deskribatu.
  - es: Comparar la vida en la ciudad y en el pueblo.
    eu: Hirian eta herrian bizitzea konparatu.
  - es: Hablar de las ventajas y desventajas de cada lugar.
    eu: Leku bakoitzaren alde onak eta txarrak aipatu.
guidebook:
  sections:
    - title:
        es: "Comparar: A B baino …-agoa"
        eu: "Konparatu: A B baino …-agoa"
      body:
        es: Para decir «A es más … que B», se dice «A B baino» + adjetivo con -ago y el artículo -a. El segundo término va antes de «baino». Ojo, «on» (bueno) es irregular, «hobea» (mejor).
        eu: «A B baino …-agoa da» egitura erabiltzen da. Bigarren elementua «baino» hitzaren aurretik doa. Kontuz, «on» irregularra da, «hobea».
      examples:
        - eu: Bilbo Tolosa baino handiagoa da.
          es: Bilbao es más grande que Tolosa.
        - eu: Herria hiria baino lasaiagoa da.
          es: El pueblo es más tranquilo que la ciudad.
    - title:
        es: Más y menos cosas
        eu: Gehiago eta gutxiago
      body:
        es: Con nombres se usa «gehiago» (más) o «gutxiago» (menos) detrás del nombre. Para comparar lugares, el segundo va con -n y «baino» (herrian baino).
        eu: Izenekin «gehiago» edo «gutxiago» erabiltzen da, izenaren atzean. Lekuak konparatzeko, bigarrena -n eta «baino» hitzarekin doa (herrian baino).
      examples:
        - eu: Hirian zerbitzu gehiago daude.
          es: En la ciudad hay más servicios.
        - eu: Bilbon herrian baino museo gehiago daude.
          es: En Bilbao hay más museos que en el pueblo.
    - title:
        es: "Tan, tanto: hain, hainbeste"
        eu: "Hain, hainbeste"
      body:
        es: «Hain» va delante de un adjetivo (hain handia, tan grande). «Hainbeste» va delante de un nombre (hainbeste autobus, tantos autobuses).
        eu: «Hain» adjektiboaren aurrean doa (hain handia). «Hainbeste» izenaren aurrean doa (hainbeste autobus).
      examples:
        - eu: Herria ez da hain zaratatsua.
          es: El pueblo no es tan ruidoso.
        - eu: Hirian hainbeste autobus daude!
          es: ¡En la ciudad hay tantos autobuses!
    - title:
        es: "El más …: superlativo"
        eu: "Superlatiboa"
      body:
        es: «El más …» se forma con -ena (lasaiena, el más tranquilo). Delante puede ir el nombre con -rik (herririk lasaiena) y el lugar con -ko (Euskal Herriko).
        eu: Superlatiboa -ena atzizkiarekin egiten da (lasaiena). Aurrean izena -rik atzizkiarekin joan daiteke (herririk lasaiena), eta lekua -ko atzizkiarekin.
      examples:
        - eu: Bilbo da Euskal Herriko hiririk handiena.
          es: Bilbao es la ciudad más grande del País Vasco.
        - eu: Museo hau da interesgarriena.
          es: Este museo es el más interesante.
