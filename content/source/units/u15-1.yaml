# Unit 15.1 · Zertan ari zara? — A2.1 book unit 3 (Atarian + A): what one usually does at work and
# what one has been doing today; passing on what others asked, ordered or told us; recent news.
# Habitual ARI (-t(z)en aritzen naiz) and perfective ARI (-t(z)en aritu naiz); imperatives
# (etorri!, etor zaitezte!; zatozte! for recognition); -(E)NIK after a negative main verb; the
# preterite against the present perfect. Recall: -T(Z)EN ARI IZAN (7.2), -T(Z)EKO (9.1),
# duela (7.1), -(E)LA (10.2).
# Source format: see u01-1.yaml and docs/content-guide.md.
id: u15-1
section: s5
bookUnit: 15
title:
  es: ¿Qué estás haciendo?
  eu: Zertan ari zara?
goals:
  - es: Explicar qué sueles hacer en el trabajo y qué has estado haciendo hoy.
    eu: Lanean zertan aritzen zaren eta gaur zertan aritu zaren azaldu.
  - es: Contar a otros lo que te han pedido, mandado o dicho.
    eu: Besteei kontatu zer eskatu, agindu edo esan dizuten.
  - es: Contar noticias recientes con el tiempo adecuado.
    eu: Albiste berriak kontatu, denbora egokian.
guidebook:
  sections:
    - title:
        es: "Ahora, siempre, hoy: ari naiz, aritzen naiz, aritu naiz"
        eu: "Orain, normalean, gaur: ari naiz, aritzen naiz, aritu naiz"
      body:
        es: "Con el verbo en -t(z)en: «ari naiz» es lo que haces ahora mismo; «aritzen naiz», lo que sueles hacer; «aritu naiz», lo que has estado haciendo hoy y ya terminó. Siempre con «naiz, zara, da…»."
        eu: "Aditza -t(z)en forman dela: «ari naiz» orain egiten ari zarena da; «aritzen naiz», normalean egiten duzuna; «aritu naiz», gaur egiten aritu zarena, amaitu dena. Beti «naiz, zara, da…» laguntzailearekin."
      examples:
        - eu: Orain lorategia garbitzen ari naiz.
          es: Ahora estoy limpiando el jardín.
        - eu: Normalean harreran lanean aritzen naiz.
          es: Normalmente suelo trabajar en recepción.
        - eu: Gaur goizean ordenagailuak konpontzen aritu da.
          es: Esta mañana ha estado arreglando ordenadores.
    - title:
        es: "Lo que me han pedido: …-t(z)eko eskatu dit"
        eu: "Eskatu didatena: …-t(z)eko eskatu dit"
      body:
        es: "Para contar una orden o un favor, el verbo de lo pedido va en -t(z)eko: «Zaborra jaisteko eskatu dit» (me ha pedido que baje la basura). El verbo principal suele ser «eskatu», «esan» o «agindu»."
        eu: "Agindu edo mesede bat kontatzeko, eskatutako aditza -t(z)eko forman doa: «Zaborra jaisteko eskatu dit». Aditz nagusia «eskatu», «esan» edo «agindu» izan ohi da."
      examples:
        - eu: Landareak ureztatzeko eskatu dit.
          es: Me ha pedido que riegue las plantas.
        - eu: Zaborra ateratzeko esan diot.
          es: Le he dicho que saque la basura.
    - title:
        es: "No creo que…: -(e)nik"
        eu: "Ez dut uste…-(e)nik"
      body:
        es: "Tras «uste dut», «esan du»… lo que se dice termina en -(e)la. Si el verbo principal es negativo («ez dut uste», «ez du esan»), termina en -(e)nik."
        eu: "«Uste dut», «esan du»… esan ondoren, esaten denak -(e)la amaiera hartzen du. Aditz nagusia ezezkoa bada («ez dut uste», «ez du esan»), -(e)nik."
      examples:
        - eu: Lapurreta bat gertatu dela uste dut.
          es: Creo que ha habido un robo.
        - eu: Ez dut uste lapurreta bat gertatu denik.
          es: No creo que haya habido un robo.
    - title:
        es: "Hoy o ayer: iritsi da, iritsi zen"
        eu: "Gaur ala atzo: iritsi da, iritsi zen"
      body:
        es: "Con «gaur» se usa «da / du» (ha llegado, ha comido). Con «atzo», «herenegun», «duela bi egun»… se usa «zen / zuen» (llegó, comió)."
        eu: "«Gaur» esaten denean, «da / du» erabiltzen da. «Atzo», «herenegun», «duela bi egun»… esaten denean, «zen / zuen»."
      examples:
        - eu: Gaur goiz jaiki naiz.
          es: Hoy me he levantado pronto.
        - eu: Abeslaria atzo iritsi zen Bilbora.
          es: El cantante llegó ayer a Bilbao.
        - eu: Duela bi egun etxe berrira joan ginen.
          es: Hace dos días nos fuimos a la casa nueva.
levels:
  - type: lesson
    title:
      es: En el trabajo
      eu: Lanean
    lessons:
      - structures: [lanak, aritzen]
        sentences:
          - Zertan aritzen zara lanean? = ¿Qué sueles hacer en el trabajo?
          - Hotelean harreran aritzen naiz. = Suelo estar en la recepción del hotel. | Trabajo en la recepción del hotel.
          - Igerilekua garbitzen aritzen da. = Suele limpiar la piscina.
          - Ordenagailuak konpontzen aritzen gara. = Solemos arreglar ordenadores.
          - Lorategiko landareak ureztatzen aritzen dira. = Suelen regar las plantas del jardín.
          - Jatetxean zerbitzari lanean aritzen naiz. = Suelo trabajar de camarero en el restaurante. | Suelo trabajar de camarera en el restaurante.
          - Ez naiz bulegoan aritzen. = No suelo estar en la oficina.
          - Bezeroei giltza ematen diet. = A los clientes les doy la llave.
        pairs:
          - - garbitu = limpiar
            - konpondu = arreglar
            - ureztatu = regar
            - landare = planta
            - lorategi = jardín
            - harrera = recepción
        meanings:
          - text: Igerilekua garbitzen aritzen da.
            options:
              - Suele limpiar la piscina.
              - Ahora está limpiando la piscina.
              - Hoy ha limpiado la piscina.
        blanks:
          - text: Ordenagailuak ___ aritzen gara. = Solemos arreglar ordenadores.
            options:
              - konpontzen
              - konpondu
              - konpontzea
        chats:
          - messages:
              - Miren | Zertan aritzen zara lanean?
            options:
              - Harreran aritzen naiz.
              - Harreran aritu naiz.
              - Harrera hotelean dago.
        images:
          - hotel, pool, computer
      - structures: [aritu, gaur]
        sentences:
          - Gaur zertan aritu zara? = ¿Qué has estado haciendo hoy?
          - Gaur goizean etxea garbitzen aritu naiz. = Esta mañana he estado limpiando la casa.
          - Gaur arratsaldean lorategian lanean aritu gara. = Esta tarde hemos estado trabajando en el jardín.
          - Mikel ordenagailua konpontzen aritu da. = Mikel ha estado arreglando el ordenador.
          - Ez naiz lanean aritu; jaieguna da. = No he estado trabajando; es día de fiesta.
          - Umeak parkean jolasten aritu dira. = Los niños han estado jugando en el parque.
          - Zer egiten ari zara orain? = ¿Qué estás haciendo ahora?
          - Afaria prestatzen ari naiz. = Estoy preparando la cena.
        pairs:
          - - ari naiz = estoy (ahora)
            - aritzen naiz = suelo
            - aritu naiz = he estado
            - gaur = hoy
            - orain = ahora
        blanks:
          - text: Gaur arratsaldean lorategian lanean ___ gara. = Esta tarde hemos estado trabajando en el jardín.
            options:
              - aritu
              - aritzen
              - ari
          - text: Afaria prestatzen ___ naiz. = Estoy preparando la cena.
            options:
              - ari
              - aritu
              - aritzen
        chats:
          - messages:
              - Ane | Gaur zertan aritu zara?
            options:
              - Etxea garbitzen aritu naiz.
              - Etxea garbitzen aritzen naiz.
              - Etxea garbia da.
        true_false:
          - passage: Gaur Gorka ez da lanera joan. Goizean lorategian aritu da, eta arratsaldean afaria prestatzen.
            statement: Hoy Gorka ha trabajado en la oficina.
            answer: false
      - structures: [etxeko-lanak, mesedeak]
        sentences:
          - Zaborra jaitsi behar dut. = Tengo que bajar la basura.
          - Postontzia etxe aurrean dago. = El buzón está delante de casa.
          - Landareak ureztatu ditut. = He regado las plantas.
          - Mesede bat eskatu nahi dizut. = Quiero pedirte un favor.
          - Parkera paseatzera aterako naiz. = Voy a salir a pasear al parque.
          - Giltzak hartu dituzu? = ¿Has cogido las llaves?
          - Arropa lisatu eta gela garbitu dut. = He planchado la ropa y he limpiado la habitación.
        pairs:
          - - zabor = basura
            - jaitsi = bajar
            - postontzi = buzón
            - mesede = favor
            - giltza = llave
            - paseatu = pasear
        meanings:
          - text: Zaborra jaitsi behar dut.
            options:
              - Tengo que bajar la basura.
              - He bajado la basura.
              - Quiero tirar la basura.
        images:
          - bin, plate, bag
  - type: lesson
    title:
      es: Lo que me han pedido
      eu: Eskatu didatena
    lessons:
