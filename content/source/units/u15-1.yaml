          - Ez da ezer gertatu. = No ha pasado nada.
          - Inor ez da etorri. = No ha venido nadie.
          - Dena ondo dago. = Todo está bien.
          - Bihar dena kontatuko dizut. = Mañana te lo contaré todo.
          - Duela ordu bat iritsi naiz. = He llegado hace una hora.
        chats:
          - messages:
              - Uxue | Zer gertatu da?
            options:
              - Ez da ezer gertatu.
              - Ez dut ezer gertatu.
              - Inor gertatu da.
        true_false:
