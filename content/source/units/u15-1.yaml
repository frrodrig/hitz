            statement: Los amigos de Peio le prepararon una fiesta sorpresa.
            answer: true
        meanings:
          - text: Inor ez da etorri.
            options:
              - No ha venido nadie.
              - Han venido todos.
              - No ha venido nada.
  - type: story
    title:
      es: "Historia: una semana rara"
      eu: "Istorioa: aste bitxi bat"
    story:
      title: Aste bitxi bat
      lines:
        - Unai | Kaixo, Kepa! Zer moduz? Zertan aritu zara aste honetan? = ¡Hola, Kepa! ¿Qué tal? ¿Qué has estado haciendo esta semana?
        - Kepa | Lan asko! Hotelean harreran aritzen naiz, eta gaur igerilekua garbitzen ere aritu naiz. = ¡Mucho trabajo! Suelo estar en la recepción del hotel, y hoy también he estado limpiando la piscina.
        - Unai | Igerilekua? Zergatik? = ¿La piscina? ¿Por qué?
        - Kepa | Nagusiak hura garbitzeko eskatu dit, langile bat gaixo dagoelako. = El jefe me ha pedido que la limpie, porque un trabajador está enfermo.
        - Unai | Eta atzo? = ¿Y ayer?
        - Kepa | Atzo abeslari famatu bat iritsi zen hotelera! = ¡Ayer llegó un cantante famoso al hotel!
        - Unai | Bai? Nor? = ¿Sí? ¿Quién?
        - Kepa | Ezin dut esan. Nagusiak ezer ez esateko agindu digu. = No puedo decirlo. El jefe nos ha mandado no decir nada.
        - Unai | Ez dut uste abeslari famatua denik! = ¡No creo que sea un cantante famoso!
        - Kepa | Bai, bai… Laster jakingo duzu! = Sí, sí… ¡Pronto lo sabrás!
      questions:
        - afterLine: 2
          prompt: ¿Qué ha hecho Kepa hoy, además de su trabajo habitual?
          options:
            - Limpiar la piscina
            - Arreglar ordenadores
            - Regar las plantas
        - afterLine: 4
          prompt: ¿Por qué ha limpiado la piscina?
          options:
            - Porque un trabajador está enfermo
            - Porque le gusta
            - Porque llegó un cantante
        - afterLine: 8
          prompt: ¿Por qué no dice Kepa quién es el cantante?
          options:
            - Porque el jefe les ha mandado no decir nada
            - Porque no lo sabe
            - Porque no le gusta el cantante
  - type: review
  - type: challenge
    host: unai
