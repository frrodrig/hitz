              - ¡Ven mañana!
              - Vendremos mañana.
        blanks:
          - text: Etor ___ hona, mesedez. = Ven aquí, por favor.
            options:
              - zaitez
              - zara
              - zaitezte
        chats:
          - messages:
              - Amona | Etor zaitezte afaltzera!
            options:
              - Bai, orain goaz!
              - Bai, etorri gara.
              - Afaria ona da.
      - structures: [enik, uste]
        sentences:
          - Bankuan lapurreta bat gertatu dela uste dut. = Creo que ha habido un robo en el banco.
          - Ez dut uste lapurreta bat gertatu denik. = No creo que haya habido un robo.
          - Polizia etorri dela esan dute. = Han dicho que ha venido la policía.
          - Ez dute esan polizia etorri denik. = No han dicho que haya venido la policía.
          - Ez dut uste Jon gaixo dagoenik. = No creo que Jon esté enfermo.
          - Ez dut uste dirua duenik. = No creo que tenga dinero.
        pairs:
          - - denik = que sea / haya
            - dela = que es / ha
            - uste dut = creo
            - ez dut uste = no creo
            - gertatu = pasar
        blanks:
          - text: Ez dut uste lapurreta bat gertatu ___. = No creo que haya habido un robo.
            options:
              - denik
              - dela
              - da
          - text: Polizia etorri ___ esan dute. = Han dicho que ha venido la policía.
            options:
              - dela
              - denik
              - da
        meanings:
          - text: Ez dut uste dirua duenik.
            options:
