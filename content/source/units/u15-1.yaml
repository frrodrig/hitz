          - Zaborra ateratzeko eskatu dit. = Me ha pedido que saque la basura.
          - Nagusiak berandu ez etortzeko esan digu. = El jefe nos ha dicho que no lleguemos tarde.
          - Itxaroteko esan diot. = Le he dicho que espere.
          - Zer egiteko eskatu dizu? = ¿Qué te ha pedido que hagas?
          - Giltzak ekartzeko eskatu dit. = Me ha pedido que traiga las llaves.
        pairs:
          - - eskatu = pedir
            - esan = decir
            - itxaron = esperar
            - jarri = poner
            - atera = sacar
        blanks:
          - text: Ahizpak landareak ___ eskatu dit. = Mi hermana me ha pedido que riegue las plantas.
            options:
              - ureztatzeko
              - ureztatu
              - ureztatzen
          - text: ___ esan diot. = Le he dicho que espere.
            options:
              - Itxaroteko
              - Itxaroten
              - Itxarotea
        chats:
          - messages:
              - Iker | Zer esan dizu nagusiak?
            options:
              - Berandu ez etortzeko.
              - Berandu etorri naiz.
              - Nagusia berandu dago.
        meanings:
          - text: Zaborra jaisteko esan dit amak.
            options:
              - Mi madre me ha dicho que baje la basura.
              - Mi madre ha bajado la basura.
              - Le he dicho a mi madre que baje la basura.
      - structures: [agintera]
        sentences:
          - Etorri hona! = ¡Ven aquí! | ¡Venid aquí!
          - Etor zaitez hona, mesedez. = Ven aquí, por favor.
          - Etor zaitezte bihar! = ¡Venid mañana!
          - Zatozte! = ¡Venid!
          - Itxaron pixka bat! = ¡Espera un poco! | ¡Esperad un poco!
          - Jarri giltzak mahai gainean. = Pon las llaves encima de la mesa.
          - Atera zaborra, mesedez. = Saca la basura, por favor.
        pairs:
          - - etor zaitez = ven
            - etor zaitezte = venid
            - zatozte = venid (forma corta)
            - itxaron = espera
            - jarri = pon
        meanings:
          - text: Etor zaitezte bihar!
            options:
