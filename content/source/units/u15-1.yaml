          - Hotel batean dago. = Está en un hotel.
          - Jendeak argazkiak atera zituen. = La gente hizo fotos. | La gente sacó fotos.
          - Abeslaria oso pozik zegoen. = El cantante estaba muy contento.
          - Kontzertua laster hasiko da. = El concierto empezará pronto.
          - Ezuste handia izan da! = ¡Ha sido una gran sorpresa!
