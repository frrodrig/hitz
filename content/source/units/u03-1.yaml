# Unit 3.1 · Nire jendea — family and friends: NOREN, NOREKIN, BIZI IZAN.
# Source format: see docs/content-guide.md and u01-1.yaml.
id: u03-1
section: s1
bookUnit: 3
title:
  es: Mi gente
  eu: Nire jendea
goals:
  - es: Presentar a tu familia y a tus amigos y decir de quién es cada persona.
    eu: Zure familia eta lagunak aurkeztu eta nor noren den esan.
  - es: Decir dónde vive alguien.
    eu: Norbait non bizi den esan.
  - es: Decir con quién vive alguien.
    eu: Norbait norekin bizi den esan.
guidebook:
  sections:
    - title:
        es: "Posesivos: nire, zure, gure…"
        eu: "Posesiboak: nire, zure, gure…"
      body:
        es: Los posesivos van delante del nombre, como en castellano. nire (mi), zure (tu, su de usted), haren o bere (su, de él o ella), gure (nuestro), zuen (vuestro), haien (su, de ellos).
        eu: Posesiboak izenaren aurrean doaz. nire, zure, haren edo bere, gure, zuen eta haien.
      examples:
        - eu: Hau nire ama da.
          es: Esta es mi madre.
        - eu: Hauek gure gurasoak dira.
          es: Estos son nuestros padres.
        - eu: Zuen aita irakaslea da?
          es: ¿Vuestro padre es profesor?
    - title:
        es: "¿De quién? Noren?"
        eu: "Noren?"
      body:
        es: Para decir «de Ane» se añade -(r)en al nombre, que va delante; los nombres comunes llevan el artículo, -aren. Esta forma también va delante de palabras como «ondoan» o «aurrean».
        eu: Izen bereziari -(r)en gehitzen zaio, eta izen arruntari -aren. Forma hori «ondoan» edo «aurrean» bezalako hitzen aurrean ere joaten da.
      examples:
        - eu: Mikel Aneren neba da.
          es: Mikel es el hermano de Ane.
        - eu: Mutilaren ama medikua da.
          es: La madre del chico es médica.
        - eu: Ane bere amaren ondoan dago.
          es: Ane está al lado de su madre.
    - title:
        es: Hermano y hermana
        eu: Anaia, neba, arreba, ahizpa
      body:
        # TODO(revisión-nativa): confirmar la explicación del uso actual de anaia/neba y arreba/ahizpa.
        es: En euskera la palabra depende de quién habla. Un chico dice «anaia» (hermano) y «arreba» (hermana); una chica dice «neba» (hermano) y «ahizpa» (hermana). Hoy muchas chicas también dicen «anaia».
        eu: Hitza nork esaten duen araberakoa da. Mutil batek «anaia» eta «arreba» esaten ditu; neska batek, «neba» eta «ahizpa». Gaur egun neska askok «anaia» ere esaten dute.
      examples:
        - eu: Ane Jonen arreba da.
          es: Ane es la hermana de Jon.
        - eu: Ane Maialenen ahizpa da.
          es: Ane es la hermana de Maialen.
        - eu: Mikel eta Jon anaiak dira.
          es: Mikel y Jon son hermanos.
    - title:
        es: "Vivir: bizi naiz. ¿Con quién? Norekin?"
        eu: "Bizi izan eta norekin"
      body:
        es: "«Bizi» va con el verbo «izan»: bizi naiz (vivo), bizi zara (vives), bizi da (vive). «Con» se dice con -(r)ekin al final de la palabra: Anerekin, amarekin, lagunekin."
        eu: "«Bizi» izan aditzarekin doa: bizi naiz, bizi zara, bizi da. «Norekin?» galderari -(r)ekin atzizkiarekin erantzuten zaio."
      examples:
        - eu: Non bizi zara? Bilbon bizi naiz.
          es: ¿Dónde vives? Vivo en Bilbao.
        - eu: Norekin bizi zara?
          es: ¿Con quién vives?
        - eu: Nire gurasoekin bizi naiz.
          es: Vivo con mis padres.
    - title:
        es: "En euskera, en castellano: euskaraz, gaztelaniaz"
        eu: "Euskaraz eta gaztelaniaz"
      body:
        es: "Para decir en qué idioma se habla se añade -z: euskaraz (en euskera), gaztelaniaz (en castellano). «Hitz egiten du» (habla) y «euskara ikasten ari da» (está aprendiendo euskera) se aprenden por ahora como frases hechas. Recuerda también «ere» (también), «baina» (pero) y «edo» (o)."
        eu: "Hizkuntza esateko -z gehitzen da: euskaraz, gaztelaniaz. «Hitz egiten du» eta «euskara ikasten ari da» esaldi finko gisa ikasten dira oraingoz."
      examples:
        - eu: Nire aitona Madrilgoa da, baina euskara ikasten ari da.
          es: Mi abuelo es de Madrid, pero está aprendiendo euskera.
        - eu: Euskaraz hitz egiten du, eta gaztelaniaz ere bai.
          es: Habla en euskera, y en castellano también.
