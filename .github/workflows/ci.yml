name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    name: Contenido
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Temario sincronizado con vocabulary.csv
        run: |
          if [ -f tools/syllabus_vocab.py ]; then python3 tools/syllabus_vocab.py --check; else echo "Sin temario todavía"; fi

  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: detekt (ktlint) + Android Lint + tests unitarios + build debug
        run: .github/scripts/gradlew-annotated.sh --continue detekt lintDebug testDebugUnitTest assembleDebug
      - name: Subir APK debug
        uses: actions/upload-artifact@v7
        with:
          name: hitz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/detekt/
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
          retention-days: 7
