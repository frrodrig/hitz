name: UI tests

on:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Re-record the Roborazzi reference screenshots and open a PR with them"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshot tests (Roborazzi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Verify screenshots
        if: ${{ !inputs.record_screenshots }}
        run: .github/scripts/gradlew-annotated.sh verifyRoborazziDebug
      - name: Record screenshots
        if: ${{ inputs.record_screenshots }}
        run: .github/scripts/gradlew-annotated.sh recordRoborazziDebug
      - name: Open a PR with the new screenshots
        if: ${{ inputs.record_screenshots }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A '*/src/test/screenshots/*.png' '*/schemas/*.json'
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          branch="test/screenshots-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "test: update Roborazzi reference screenshots and Room schemas"
          git push origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "test: update Roborazzi reference screenshots" \
            --body "Recorded by the UI tests workflow (run ${{ github.run_id }})."
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi
          path: |
            **/src/test/screenshots/
            **/build/outputs/roborazzi/
          retention-days: 14

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - name: Build test APKs
        run: .github/scripts/gradlew-annotated.sh assembleDebug assembleDebugAndroidTest
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/gradlew-annotated.sh connectedDebugAndroidTest
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/"
          retention-days: 7
