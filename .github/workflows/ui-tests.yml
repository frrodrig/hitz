name: UI tests

on:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Regenerar las capturas de referencia de Roborazzi en vez de compararlas"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshot tests (Roborazzi)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Comparar capturas
        if: ${{ !inputs.record_screenshots }}
        run: ./gradlew verifyRoborazziDebug
      - name: Grabar capturas
        if: ${{ inputs.record_screenshots }}
        run: ./gradlew recordRoborazziDebug
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi
          path: |
            **/src/test/screenshots/
            **/build/outputs/roborazzi/
          retention-days: 14

  instrumented:
    name: Tests instrumentados (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Compilar APKs de test
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Ejecutar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest
      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: "**/build/reports/androidTests/"
          retention-days: 7
