name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HITZ_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      HITZ_KEYSTORE_PASSWORD: ${{ secrets.HITZ_KEYSTORE_PASSWORD }}
      HITZ_KEY_ALIAS: ${{ secrets.HITZ_KEY_ALIAS }}
      HITZ_KEY_PASSWORD: ${{ secrets.HITZ_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Calcular versión a partir del tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::El tag debe tener la forma vMAJOR.MINOR.PATCH (recibido: $GITHUB_REF_NAME)"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HITZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto HITZ_KEYSTORE_BASE64"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HITZ_KEYSTORE_PATH"
      - name: Compilar AAB y APK firmados
        run: >
          ./gradlew bundleRelease assembleRelease
          -Phitz.versionName=${{ steps.version.outputs.name }}
          -Phitz.versionCode=${{ steps.version.outputs.code }}
      - name: Preparar ficheros
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/hitz-${{ steps.version.outputs.name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/hitz-${{ steps.version.outputs.name }}.apk"
      - name: Crear GitHub Release con changelog automático
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Hitz ${{ steps.version.outputs.name }}" --generate-notes
      - name: Borrar keystore
        if: always()
        run: rm -f "$HITZ_KEYSTORE_PATH"
