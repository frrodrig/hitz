name: Voices

# Synthesises the course audio with Piper (tools/audio/cast_voices.py) on a runner, which can
# reach Hugging Face for the Basque voice models, and opens a PR with the new clips against the
# branch it ran on. It runs by itself when a branch changes the course or the generator, and can be
# run by hand (Actions → Voices → Run workflow). CI's `cast_voices.py check` fails while the audio
# is out of date. Only changed clips are synthesised.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, "audio/**", "test/**", "dependabot/**"]
    paths:
      - "content/**"
      - "core/data/src/main/assets/courses/**"
      - "tools/audio/cast_voices.py"

concurrency:
  group: voices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install Piper, the content tools and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet -r tools/requirements.txt piper-tts
      - name: Download the Basque voices
        run: python3 tools/audio/cast_voices.py download models
      - name: Synthesise the clips that changed
        run: python3 tools/audio/cast_voices.py generate models
      - name: Check
        run: python3 tools/audio/cast_voices.py check
      - name: Open a PR with the audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A core/data/src/main/assets/audio/tts
          if git diff --cached --quiet; then echo "Audio unchanged"; exit 0; fi
          branch="audio/voices-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "chore(audio): synthesise the course audio"
          git push -q origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "chore(audio): synthesise the course audio" \
            --body "Generated by the Voices workflow (run ${{ github.run_id }}): $(git show --stat --format= HEAD | tail -1)."
