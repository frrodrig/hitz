name: Content or Basque language issue
description: A wrong sentence, a doubtful translation or a broken audio clip
labels: [content]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: Exercise or unit id (shown on the feedback screen).
      placeholder: "u02-1.l3.e07"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong and what should it be?
    validations:
      required: true
